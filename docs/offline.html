д трекерная группа активнее контроля, хотя часы носили лишь 10%","pochemu":"Привычка отчасти пережила сами часы: спад активности меньше, чем без трекера.","primer":"Сингапур, Финкельштейн 2016: через год +37 минут активности в неделю к контролю."}],"killer":"Один пропущенный день привычку не ломает. Ломает её диван.","image":"Страховочные колёса на велосипеде: снимают, когда человек научился ехать.","attacks":["Здоровье за год не сдвинул никто. Но трекерная группа: +37 минут в неделю.","Ортосомния — у 3–14% всех опрошенных в одном опросе 2024. Это не норма.","10 000, вероятно, из рекламы — согласны. Поэтому цель мягкая: польза есть и ниже."],"ask":["Что вы предложите малоподвижному человеку вместо кольца: сегодня, бесплатно, без тренера?","Ортосомнию нашли у 3–14% в одном опросе. Почему судить по меньшинству?"],"expect":[{"q":"Цифра управляет тобой, а не ты ею. Какая же это дисциплина?","a":"Цифра — зеркало, решение остаётся за человеком: цель меняют, серию ставят на паузу. Без зеркала управляет диван."},{"q":"Тревожный человек как раз не отключает цель. Одно касание не помогает?","a":"Тревожному труднее, согласен: ему помогут пауза и отключённые цели. Но для сидячего большинства цель мягкая, редкий риск пользу не отменяет."},{"q":"Исчезнет приложение — исчезнет привычка?","a":"Нет. В Сингапуре к году трекер носили 10%, а активность осталась выше контроля на 37 минут в неделю."}],"infokiller":[{"q":"Ортосомния: часы ухудшают сон. Вы это отрицаете?","a":"Нет, но это меньшинство: в опросе 2024 (523 человека) ортосомния у 3–14%. Один срез, причину он не доказывает."},{"q":"Ли 2019: плато 7500 шагов, не 10 000. Вы продаёте миф?","a":"Согласны: 10 000, вероятно, из рекламы. Ли и Палюх видят пользу ниже: 4400 связаны с меньшей смертностью у женщин 62+."},{"q":"Серия дней наказывает за болезнь и отпуск. Это игра на вине?","a":"В Apple Watch с watchOS 11 кольца ставят на паузу, серия наград не сгорает. Один пропуск привычку не ломает (Лалли)."}]},"protiv":{"criterion":"Судим по тесту отключения: без часов привычка остаётся или пропадает?","theses":[{"tezis":"Трекер бросают, а здоровье от него не меняется","pochemu":"Новизна проходит: к году трекером пользовались лишь 10% участников.","primer":"Сингапур, Финкельштейн 2016: улучшений здоровья нет ни в одной группе."},{"tezis":"Серии и графики сна кормят страх потери и тревогу о «плохой» ночи","pochemu":"Человек верит графику больше самочувствия. Пропуск выглядит как потеря, а не отдых.","primer":"Ортосомния, Барон 2017: три пациента гнались за идеальным сном по данным трекера."},{"tezis":"Круглое число из рекламы делает недобор виной, хотя польза начинается раньше","pochemu":"Число, вероятно, из рекламы шагомера, а польза растёт с первых тысяч шагов.","primer":"Шагомер «Манпо-кэй», 1965. Ли 2019: у пожилых женщин плато около 7 500."}],"killer":"Часы можно снять. Привычка, которой без них нет, не привычка.","image":"Детские колёсики на велосипеде: сняли, и без них ехать не умеют.","attacks":["+37 минут в Сингапуре — меньший спад, а не рост. Здоровье не улучшилось.","Ferguson: +1800 шагов — среднее по обзорам. Сколько из этого держалось после отключения?","Пауза серии есть, но тревожный человек цель не снимает. Серия держит."],"ask":["Что делает человек, если часы разрядились: гуляет или считает прогулку не засчитанной?","Сколько человек ходит через год после того, как часы убрали?"],"expect":[{"q":"Ортосомния описана у единиц. Вы судите по редким случаям?","a":"Опрос 2024, 523 человека: ортосомния у 3–14%. Но мой критерий другой: что остаётся без часов. Серии бьют по страху потери."},{"q":"Тревогу выключает одно касание: убрать цель и уведомления. В чём проблема?","a":"Выключают спокойные. Тревожный не снимает цель: серия держит. Симпсон и Маццео 2017, 493 студента: трекинг связан с симптомами РПП; причина не доказана."},{"q":"Малоподвижному трекер помогает начать. Чем заменить, если не часами?","a":"Прогулка в одно время, друг, расписание: привычка привязана к жизни, не к числу. Старт не оспариваю; спор о том, что потом."}],"infokiller":[{"q":"Исследования: шаги снижают смертность. Что ответите?","a":"Согласен, ходить полезно. Но Ли 2019, пожилые женщины: плато около 7 500, не 10 000. Круглая цель превращает полезные 6 000 в провал."},{"q":"Есть данные, что трекеры массово вызывают тревожность?","a":"Опрос 2024: ортосомния у 3–14% опрошенных, среди владельцев трекеров сна — от 9 до 41%. Ещё связь трекинга с РПП (2017)."},{"q":"Часы показывают недосып, и люди ложатся раньше. Разве не польза?","a":"Для части людей да. Но у тревожных данные сна кормят ортосомнию: 3–14% в опросе 2024 (Jahrami)."}]},"arsenal":{"stats":[{"fact":"Трекеры активности в среднем добавляли около 1800 шагов в день (обзор 39 обзоров, 163 992 участника)","source":"Ferguson et al., Lancet Digital Health","year":2022,"url":"https://pubmed.ncbi.nlm.nih.gov/35868813/","verified":true},{"fact":"7000 шагов в день против 2000 связаны с риском смерти ниже на 47%; перегиб пользы около 5000–7000 шагов","source":"Ding et al., Lancet Public Health (метаанализ)","year":2025,"url":"https://doi.org/10.1016/S2468-2667(25)00164-1","verified":true}],"quote":{"text":"Когда мера становится целью, она перестаёт быть хорошей мерой (перевод).","author":"Мэрилин Стратерн (1997) вслед за Хоскином; формулировка закона Гудхарта (1975)","verified":true,"url":"https://en.wikipedia.org/wiki/Goodhart%27s_law"},"life":"Вспомни реальный случай: счётчик шагов или сна заставил тебя или знакомого что-то поменять, или делал ты это ради цифры."},"traps":[{"problem":"Соперник скажет: вы против спорта и здорового образа жизни.","exit":"Сразу: за движение, против привязки к числу. Тест: что остаётся без часов?"},{"problem":"Соперник: ортосомния редка, по единицам судить нельзя.","exit":"Согласиться: это меньшинство, 3–14% в опросе 2024. Критерий не частота, а тест отключения и страх потери."},{"problem":"Соперник приведёт подростка с расстройством питания из-за колец и шагов.","exit":"Признать: уязвимым подсчёт цифр может вредить, им цели лучше отключить. Вернуть критерий: большинство и отключаемость."}],"verdict":{"winner":"protiv","why":"ПРОТИВ сильнее: тест отключения («что остаётся без часов») не опровергнут, а ЗА признал, что тревожным цель тяжелее. Польза шагов (Ли, Ferguson) критерий не отменяет."}},"okr-25":{"core":"ИИ-мультфильмы: новая страница индустрии или риск, который общество недооценивает?","za":{"criterion":"Судите по поведению отрасли: студии и профсоюзы уже встраивают ИИ в работу и договоры.","theses":[{"tezis":"Старые студии берут ИИ в рутину, а не вместо авторов","pochemu":"Покадровая механика дорога; идеи, персонажи и режиссура остаются людям.","primer":"«Союзмультфильм» заявил ТАСС: ИИ — для фонов, света и поиска ошибок; творчество за людьми."},{"tezis":"Цена входа падает: полный метр становится по силам малой студии","pochemu":"ИИ удешевляет производство, а идея и сюжет остаются у авторов.","primer":"Иркутский «Самовар» заявил полный метр на 2027–2028, в 5–10 раз дешевле обычного."},{"tezis":"Правила пишутся заранее: договоры уже защищают оплату и работу людей","pochemu":"Риск замечен: профсоюзы выторговали гарантии до массового выпуска, а не после катастрофы.","primer":"IATSE 2024: потерявшему работу из-за ИИ — пособие и переобучение; Animation Guild: оплата и титры целы."}],"killer":"Отрасль не боится ИИ, а пишет для него правила.","image":"Лифт: люди поехали не после запретов, а после тормозов и правил.","attacks":["Jo Jo Funland — ферма, не студия; письмо Fairplay от ~200 организаций и экспертов. Риск виден.","Обучение на чужом решают суды: Disney судится с Midjourney, вопрос не брошен.","Защита не только на бумаге: договор IATSE даёт уволенному из-за ИИ пособие и переобучение."],"ask":["Если риск не измерен, почему около 200 организаций и экспертов и профсоюз выдвинули требования?","Jo Jo Funland — студия или канал-ферма? Чем он доказывает кризис анимации?"],"expect":[{"q":"Disney судится с Midjourney. Разве это не доказывает кражу у авторов?","a":"Доказывает, что рынок реагирует: правообладатель идёт в суд, а не молчит. Обучение решают договоры и суды, не запрет."},{"q":"Профсоюз аниматоров не добился запрета ИИ. Разве это не провал?","a":"Запрета нет, но есть уведомление об ИИ и условие не урезать оплату и титры (Animation Guild, 2024). Это договор, не паника."},{"q":"Дети смотрят мультфильмы. Кто отвечает за ИИ-слоп вроде Jo Jo Funland?","a":"Платформа и владелец канала. Это ферма, не студия. После статьи The 74 YouTube закрыл семь каналов."}],"infokiller":[{"q":"Есть ИИ-мультфильм, который окупился в прокате?","a":"Окупившегося нет: Critterz пропустил Канны и перенесён на 2027, «Самовар» — на 2027–2028. Судите по цене входа и правилам."},{"q":"Sora закрыта, сделка Disney с OpenAI тоже. Технология провалилась?","a":"Закрыт один сервис OpenAI, с ним и сделка Disney. Рутина «Союзмультфильма» и Kandinsky у Сбера работают."},{"q":"Российские студии вообще используют ИИ в анимации?","a":"«Союзмультфильм»: ИИ в рутине, анимация станет гибридом традиционных технологий и ИИ. Ролик со Сбером на AI Journey — эксперимент."}]},"protiv":{"criterion":"Судим по разрыву: риск назван вслух, а правил и ответственного нет.","theses":[{"tezis":"Дети смотрят ИИ-мультфильмы, а проверяющего у потока нет","pochemu":"YouTube требует метку ИИ только для «реалистичного»; мультфильмы под правило не попадают.","primer":"Jo Jo Funland: 10 000+ роликов за семь месяцев, около 50 в день."},{"tezis":"Обучение на чужих мультфильмах не решено: иски есть, ответа нет","pochemu":"Студии судятся, споры не решены; у малых авторов нет ни денег на иск, ни сделки.","primer":"Сентябрь 2025: Disney, Universal и Warner Bros. Discovery подали иск против видеогенератора MiniMax."},{"tezis":"Защита аниматоров на бумаге: договор не даёт запретить учить модель на их работах","pochemu":"Студия обязана лишь уведомить и обсудить; отказаться от ИИ в работе нельзя.","primer":"Animation Guild и студии США, договор 2024–27."}],"killer":"Риск назван вслух, но ответственного за него нет.","image":"Знак «осторожно, дети» стоит давно; светофора и полиции на перекрёстке нет.","attacks":["«Самовар» — тоже план: срок уже сдвигали, фильма нет. Дешёвый ИИ первым достался каналам-фермам.","«Flow» взял Оскар с бюджетом €3,5 млн на бесплатном Blender. Дёшево можно без чужого.","Забастовки 2023 — сценаристы и актёры. Аниматорам в 2024 дали лишь «уведомить»."],"ask":["Назовите пункт договора аниматоров, запрещающий учить модель на их работах.","Назовите студию, которая отвечает за 50 ИИ-роликов в день для малышей."],"expect":[{"q":"Профсоюзы и суды уже занялись рисками. Значит, они не недооценены?","a":"Оценить — не значит защитить. Договор аниматоров 2024: уведомить и обсудить, учить модель на их работах не запретить. Иски ещё идут."},{"q":"ИИ берёт рутину, режиссёр остаётся. Что в этом плохого?","a":"Рутина — ступенька новичка: фоны, промежуточные кадры. Уберёте её — не вырастут будущие режиссёры. Это механизм, цифр нет."},{"q":"YouTube закрыл каналы после жалоб. Значит, система работает?","a":"Закрыл после расследования журналистов, а не своей проверки. Метка ИИ на YouTube обязательна только для реалистичного видео, мультфильмов не касается."}],"infokiller":[{"q":"Есть данные, что ИИ-мультфильмы вредят детям?","a":"Данных о вреде не назову. Журналисты нашли ошибки в «обучающих» роликах и детей без ремней. Измерений нет — это и есть недооценка."},{"q":"ИИ — просто инструмент, как карандаш. Что тут нового?","a":"Карандаш не учился на чужих рисунках и не выпускает 50 роликов в день без редактора. Новое — масштаб и источник обучения."},{"q":"Стиль Ghibli в тренде, людям нравится. Спрос не оправдывает?","a":"Стиль авторским правом не защищён, согласны. Спор о другом: обучение на целых фильмах и поток для детей. Нравится — не значит безопасно."}]},"arsenal":{"stats":[{"fact":"Контракт Animation Guild 2024–27 принят 76,1% голосов: уведомление об ИИ, ИИ не должен урезать оплату и титры; запрета нет","source":"The Hollywood Reporter; Variety","year":2024,"url":"https://www.hollywoodreporter.com/business/business-news/animation-guild-ratifies-2024-27-contract-1236092993/","verified":true},{"fact":"Канал Jo Jo Funland выложил больше 10 000 ИИ-роликов для детей за семь месяцев, около 50 в день; ошибки в «обучающих» песнях, дети без ремней","source":"The 74","year":2026,"url":"https://www.the74million.org/zero2eight/ai-slop-is-flooding-childrens-media-parents-should-be-very-alarmed/","verified":true}],"quote":{"text":"Генеративный ИИ — мне это не интересно, и никогда не будет интересно. (I am not interested, nor will I ever be interested.)","author":"Гильермо дель Торо, режиссёр «Пиноккио», интервью NPR Fresh Air, 23 октября 2025 (перевод)","verified":true,"url":"https://www.tpr.org/arts-culture/2025-10-23/filmmaker-guillermo-del-toro-says-id-rather-die-than-use-generative-ai"},"life":"Вспомни реальный случай: странный «детский» ролик в ленте у себя или младшего родственника, или мультфильм, который хотел бы снять. Только реальное."},"traps":[{"problem":"Соперник или эксперт: Sora закрыта, сделка Disney закончилась вместе с ней, Critterz без итога.","exit":"Признать: закрыт один продукт OpenAI, с ним и сделка Disney. Спор про отрасль и правила; Kandinsky и «Союзмультфильм» работают."},{"problem":"Соперник: профсоюз не получил запрет обучения на своих работах и отказ от ИИ.","exit":"Согласиться. Получил уведомление и защиту оплаты и титров. Торг продолжается, значит риск виден."},{"problem":"Соперник: Jo Jo Funland — слоп на YouTube, а не индустрия мультфильмов, смена темы.","exit":"Это мультфильмы для малышей, сделанные ИИ; для ребёнка это мультфильм. Вернуть вопрос: кто за поток отвечает."}],"verdict":{"winner":"za","why":"Риск назван и уже торгуется: иски, договоры с пособием и переобучением, требования к YouTube. «Недооценка» ПРОТИВ держится на детском потоке без маркировки. Слабое место ЗА: вышедшего ИИ-полного метра пока нет."}},"okr-26":{"core":"Список требований к партнёру: порог безопасности или сито, отсекающее людей до встречи?","za":{"criterion":"Судите по праву отказа: избирательность — свобода выбрать, потребительство — требовать, ничего не давая.","theses":[{"tezis":"Зарплата в списке — страховка на декрет, а не жадность","pochemu":"Если родитель сидит с ребёнком, доход падает до пособия, а расходы растут.","primer":"Пособие по уходу до 1,5 лет — 40% среднего заработка."},{"tezis":"Чек-лист — порог «достаточно хорошо», он защищает от вечного поиска","pochemu":"Довольнее те, у кого есть порог и они на нём останавливаются, а не ищут лучшее.","primer":"Schwartz 2002: максимизаторы менее довольны выбором, чем «удовлетворяющиеся» — те, у кого есть порог."},{"tezis":"Список заранее отсекает несовместимое: дети, переезд, вредные привычки","pochemu":"Такие расхождения не решить компромиссом, лучше узнать их до свадьбы.","primer":"Один хочет детей, другой нет: уступит кто-то один, и обида останется."}],"killer":"Отказать можно за что угодно. Чек-лист честно называет причину заранее.","image":"Маршрутный лист в походе: не диктует погоду, но не даёт свернуть в болото.","attacks":["Ваши «надёжность и уважение» — тот же чек-лист, только без цифр.","Speed-dating измеряет искру за минуты; список проверяет декрет, жильё, цели — другое.","Траекторию видно и у студента: учёба, планы, привычки — это тоже пункты списка."],"ask":["Вы признали красные флаги обязательными. Чем это не чек-лист?","Отказать можно из-за неприязни. Почему нельзя из-за дохода или целей?"],"expect":[{"q":"Рост и машина не держат пару. Зачем они в списке?","a":"Тема — про список вообще, рост и машина — лишь примеры. Список взаимен: партнёр вправе отказать, никто не обязан соответствовать."},{"q":"Зарплата меняется за месяцы: кризис, сокращение. Какая это гарантия?","a":"Поэтому смотрят траекторию: образование, стаж, накопления. Гарантий нет ни у цифры, ни у «надёжности»: список снижает риск, не обнуляет."},{"q":"Каждый пункт отсекает людей. Три пункта — и выбирать не из кого?","a":"Круг сужается, и это решение человека: подождать или согласиться на меньшее. Порог «достаточно хорошо» защищает от вечного поиска идеала."}],"infokiller":[{"q":"Есть данные, что жёсткие критерии ведут к одиночеству?","a":"Прямых цифр не назову. Исследование Истуика и Финкеля про искру на speed-dating, не про браки. Список проверяет условия жизни."},{"q":"Пособие теперь не мешает работать. Зачем порог по зарплате партнёра?","a":"Работать с младенцем на руках могут не все и не всегда. Страховку берут на трудный случай, а не на удачный."},{"q":"Любовь не по списку. Как быть с влюблённостью в «неподходящего»?","a":"Чувства никто не отменяет. Список задаёт вопрос заранее: потянем ли ипотеку и декрет вдвоём. Решает человек."}]},"protiv":{"criterion":"Судим по пунктам из темы: рост, зарплата, машина — про человека или параметры?","theses":[{"tezis":"Рост, зарплата и машина — витрина, а не то, что держит пару","pochemu":"Пару держат надёжность, уважение, умение договариваться; в анкете этого нет.","primer":"Кризисы и сокращения меняют доход за месяцы; надёжность человека остаётся."},{"tezis":"Заявленные пункты плохо предсказывают, кто понравится вживую","pochemu":"Заранее не знаешь, что зацепит; чек-лист отсекает до встречи.","primer":"Истуик и Финкель 2008: заявленная важность внешности и перспектив дохода не предсказала живой интерес."},{"tezis":"Порог по сегодняшней зарплате отсекает тех, кто ещё растёт","pochemu":"У студентов и молодых доход ещё не сложился, а характер уже виден.","primer":"Студент без зарплаты сегодня не пройдёт порог, хотя через годы может стать специалистом."}],"killer":"Чек-лист выбирает параметры, а жить придётся с человеком.","image":"Сито с мелкими ячейками: чем мельче, тем меньше проходит, и в итоге пусто.","attacks":["Декрет через годы, а зарплата меняется за месяцы: сегодняшняя цифра страхует слабо.","Шварц — про выбор вообще; порог можно держать по поступкам, а не по цифрам.","Про детей и переезд спрашивают в разговоре; список отсекает человека до него."],"ask":["Какой пункт чек-листа предскажет, что человек не бросит при болезни?","Рост, зарплата, машина: какой из них вы готовы считать обязательным?"],"expect":[{"q":"Разве плохо знать, чего хочешь? Без требований выберешь кого попало.","a":"Знать ценности хорошо: надёжность, уважение, цели. Это не рост и не машина из темы. Красные флаги — граница, а не чек-лист."},{"q":"Зарплата влияет на общий бюджет (ст. 34 СК). Спрашивать честно разве не нужно?","a":"О работе, планах и долгах спрашивать нужно. Но ставить зарплату порогом — значит отсекать человека до встречи; бюджет строят вдвоём."},{"q":"Список взаимный: проверяют и вас. Чем это потребительство?","a":"Взаимность не меняет метод: двое оценивают друг друга по параметрам. Потребительство — когда человек сводится к пунктам, а не к поступкам."}],"infokiller":[{"q":"Есть данные, что жёсткие критерии ведут к одиночеству?","a":"Прямых данных про одиночество не назову. Есть speed-dating 2008: заявленные идеалы не предсказали первую симпатию. Это про искру, не про браки."},{"q":"Предпочтения есть у всех. Вы их запрещаете?","a":"Нет. Предпочтения и красные флаги нормальны. Спор о цифрах-порогах: рост, зарплата, машина отсекают человека до разговора."},{"q":"Три пункта — это много? Откуда пустота?","a":"Каждый порог отсекает часть людей, три порога подряд — многих. Точных цифр не назову: это арифметика отбора."}]},"arsenal":{"stats":[{"fact":"Пособие по уходу за ребёнком до 1,5 лет — 40% среднего заработка, но не меньше установленного минимума","source":"ФЗ № 81-ФЗ «О государственных пособиях гражданам, имеющим детей»; памятка СФР","year":2026,"url":"https://sfr.gov.ru/files/branches/kaliningrad/2026/Naznachenieivyiplataejemesyachnogoposobiyapouhoduzarebenkom.docx","verified":true},{"fact":"В speed-dating заявленная важность внешности и перспектив дохода партнёра не предсказала реальный интерес к людям, встреченным вживую","source":"Eastwick, Finkel. Journal of Personality and Social Psychology","year":2008,"url":"https://doi.org/10.1037/0022-3514.94.2.245","verified":true}],"quote":{"text":"La liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui.","author":"Декларация прав человека и гражданина, ст. 4 (1789), французский оригинал; по-русски: свобода — делать всё, что не вредит другому (вольный перевод)","verified":true},"life":"Вспомни реальную пару, которая не подошла бы по списку, но живёт хорошо, или свои требования к друзьям. Только реальное."},"traps":[{"problem":"Соперник приводит абсурдный список: рост 190, доход, машина.","exit":"Любой пункт можно довести до абсурда. Защищаем порог «достаточно хорошо», взаимность и право партнёра отказать."},{"problem":"Скажут: вы за то, чтобы терпеть любого, включая абьюзеров.","exit":"Красные флаги обязательны, но это не рост и зарплата. Мы против цифровых порогов, не против границ."},{"problem":"Спор уходит в то, верно ли пересказаны исследования.","exit":"Признать рамки: про первую симпатию и про выбор вообще. Держать механизм: порог или сито, до встречи или после."}],"verdict":{"winner":"protiv","why":"ЗА защитил порог и страховку на декрет, но рост и машину свёл к примерам без доказанной пользы. ПРОТИВ точнее держит тему: параметры отсекают человека до встречи, рамки исследований оговорены честно."}},"okr-27":{"core":"Госсервис знакомств: проверенные анкеты или база «кого ищу» в руках государства?","za":{"criterion":"Судите по добровольности и закону: согласие, отзыв и удаление данных — не вмешательство.","theses":[{"tezis":"Госсервис проверяет то, что частное приложение проверить не может","pochemu":"Паспорт, возраст и семейный статус есть в госреестрах; у частных — селфи и самоописание.","primer":"Милонов, 2024: раздел знакомств на Госуслугах; женатым анкету не дадут."},{"tezis":"Спрос на проверенные знакомства есть: люди сами несут документы","pochemu":"Документы на входе отсекают фейки; люди готовы на это ради серьёзных отношений.","primer":"Токио: около 36 тыс. заявок, хотя требовали справки и интервью."},{"tezis":"Закон уже даёт контроль над данными: согласие, отзыв, удаление","pochemu":"Ст. 24: сбор только с согласия; 152-ФЗ: после отзыва — уничтожение по общему правилу.","primer":"Отзыв согласия: 30 дней на уничтожение, если закон не даёт иного основания."}],"killer":"Женат ли он, частное приложение не проверит. Госсервис — может.","image":"Вахтёр на входе: за руку никого не ведёт, но чужих не пускает.","attacks":["Анкета отдельная и по согласию (ст. 24); закон должен прямо требовать удаления после отзыва.","Фильтры выбирает сам пользователь: без его согласия доход и долги не показывать.","Отметка «личность подтверждена» не покажет, женат ли человек."],"ask":["Ст. 24: сбор данных допустим с согласия. Что нарушено при добровольной анкете?","Как частное приложение проверит, что пользователь не женат?"],"expect":[{"q":"Госуслуги знают «кто вы». Анкета добавляет «кого ищете»: это опаснее?","a":"Анкета отдельная и необязательная. По 152-ФЗ после отзыва — удаление за 30 дней; требуем закрепить это в законе о сервисе. Плюс аудит."},{"q":"Токио требует справку о доходе. Это отбор людей государством?","a":"Справки нужны против фейков, вход добровольный. Для России достаточно верификации и фильтров пользователя, не подбора по идеологии."},{"q":"Кто отвечает за утечку? РКН насчитал 103 утечки за 10 месяцев 2025-го.","a":"Оператор отвечает по 152-ФЗ: отдельное хранение, аудит. Утечки бывают и у частных: это довод про защиту, не запрет."}],"infokiller":[{"q":"Госбаза сводится с паспортом, доходом, адресом. Частную анкету хотя бы можно удалить.","a":"По общему правилу 152-ФЗ — 30 дней на уничтожение, если закон не даёт иного основания. Требуем: закон о сервисе прямо запрещает хранение после отзыва."},{"q":"Милонов предложил раздел знакомств на Госуслугах. Это не идеология?","a":"Автор идеи не критерий. Судим по условиям: добровольность, верификация, отдельное хранение, право удаления."},{"q":"Токио: 265 браков на 16 тысяч участников. Это успех?","a":"Скромный, но настоящий: 760 пар и 265 браков с сентября 2024 по июнь 2026. Главное — спрос: 36 тысяч заявок."}]},"protiv":{"criterion":"Судим по данным: что собирают, кто сводит с паспортом и можно ли стереть.","theses":[{"tezis":"Госсервис сводит паспорт и «кого ищу» в одной базе","pochemu":"«Кого ищу» может касаться интимной жизни — спецкатегория (152-ФЗ, ст. 10); утечку не отменишь.","primer":"РКН, январь–октябрь 2025: 103 утечки, ~50 млн записей. А здесь ещё паспорт и предпочтения."},{"tezis":"Госсервис превращается в скоринг жениха: доход, долги, статус","pochemu":"Государство само ставит фильтры, по которым оценивают человека в личной жизни.","primer":"Милонов предлагал проверять семейное положение и долги по алиментам; Токио требует справку о доходе."},{"tezis":"Главный плюс госсервиса, проверка личности, доступен частным без госбазы анкет","pochemu":"Частный сервис может проверять личность через Госуслуги, а анкета остаётся у него.","primer":"Авито, 2026: прорабатывает сервис знакомств; проверку личности могут вести через Госуслуги."}],"killer":"Вопрос «кто вам нравится» не должен лежать в госбазе.","image":"Сваха с блокнотом: познакомила, а блокнот остался у государства.","attacks":["Проверку личности уже дают через Госуслуги частным сервисам; госанкета для неё не нужна.","Спрос не результат: из 16 тысяч участников Токио браков 265, меньше 2%.","Отзыв по 152-ФЗ существует на бумаге: стёрты ли копии и резервы, не проверить."],"ask":["Кто хранит анкеты и отвечает за утечку: государство, перед кем?","Ст. 21: при ином законном основании данные после отзыва могут не удалять. Что тогда?"],"expect":[{"q":"Госуслуги уже хранят паспорт и ИНН. Что меняется?","a":"Меняется тип данных: не «кто вы», а «кого и зачем ищете». Связка с паспортом делает утечку опасной."},{"q":"Вы дали согласие сами. Какое вмешательство?","a":"Согласие на вход — не согласие на хранение и сведение. По 152-ФЗ оно отзывное. Спорим о данных, а не о принуждении."},{"q":"Токио запустил приложение. Работает?","a":"К июню 2026, по СМИ: 265 браков на 16 тысяч участников. Плата: справки о статусе и доходе у города."}],"infokiller":[{"q":"Частные тоже теряют данные. Чем государство хуже?","a":"Не обещаю, что частный стирает всё. Разница в связке: госбаза сводит паспорт, доход, адрес и «кого ищу»; частная анкета отдельна."},{"q":"Женат ли человек, частное приложение не проверит. Это польза?","a":"Польза в проверке, не в анкетах. Проверку частные получают через Госуслуги по согласию; хранить анкеты государству не нужно."},{"q":"Сервис знакомств на Госуслугах добровольный. Что плохого?","a":"Добровольность не отвечает на вопросы: где хранятся данные, кто видит, как стереть. Пока условия не названы, «за» рано."}]},"arsenal":{"stats":[{"fact":"К 30.06.2026 в Tokyo Enmusubi: 16 тыс. зарегистрированных из около 36 тыс. заявителей, 760 пар, 265 браков","source":"AFP (The Star, 28.07.2026), по данным правительства Токио","year":2026,"url":"https://www.thestar.com.my/aseanplus/aseanplus-news/2026/07/28/tokyo-govt-dating-app-achieves-265-marriages","verified":true},{"fact":"Сведения об интимной жизни — специальная категория персональных данных со строгими условиями обработки","source":"Федеральный закон № 152-ФЗ «О персональных данных», ст. 10","year":2006,"url":"https://www.consultant.ru/document/cons_doc_LAW_61801/","verified":true}],"quote":{"text":"Сбор, хранение, использование и распространение информации о частной жизни лица без его согласия не допускаются.","author":"Конституция РФ, ст. 24, ч. 1","verified":true,"url":"https://www.zakonrf.info/konstitucia/24/"},"life":"Вспомни, как знакомились твои знакомые и каким сервисам они доверили бы паспорт и анкету. Только реальное."},"traps":[{"problem":"Соперник: утечки данных, значит нельзя (или: значит можно, всё равно утекает).","exit":"Признать риск. Спорить об условиях: отдельная анкета, удаление после отзыва прямо в законе, аудит, кто отвечает."},{"problem":"Токио приводят как доказательство: либо успех, либо провал.","exit":"Называть цифры только по СМИ: 265 браков, 16 тысяч участников, справки у города. Вернуться к вопросу: кто видит данные."},{"problem":"Обвинят: вы против семьи и помощи одиноким. Или спор уйдёт к автору идеи.","exit":"Судить конструкцию: добровольность, верификация, защита данных. Автор идеи не важен; помощь семье — жильё, ипотека, садики."}],"verdict":{"winner":"protiv","why":"ПРОТИВ точнее поставил критерий: что собирают и кто сводит. Довод ЗА «частные не проверят» ослаблен: проверку через Госуслуги получают и частные. ЗА сильнее в праве (согласие, отзыв), но «кто хранит анкеты» осталось без ответа."}},"okr-28":{"core":"«Идеальная жизнь» в лентах: мотивирует действовать или давит сравнением?","za":{"criterion":"Судим по результату для большинства: лента запускает действие или бьёт по самооценке?","theses":[{"tezis":"Достижимый идеал вызывает «добрую зависть», а она толкает учиться и делать","pochemu":"Ван де Вен 2011: добрая зависть повышала результат, злая зависть и восхищение — нет.","primer":"Ролики «как я готовился к экзаменам» смотрят, чтобы повторить режим."},{"tezis":"Форматы «до/после» и «мой путь» показывают дорогу, а не только итог","pochemu":"Ван де Вен 2011, исследование 4: образец мотивирует, когда улучшение кажется достижимым.","primer":"Блог «мой путь к первому полумарафону» с планом и срывами зовёт повторить."},{"tezis":"Масштаб вреда мал: технологии объясняют не более 0,4% благополучия подростков","pochemu":"Связь отрицательная, но малая: экраны объясняют ничтожную долю различий. Масштаб важнее самого факта.","primer":"Анализ данных 355 358 подростков, 2019."}],"killer":"Лента показывает, как можно. Что делать дальше, решаете вы.","image":"Афиша марафона: не обещает финиш, зовёт на старт.","attacks":["Фогель, исследование 1 — корреляция; эксперимент — разовый показ профиля студентам, не жизнь в ленте.","Facebook Files: хуже 32% девочек с трудностями, лучше 22%, без изменений 45,5%.","Хант урезал время в ленте, не «идеальные» кадры. Это про время, не про глянец."],"ask":["Какая доля пользователей, по вашим данным, страдает от сравнения? Хотя бы порядок назовите.","Какое наказание ждёт того, кто отписался от глянцевого аккаунта?"],"expect":[{"q":"Выйти из ленты значит выпасть из общения. Это не давление среды?","a":"Аккаунт можно заглушить без отписки: никто не заметит. Давит живой класс, не лента; лента даёт и тему для разговора."},{"q":"Алгоритм усиливает зависть и реакции. Это система давления?","a":"Алгоритм усиливает то, на что реагируешь. «Не интересует» и лимит времени меняют ленту. Давлению нужна санкция, здесь её нет."},{"q":"Мотивация — это действие. Сколько людей после ленты пошли делать, а не листать?","a":"Цифр не назову. Механизм: достижимый образец и показанный путь. Подготовка к экзаменам, спорт по роликам — это действие, а не просмотр."}],"infokiller":[{"q":"Instagram ухудшает образ тела у девочек (Facebook Files). Вы против экспертов?","a":"Для части девочек вред реален. Но в том же опросе девочек с трудностями: 32% — хуже, 22% — лучше, 45,5% — без изменений."},{"q":"Лимит соцсетей в 30 минут снизил депрессию (Хант 2018). Лента вредит?","a":"Лимитировали время, не «идеальность» кадров; студенты, три недели. Эффект сильнее у тех, кто начинал с депрессии. Время ограничить можно, ленту запрещать не нужно."},{"q":"Сравнение с отобранными кадрами заведомо проигрышное. Что ответите?","a":"Зависит от образца: Локвуд и Кунда 1997 — достижимый успех вдохновляет, недостижимый подавляет. Выбирайте образцы вроде себя, не глянец."}]},"protiv":{"criterion":"Судим по умолчанию: сравнение встроено в ленту, вдохновение нужно искать самому.","theses":[{"tezis":"Лента сравнивает по умолчанию: показывает отобранное, а не обычную жизнь","pochemu":"Выкладывают лучшее, будни остаются за кадром. Сравнение со своей жизнью неизбежно.","primer":"Фогель, 2014: у частых пользователей Facebook ниже самооценка, связь через сравнение вверх."},{"tezis":"Лайки и охваты делают одобрение публичным счётом: жизнь подгоняют под кадр","pochemu":"Подстраиваешь жизнь под кадр, а не кадр под жизнь, ради цифры.","primer":"Facebook Files 2021: слайд компании — Instagram усугубляет комплексы у трети девочек с ними."},{"tezis":"Меньше ленты — меньше депрессии: это эксперимент, а не корреляция","pochemu":"Случайное распределение исключает обратную причину. Фогель: даже разовый «успешный» профиль снижал текущую самооценку.","primer":"Хант, 2018: 143 студента, три недели по 30 минут в день — меньше одиночества и депрессии."}],"killer":"Вдохновение надо искать, а сравнение лента делает сама.","image":"Витрина магазина: идеальный манекен, а стыдно за свою обычную одежду.","attacks":["Ван де Вен: зависть к достижимому. В ленте образец отобран, отполирован и недостижим.","«До/после» — тоже отбор: срывы вырезают, путь выглядит легче, чем был.","Орбен: 0,4% — среднее по всем подросткам. Среднее скрывает уязвимых."],"ask":["Сколько кадров в вашей ленте показывают обычный, непраздничный день?","Если лента мотивирует, почему урезание её до 30 минут в день снизило депрессию?"],"expect":[{"q":"Facebook Files про часть девочек. Для большинства вы вред доказали?","a":"Для большинства не доказано, честно. Мой довод про устройство: сравнение встроено по умолчанию, а вдохновение требует усилия и выбора."},{"q":"Отпишитесь за секунду от давящего аккаунта. В чём проблема?","a":"Отписка стоит связей: друзья, класс и чаты в той же ленте. Алгоритм подсовывает похожее, решает платформа, не только вы."},{"q":"Реклама тоже отредактирована и не обманывает. Чем лента хуже?","a":"Рекламу маркируют и узнают. Кадр друга не маркирован, его принимают за жизнь. Сравнение ошибается там, где обмана не видно."}],"infokiller":[{"q":"Instagram в России заблокирован. О каком давлении вы говорите?","a":"Механика та же в VK и Telegram: лайки, сторис, блогеры. Исследование про Instagram показывает механизм сравнения. Meta в РФ запрещена."},{"q":"Фестингер: сравнение вверх мотивирует. Разве нет?","a":"Мотивирует, когда образец достижим и похож на тебя. В ленте образец отобран и отполирован, это условие не выполнено."},{"q":"Исследование Ханта 2018: всего 143 студента. Что оно доказывает?","a":"Мало людей, но это эксперимент со случайным распределением: причина в ленте, не в настроении. Корреляция этого не даёт."}]},"arsenal":{"stats":[{"fact":"Цифровые технологии объясняют не более 0,4% различий в благополучии подростков; анализ 355 358 человек","source":"Orben, Przybylski, Nature Human Behaviour","year":2019,"url":"https://doi.org/10.1038/s41562-018-0506-1","verified":true},{"fact":"Внутренний слайд Facebook: Instagram усугубляет проблемы с образом тела у трети девочек-подростков, у которых они есть; компания спорила с толкованием","source":"The Wall Street Journal, Facebook Files (Meta в РФ признана экстремистской)","year":2021,"url":"https://www.thedrum.com/news/2021/09/27/facebook-denies-instagram-toxic-teens","verified":true}],"quote":{"text":"","author":"Penelope Lockwood, Ziva Kunda, «Superstars and me», 1997 (дословной цитаты нет; суть: образец вдохновляет или подавляет в зависимости от того, кажется ли успех достижимым)","verified":false},"life":"Вспомни реальный момент, когда чужая лента заставила чувствовать себя хуже, или чей-то пост побудил тебя начать что-то конкретное."},"traps":[{"problem":"Ссылка на Instagram: «Meta запрещена, это неактуально».","exit":"Уточнить: Meta в РФ признана экстремистской; говорим про механику лент, она та же в VK и Telegram."},{"problem":"Соперник: «часть девочек» не доказывает вред большинству.","exit":"Согласиться, для большинства не доказано. Вернуть критерий: сравнение встроено, вдохновение нужно искать. Цифр не выдумывать."},{"problem":"«Локвуд и Кунда: образцы подавляют тех, кто не верит, что достигнет такого же».","exit":"Согласиться: критерий — достижимость. Поэтому мотивируют образцы «как я» и ролики с шагами, не глянец."}],"verdict":{"winner":"protiv","why":"ПРОТИВ сильнее: критерий «что встроено в ленту по умолчанию» не опровергнут. ЗА честно опирается на Орбена, но ПРОТИВ тоже не доказал вред большинству."}},"okr-29":{"core":"Спор: общий минимум знаний для всех или национальная школа со своим содержанием.","za":{"criterion":"Единым должен быть общий минимум компетенций; традиции остаются над ним.","theses":[{"tezis":"Единое содержание — общий минимум компетенций, а не одинаковые учебники.","pochemu":"Цель образования у стран схожа; единый перечень результатов оставляет учебники и методики свободными.","primer":"Статья 26 Всеобщей декларации прав человека задаёт общую цель образования."},{"tezis":"Единый стандарт и родной язык совместимы: принцип уже доказан внутри страны.","pochemu":"Общие результаты не отменяют местных языков и традиций, если закон их прямо закрепляет.","primer":"ФГОС обеспечивают единство образовательного пространства и возможность учиться на родном (ст. 11)."},{"tezis":"Общее ядро уже согласовали государства, и каждое осталось со своей школой.","pochemu":"Цели приняли все страны ООН, а программы каждая страна пишет сама.","primer":"ЦУР 4 (ООН, 2015): к 2030 году — грамотность молодёжи и ценность культурного разнообразия."}],"killer":"Единый фундамент — не единая крыша: дом каждый строит свой.","image":"Единый нотный стан: музыка у народов своя, но играть можно вместе.","attacks":["Германия сама ввела стандарты результатов после PISA — и школа осталась немецкой.","Сингапурская математика пересекла границы: лучшее содержание и так становится общим.","Язык обучения — не содержание: при едином ФГОС закон даёт учиться на родном."],"ask":["Назовите математику, которая в разных странах разная.","Что потеряет национальная культура, если таблица умножения везде одинакова?"],"expect":[{"q":"Кто будет решать, что войдёт в общее ядро?","a":"Ядро задают общие цели, как ЦУР 4, — их приняли государства. Программу каждая страна пишет сама."},{"q":"Тогда «единое содержание» сводится к математике, которую никто не оспаривает.","a":"Фундамент шире науки: критическое мышление, цифровая и финансовая грамотность. Национальную историю оставляем отдельным предметом."},{"q":"Кто напишет единый учебник истории — и кто с ним согласится?","a":"Единый стандарт — перечень результатов, не учебник. Национальную историю пишут страны; общий курс — факты и работа с источниками."}],"infokiller":[{"q":"Эксперт: Финляндия и Сингапур успешны с разными системами — зачем единое?","a":"Успех разных систем не отменяет общего ядра: математика в обеих одна. Спор о минимуме, не о методике."},{"q":"Эксперт: кто гарантирует, что ядро не станет идеологией?","a":"Ядро — перечень проверяемых результатов: счёт, наука, грамотность, работа с источниками. Спорные трактовки в него не входят."},{"q":"Эксперт: язык обучения тоже единый?","a":"Нет. Содержание учат на любом языке; в России ФГОС дают возможность учиться на родном языке."}]},"protiv":{"criterion":"Образование передаёт язык, историю и характер народа; судим по подотчётности стандарта гражданам.","theses":[{"tezis":"Единый стандарт не нейтрален: тест и рамка тянут за собой содержание.","pochemu":"Что не измеряют, то выпадает из уроков; кто выбирает измерение, выбирает содержание.","primer":"После «PISA-шока» декабря 2001 года Германия ввела национальные стандарты (2003–2004)."},{"tezis":"Разные системы страхуют от общей ошибки и обмениваются приёмами.","pochemu":"Если все учат одинаково, ошибка общая; разнообразие даёт сравнение и выбор.","primer":"Сингапурскую математику создали для своих школ; её переняли школы США."},{"tezis":"Единое содержание на деле пойдёт на нескольких крупных языках.","pochemu":"Язык обучения — тоже содержание; малые языки выпадут первыми.","primer":"ЮНЕСКО (2016): у 40% жителей мира нет доступа к обучению на понятном языке."}],"killer":"Монокультура в поле гибнет разом. В школе — тоже.","image":"Единый учебник для всех — переводчик, который теряет стихи.","attacks":["ЦУР 4 — цели грамотности, не единая программа: общий фундамент, а не единое содержание.","Статья 26 Декларации — цель образования, а не перечень предметов; единый курс из неё не следует.","ФГОС — национальный стандарт, подотчётный гражданам; мировой не подотчётен никому."],"ask":["Чей учебник истории и литературы станет единым для всей планеты?","Какие предметы войдут в общий стандарт, а какие останутся национальными?"],"expect":[{"q":"Физика и математика везде одинаковы. Чем плох общий фундамент?","a":"Общий фундамент — да, единое содержание — нет. Язык, литература, история делают образование национальным."},{"q":"Ядро формируют совместно. Что не так?","a":"Совместно значит договариваются сильные; «PISA-шок» показал, что тест тянет за собой содержание. Малые языки за столом не равны."},{"q":"Разные программы мешают переезду. Что делать?","a":"Признание квалификаций: Лиссабонская конвенция 1997 года не требует одинаковых программ."}],"infokiller":[{"q":"Эксперт: ЕГЭ и ФГОС — тоже унификация. Почему внутри страны можно, в мире нельзя?","a":"Нацстандарт подотчётен гражданам: его можно оспорить и исправить. Мировой подотчётен никому, поэтому там единство опасно, а здесь работает."},{"q":"Эксперт: это изоляционизм и закрытость?","a":"Нет: школа учит иностранные языки и обменивается опытом. Сотрудничеству не нужна одинаковая программа."},{"q":"Эксперт: что плохого, если всем детям дать лучшее содержание?","a":"«Лучшее» определяет кто-то один. Разнообразие защищает от общей ошибки и сохраняет языки и культуры."}]},"arsenal":{"stats":[{"fact":"По закону ФГОС дошкольного, начального и основного общего образования обеспечивают возможность учиться на родных языках народов России.","source":"ФЗ №273-ФЗ «Об образовании в Российской Федерации», ст. 11 ч. 5.1 (в ред. 317-ФЗ)","year":2018,"url":"https://base.garant.ru/70291362/9d78f2e21a0e8d6e5a75ac4e4a939832/","verified":true},{"fact":"Лиссабонская конвенция: иностранную квалификацию признают, если нет «существенных различий»; одинаковых программ не требует.","source":"Совет Европы и ЮНЕСКО, Лиссабонская конвенция о признании","year":1997,"url":"https://www.enic-naric.net/page-lisbon-recognition-convention","verified":true}],"quote":{"text":"культурное разнообразие так же необходимо для человечества, как биоразнообразие для живой природы","author":"ЮНЕСКО, Всеобщая декларация о культурном разнообразии, ст. 1, 2001","verified":true,"url":"https://www.un.org/ru/documents/decl_conv/declarations/cultural_diversity.shtml"},"life":"Вспомни урок родного языка или литературы, запомнившийся «своим», либо смену школы. Не выдумывай."},"traps":[{"problem":"Спор уйдёт в Болонский процесс, санкции и политику.","exit":"Не использовать: он про степени и признание. Говорить о содержании и подотчётности стандарта."},{"problem":"Попросят пример реально работающего мирового стандарта.","exit":"Дать ФГОС внутри России и ЦУР 4 ООН; договоров не придумывать."},{"problem":"Упрекнут в изоляционизме или наивности.","exit":"Мы за обмен и признание дипломов; спор о желательности общего содержания, не о лёгкости договориться."}],"verdict":{"winner":"protiv","why":"Против сильнее: вопрос подотчётности остался без ответа, мировой стандарт никому не подотчётен. За сузил «единое содержание» до минимума, который и так общий."}},"okr-30":{"core":"Траты на питомца: забота о нём или перенос на животное человеческих ролей?","za":{"criterion":"Судим по благополучию животного: ему от этих трат лучше или хуже?","theses":[{"tezis":"Коляска и одежда закрывают реальные потребности больных и мелких животных","pochemu":"Собака с больными суставами без коляски не гуляет. Реагенты раздражают лапы, мёрзнущим породам нужен комбинезон.","primer":"Коляски при парезе, послеоперационные попоны, обувь от реагентов — вещи из ветклиник."},{"tezis":"Видеть в животном чувствующее существо — основа закона, а не перекос","pochemu":"Сочувствие «как к своему» сделало страдание животного предметом права.","primer":"498-ФЗ, ст. 4: животные — «существа, способные испытывать эмоции и физические страдания»."},{"tezis":"Опасны не траты и привязанность, а незнание хозяина: оно лечится знанием","pochemu":"Шоколад и виноград дают те, кто не знает. Привязанный хозяин идёт к ветеринару и кинологу.","primer":"Клиники и кинологи объясняют: шоколад, виноград, лук собакам нельзя."}],"killer":"Собаке всё равно, как вы её зовёте. Важно, что вы лечите.","image":"Тёплая куртка на собаке: смешно прохожему, тепло тому, кто в ней.","attacks":["Морду породы задаёт селекция, а не коляска. Лечить дыхание мопса — та самая забота.","Трудное решение об эвтаназии тяжело и тем, кто не зовёт собаку ребёнком.","Торт — каприз без вреда, если корм и прогулка на месте. Радость хозяина — не порок."],"ask":["Чем вредит собаке торт на день рождения, если корм и прогулка на месте?","Назовите критерий, по которому лечение питомца становится «чрезмерным» для самого питомца."],"expect":[{"q":"По ГК, ст. 137, к животным применяют правила об имуществе. Какой «член семьи»?","a":"Правила об имуществе — если закон не установил иное, а 498-ФЗ установил. Абз. 2 ст. 137 запрещает жестокость. Критерий: польза питомцу."},{"q":"Мерзнущим породам одежда нужна, остальное декор. Согласны?","a":"Не только породы: послеоперационная попона, обувь от реагентов, дождевик. Наряд ради фото — каприз, но вреда, пока нужное есть, не доказано."},{"q":"Приюты переполнены, хотя питомцев зовут «семьёй». Траты не гарантируют заботу?","a":"Не гарантируют: гарантирует ответственность. 498-ФЗ, ст. 9, требует мер против нежелательного потомства: стерилизация — одна из них."}],"infokiller":[{"q":"Тревожные хозяева перекармливают собак лакомствами (Coy, 2021). Это антропоморфизация?","a":"Это опрос: связь, не причина. Перекорм лечится ветеринаром и знанием меры, а не отказом считать питомца семьёй."},{"q":"Индустрия продаёт торты и наряды: образ «хорошего хозяина» вместо заботы?","a":"Индустрия есть и у детских товаров. Критерий один: польза животному. Торт — каприз без вреда, коляска при болезни — лечение."},{"q":"«Псын» — инфантилизация. Зоопсихологи против антропоморфизма. Что скажете?","a":"«Псын» — языковая игра, как «котик» про ребёнка. Проблемы бывают, когда собаке не дают быть собакой: прогулки, правила. Врач и коляска их не отнимают."}]},"protiv":{"criterion":"Судим по вопросу: это нужно животному по показаниям или хозяину для образа?","theses":[{"tezis":"Мода на «детские мордочки» закрепляет породы с больным дыханием","pochemu":"Людям нравится детское лицо, а платит за него собака.","primer":"Мопсы в 1,9 раза чаще болеют за год, BOAS — в 54 раза (RVC, 2022)."},{"tezis":"Привязанность «как к ребёнку» мешает хозяину принять решение об эвтаназии","pochemu":"Отпустить «члена семьи» тяжелее: горе хозяина может перевесить качество жизни собаки.","primer":"Ветеринары пишут: сильная привязанность делает решение мучительным; важнее качество жизни."},{"tezis":"Траты «как на члена семьи» покупают хозяину образ «хорошего хозяина»","pochemu":"Праздник, наряд, фото: потребитель — человек. Собаке нужны корм, врач и прогулка.","primer":"Дни рождения питомцев: торт, платье, фотосессия, а собаке нужны прогулка и врач."}],"killer":"Собаке нужен врач и прогулка, а не роль ребёнка.","image":"Бальное платье на овчарке: красиво на фото, а ей нужен лес.","attacks":["Ваши примеры — больные и мёрзнущие, по показаниям. Тема про траты вне показаний.","Закон защищает собаку от страданий, но ребёнком её не делает. Наряды он не требует.","Привязанность не гарантирует здравого ухода: у тревожных хозяев больше лакомств и упитаннее собаки."],"ask":["Платье ради фото: это забота о собаке или о хозяине?","Какая трата на питомца для вас уже перебор? Назовите критерий."],"expect":[{"q":"Коляска нужна больным собакам, одежда мёрзнущим. Вы против?","a":"Нет, по показаниям это забота. Мой спор про траты вне показаний: наряд для фото, коляска здоровой собаке, торт."},{"q":"Закон 2018 года признаёт животных чувствующими. Значит, «как член семьи» — норма?","a":"Закон защищает собаку как существо, способное испытывать эмоции и страдать, и требует надлежащего содержания. «Членом семьи» не называет: это выбор хозяина, не норма."},{"q":"Одиноким и пожилым питомец даёт смысл. Вы против такой любви?","a":"Нет. Любить значит учитывать природу собаки: движение, запахи, сородичей. Роль ребёнка ей не нужна и не всегда на пользу."}],"infokiller":[{"q":"«Псын» — просто ласковое слово, как «котик». Что плохого?","a":"Слово безобидно. Проблема, когда за словом идёт поведение: собаке дают роль ребёнка, а нужды вида забывают."},{"q":"Есть исследования вреда от антропоморфизации?","a":"Прямой причины не докажу. Но у моды на «милые» морды есть цена: у мопсов BOAS в 54 раза чаще (RVC, 2022)."},{"q":"Лечить питомца изо всех сил — это любовь. Чем плохо?","a":"Лечить по показаниям — любовь. Плохо, когда решает горе хозяина, а не качество жизни: ветеринары пишут, что привязанность делает выбор мучительным."}]},"arsenal":{"stats":[{"fact":"Закон обязывает владельцев обеспечивать уход, ветпомощь и профилактику и не допускает отказа от животного без передачи в приют или другие руки","source":"Федеральный закон № 498-ФЗ «Об ответственном обращении с животными»","year":2018,"url":"https://consultant.ru/document/cons_doc_LAW_314646/b2d155e355a125bbe89726402f1c374dcdd762f4/","verified":true},{"fact":"Опрос 563 владельцев: тревожная привязанность хозяина связана с числом лакомств и упитанностью собак (по оценке хозяев)","source":"Coy, Green, Behler, Animals","year":2021,"url":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7922876/","verified":true}],"quote":{"text":"Вопрос не в том, могут ли они рассуждать или говорить, а в том, могут ли они страдать (перевод приблизительный).","author":"Иеремия Бентам, Введение в основания нравственности и законодательства, гл. XVII (сноска)","verified":true,"url":"https://1000wordphilosophy.com/2022/03/18/bentham-on-animals/"},"life":"Вспомни реальный случай, когда питомец болел или мёрз, и что сделали хозяева; или когда «человеческая» забота навредила."},"traps":[{"problem":"Соперник приведёт абсурд: бриллиантовый ошейник, платье, торт на день рождения.","exit":"Согласиться, что это каприз; траты «как на члена семьи» — здоровье и безопасность. Критерий: вред или польза питомцу."},{"problem":"«Здоровую собаку возят в коляске, чтобы не мыть лапы». Защищаете?","exit":"Нет, не защищаем: коляска по назначению ветеринара. Вернуть критерий: польза животному, а не удобство хозяина."},{"problem":"Соперник: граница расплывчата, кто решает, что «чрезмерно»?","exit":"Решает показание: ветеринар и поведение собаки. Критерий: нужно ли это животному или хозяину для образа."}],"verdict":{"winner":"za","why":"ЗА сильнее: ПРОТИВ сам признал траты по показаниям, остались торты и наряды, где вред не доказан. Довод о мопсах бьёт по моде на породу, а не по заботе."}},"reg-01":{"core":"Свобода зрителя против невидимой подборки платформы: кто решает, что мы увидим.","za":{"criterion":"Выбор свободен, пока зритель может уйти, искать иное и не согласиться.","theses":[{"tezis":"Платформа предлагает, решает зритель: пропуск, поиск и подписка в его руках.","pochemu":"Показ не равен просмотру: досмотреть или уйти может только человек.","primer":"«Слово пацана» (2023) разошлось на цитаты и мемы: зрители сами его обсуждали."},{"tezis":"Искусство живёт и вне экрана: музей, театр, книгу выбирают без алгоритма.","pochemu":"Афиша, билет и совет друга не зависят от рекомендаций платформы.","primer":"Пушкинская карта (с 2021): молодёжь 14-22 лет сама выбирает театр, музей, концерт."},{"tezis":"Платформы расширили выбор: раньше решали худсоветы, редакторы эфира и лейблы.","pochemu":"Автору больше не нужно разрешение посредника, чтобы выйти к слушателю.","primer":"Независимый артист загружает треки на цифровые площадки через дистрибьютора, без лейбла."}],"killer":"Подсказка не приказ: палец на экране всё равно ваш.","image":"Библиотека с навигатором: навигатор советует полку, а книгу берёшь сам.","attacks":["Главная страница не весь мир: поиск, подписки и друзья обходят витрину.","Артист сам решает подстраиваться под формат, а зритель слушает что хочет.","Непрозрачность уже исправляют: закон 2023 года обязал раскрывать правила рекомендаций."],"ask":["Когда вы искали фильм по названию, платформа выбирала за вас?","Если платформа решает за зрителя, почему вкусы людей так различаются?"],"expect":[{"q":"Люди редко уходят из ленты. Какой же это выбор?","a":"Остаются сами: интересно. Захотят, закроют приложение. Интерес не равен принуждению, а свобода уйти остаётся всегда."},{"q":"Артисты переписывают песни под алгоритм. Чей это выбор?","a":"Артиста: он подстраивается ради слушателя, как раньше под радиоформат. Зритель при этом выбирает из огромного каталога, а не из пяти песен."},{"q":"Закон о рекомендациях разве не признаёт давление платформ?","a":"Закон признаёт право зрителя знать правила. Регулирование усиливает выбор: человек видит, почему ему показали именно это."}],"infokiller":[{"q":"Платформа зарабатывает на вашем времени. Зачем ей показывать вам лучшее?","a":"Ей выгодно, чтобы вы остались, а уйти можно одним нажатием. Плохие подборки теряют аудиторию, поэтому конкуренция ограничивает давление."},{"q":"Можно ли выбрать то, о чём никогда не слышал?","a":"Можно: узнаёшь от друзей, критиков, афиш, поиска. Рекомендация лишь один из каналов, а не единственная дверь."},{"q":"Вкус формируют извне. Кто тогда выбирает: вы или платформа?","a":"Вкус формируют семья, школа, друзья, критики и платформы вместе. Влияние не отменяет выбор, иначе любую книгу выбирал бы библиотекарь."}]},"protiv":{"criterion":"Выбор настоящий, только когда видны все варианты, а не отобранная часть.","theses":[{"tezis":"Зритель выбирает из показанного, а невидимое выбрать нельзя.","pochemu":"Порядок и первая страница решают, какие работы вообще получат внимание.","primer":"Онлайн-кинотеатр сам решает, какие сериалы вынести на главную: их видят первыми."},{"tezis":"Платформа меняет само искусство: авторы пишут под метрики удержания.","pochemu":"Роялти на Spotify идут за прослушивание дольше 30 секунд, поэтому первые секунды решают.","primer":"Вступления хитов сократились с 20 до 5 секунд (1986-2015): исследователь предположил влияние стриминга."},{"tezis":"Правила подборки закрыты: зритель не знает, почему ему показали именно это.","pochemu":"Невозможно оспорить решение, которого не видишь, значит, выбор делает не он.","primer":"Закон о рекомендательных технологиях (2023) обязал сервисы раскрывать правила рекомендаций."}],"killer":"Выбирать из того, что тебе показали, значит выбирать чужое.","image":"Меню, где половину блюд повар заранее убрал за ширму.","attacks":["«Пропустить» можно только то, что платформа уже решила показать.","Музей раз в месяц, платформа каждый день: время зрителя проходит там.","Артист загрузил трек, а кто его покажет слушателям? Алгоритм."],"ask":["Можете назвать правила, по которым вам показали последний трек?","Сколько артистов вы нашли, не увидев их сначала в подборке?"],"expect":[{"q":"Вы сами ищете, пишете в поиск. Разве платформа решила?","a":"Поиск тоже ранжируется платформой. Для названия, которое уже знаешь, работает. Для нового имени нужна подборка, а там решает алгоритм."},{"q":"Рекомендации открыли людям редкие жанры. Разве это не выбор?","a":"Открыли тем, кого вывели в подборку. Остальные невидимы. Доступ без видимости похож на каталог, который никто не листает."},{"q":"Раньше выбирали худсоветы и редакторы. Чем платформа хуже?","a":"У редактора были имя и ответственность, у алгоритма правила закрыты. Закон 2023 года обязал раскрывать правила рекомендаций."}],"infokiller":[{"q":"Вы не обязаны открывать приложение. Разве не так?","a":"Формально так. Но искусство, которое не вышло в подборку, зритель не увидит и не оценит: выбор сужен до него."},{"q":"Люди ведь сами нажимают. Где же принуждение?","a":"Принуждение не нужно: достаточно порядка показа. Первую позицию выбирают чаще, поэтому порядок решает, что станет популярным."},{"q":"Алгоритм следует за вкусом зрителя. Разве не он главный?","a":"Алгоритм следует за прошлыми кликами и укрепляет их. Новое, непривычное зритель так не получает: вкус замыкается в круг."}]},"arsenal":{"stats":[{"fact":"Закон № бочих мест. Вы за закрытие?","a":"Нет: предлагаем распространить лучшие условия на всю промышленность, а зоны оставить как один из инструментов, не главный."},{"q":"Зоны существуют с 2005 года. Неужели нет эффекта?","a":"Эффект на площадках есть. Системный виден в статистике всей промышленности, и его нужно показать, а не предполагать."},{"q":"Универсальные меры работают медленнее. Инвесторам нужна уверенность сейчас.","a":"Медленнее, но для всех: ставка, займы, предсказуемые налоги. Исключения рождают борьбу регионов за льготы, а не за качество среды."}],"infokiller":[{"q":"Шэньчжэнь доказал, что зоны работают. Чем это опровергаете?","a":"Не опровергаю, а уточняю: там зона была частью общей стратегии. Копировать одну деталь без стратегии не получится."},{"q":"Инфраструктура в зонах реально построена. Разве это не системный эффект?","a":"Построена на площадке. Системный эффект это рост поставщиков и производительности вне неё, и его нужно показать цифрами."},{"q":"Универсальная поддержка тоже избирательна: займы получают не все.","a":"Верно. Но правила открыты для каждого завода, и условия не зависят от адреса. Это меньше искажает конкуренцию."}]},"arsenal":{"stats":[{"fact":"Закон «Об особых экономических зонах в Российской Федерации» принят в 2005 году.","source":"Федеральный закон от 22.07.2005 № 116-ФЗ","year":2005,"url":"https://www.consultant.ru/document/cons_doc_LAW_122461/","verified":true},{"fact":"Фонд развития промышленности создан в августе 2014 года для льготных займов промышленным проектам.","source":"Фонд развития промышленности","year":2014,"url":"https://iims.hse.ru/data/2023/02/01/2045962561/%D0%AD%D0%9A%D0%9E.%202023.%20%E2%84%96%202.%20Yakovlev,%20Freinkman,%20Ershova,%20Agalyan.pdf","verified":true}],"quote":{"text":"","author":"ФЗ № 116-ФЗ «Об особых экономических зонах в РФ» (определение сверить по тексту закона)","verified":false},"life":"Вспомни, как в твоём городе или районе открывалось предприятие и что ему помогло."},"traps":[{"problem":"Путаем ОЭЗ, ТОР и технопарки.","exit":"Называем тип: промышленно-производственная ОЭЗ. ТОР и парки отдельный инструмент."},{"problem":"Называем цифры инвестиций и рабочих мест без источника.","exit":"Цифры не называем: говорим о механизме и законе, источники проверим позже."},{"problem":"Спор переходит на конкретную зону и её руководителей.","exit":"Говорим об инструменте в целом, без оценок отдельных компаний и людей."}],"verdict":{"winner":"protiv","why":"ЗА нужно доказать рост всей промышленности, а не площадок. ПРОТИВ достаточно показать анклавность и сравнимые универсальные меры."}},"reg-06":{"core":"Путешествие: пережитое чувство или картинка для соцсетей — что стало главным?","za":{"criterion":"Судим по тому, что остаётся через год: ощущение или кадр?","theses":[{"tezis":"Через год вспоминаешь пережитое, а не кадр из ленты","pochemu":"Запах, усталость, разговоры запоминаются телом; кадр лишь напоминает, но не заменяет.","primer":"Скала «Парус» в Дагестане: кадры у всех одинаковые, отличается только пережитое."},{"tezis":"Съёмка отнимает внимание: кто снимает, тот не проживает момент","pochemu":"Внимание одно, экран и место делят его; поездка превращается в сбор материала.","primer":"Концерт сквозь экран телефона: видишь пиксели, а сцену пропускаешь."},{"tezis":"Лента даёт секунды признания, а пережитое меняет планы и людей","pochemu":"Лайк быстро забывается; поездка, которую прожил, меняет привычки и следующие маршруты.","primer":"Поход без связи: постить нечего, а ехать снова хочется."}],"killer":"Кадр можно выложить. Чувство можно только прожить.","image":"Фото обеда: вкус остаётся только у того, кто ел.","attacks":["Вы вспоминаете чувство по фото: кадр и запускает память, а не мешает ей.","Выбор места делает лента: чувство приходит позже и уже по её сценарию.","«Поход без связи» — исключение; 56% россиян едут за увиденным в соцсетях."],"ask":["Что вы расскажете друзьям, если в поездке ничего не почувствовали?","Сколько своих фото из поездки вы пересматривали через год?"],"expect":[{"q":"56% россиян хотят поехать после соцсетей. Разве это не главное?","a":"Лента даёт повод. Ценность поездки определяет пережитое: через год остаётся оно, а не источник идеи."},{"q":"Поездка без поста для других как будто не была. Не так?","a":"Была. Рассказ продолжает чувство, а не заменяет. Поездка нужна тебе, а не ленте."},{"q":"Вы сами постите кадры. Это не лицемерие?","a":"Пост — след поездки, не цель. Мы против, когда ради кадра меняют маршрут и не смотрят вокруг."}],"infokiller":[{"q":"Есть данные, что эмоция важнее кадра?","a":"Единой цифры не назову. Механизм такой: лента даёт повод, а прожить поездку может только сам человек."},{"q":"Блогеры живут с кадров. Они путешествуют зря?","a":"Для них поездка — работа. Наш вопрос про личную поездку обычного человека, где никто не платит за кадр."},{"q":"Дагестан и Тюмень выросли из роликов. Это плохо?","a":"Нет, ролик привёл людей. Но ехать туда снова заставляют дорога, еда и люди, а не кадр."}]},"protiv":{"criterion":"Судим по тому, кто решает: чувство или аудитория, которая смотрит?","theses":[{"tezis":"Куда ехать, решает лента: 56% россиян берут идеи из соцсетей","pochemu":"Выбор места делает алгоритм, чувство приходит после выбора и по его сценарию.","primer":"Скала «Парус» и термальные источники Тюмени выросли из коротких видео."},{"tezis":"Маршрут строят под кадр: точка, свет, время, ракурс","pochemu":"Если расписание дня задаёт удачная точка съёмки, представление первично.","primer":"Очередь на одну смотровую: все ждут ради одинакового кадра."},{"tezis":"Опыт получает вес, когда его увидели и оценили","pochemu":"Рассказ связывает человека с группой; сториз и истории продлевают поездку после возвращения.","primer":"Поездку обсуждают в чате друзей и в ленте, пока она не забыта."}],"killer":"Если поездку никто не видел, для мира её не было.","image":"Витрина: путешествие выставлено, чтобы его оценили.","attacks":["Чувство хранит память? Вы вспоминаете его по фото, значит кадр первичен.","Съёмка отнимает внимание? Место выбрала лента, а не ваше чувство.","Поход без связи — редкость; обычная поездка идёт по маршруту из ленты."],"ask":["Куда вы поехали бы, не увидев ни одного фото места?","Сколько ваших поездок выбрано без единого кадра из ленты?"],"expect":[{"q":"Через год вы помните чувство, а не кадр. Разве нет?","a":"Помним по кадру: фото запускает память. А выбор места и маршрут уже сделала лента."},{"q":"Скучные места тоже снимают? Разве поедете ради поста туда, где скучно?","a":"В ленте скучные места не живут. Туристы идут туда, где есть кадр, и маршрут подстраивается под него."},{"q":"56% — опрос рассылочной платформы. Это не наука?","a":"Это маркетинговый опрос, цифра ориентир. Сильнее механизм: алгоритм выдаёт места, люди едут по выдаче."}],"infokiller":[{"q":"Есть данные, что выбор по соцсетям даёт меньше чувств?","a":"Такого исследования не назову. Спорим о том, что сегодня определяет выбор места и маршрута."},{"q":"«Парус» вырос из роликов. Чувство у людей тоже изменилось?","a":"Поток вырос из роликов. Для тех, кто стоит за кадром, пережитое становится вторичным."},{"q":"Вы призываете жить для ленты?","a":"Нет. Мы описываем, что произошло: выбор и рассказ о поездке часто идут от ленты."}]},"arsenal":{"stats":[{"fact":"56% россиян хотели посетить новое место после публикаций в соцсетях; 46% — фото помогают представить поездку","source":"Исследование, пересказ в блоге Unisender","year":2025,"url":"https://www.unisender.com/ru/blog/news/lenta-vmesto-turagenta-56-rossiyan-vdohnovlyayutsya-soczsetyami-pered-poezdkoj/","verified":true},{"fact":"Больше всего россияне доверяют контенту друзей (59%) и реальным отзывам путешественников (37%)","source":"Исследование, пересказ в блоге Unisender","year":2025,"url":"https://www.unisender.com/ru/blog/news/lenta-vmesto-turagenta-56-rossiyan-vdohnovlyayutsya-soczsetyami-pered-poezdkoj/","verified":true}],"quote":{"text":"","author":"","verified":false},"life":"Вспомни поездку, где снимал много, и поез  var det=function(id,title,body,open){return '<details id="bk-'+id+'"'+(open?' open':'')+'><summary>'+title+'</summary><div class="in">'+body+'</div></details>'};
 o+=det('arch','Архетипы кластеров',b.archetypes.map(function(a){
  return '<details><summary style="font-size:.85rem">'+a.cluster+' · '+h(a.name)+'</summary><div class="in"><div class="core">'+h(a.core)+'</div>'+['a','b'].map(function(s){var p=a[s];
   return '<div class="lb">'+h(p.label)+'</div>'+itemsHtml(p.args,function(x){return '<b>'+h(x.tezis)+'</b><div class="w">→ '+h(x.pochemu)+'</div><div class="ex">Пример: '+h(x.primer)+'</div>'})+
    '<div class="lb">Критерии</div>'+itemsHtml(p.criteria,h)}).join('')+'</div></details>'}).join(''));
 if(b.speech){var sp=b.speech;
  o+=det('speech','Структура речи (2:00)',itemsHtml(sp.steps,function(s){return '<b>'+h(s.sec)+' · '+h(s.name)+'</b><div class="w">'+h(s.what)+'</div><div class="ex">«'+h(s.phrase)+'»</div>'})+
   '<div class="lb">Минута подготовки на троих</div>'+itemsHtml(sp.prep,function(p){return '<b>'+h(p.who)+'</b><div class="w">'+h(p.task)+'</div>'}))}
 if(b.questions)o+=det('q','Вопросы-ловушки (8 типов)',itemsHtml(b.questions,function(q){return '<b>'+h(q.type)+'</b> — '+h(q.trap)+'<div class="ex">Пример: '+h(q.example)+'</div><div class="w">Ответ: '+h(q.answer30)+'</div>'}));
 if(b.rescue)o+=det('rescue','Фразы-спасатели',itemsHtml(b.rescue,function(r){return '<b>'+h(r.situation)+'</b><div class="w">«'+h(r.phrase)+'»</div>'}));
 var c=b.complications||{};
 if(c.foreign)o+=det('c1','Усложнение: Чужая тема',itemsHtml(c.foreign,function(f){return '<b>'+h(f.word)+'</b>'+f.bridges.map(function(m){return '<div class="w">• '+h(m)+'</div>'}).join('')}));
 if(c.idioms)o+=det('c2','Усложнение: Фразеологический коктейль',itemsHtml(c.idioms,function(f){return '<b>'+h(f.phrase)+'</b><div class="w">'+h(f.where)+'</div>'}));
 if(c.genres)o+=det('c3','Усложнение: Дебаты в образе',itemsHtml(c.genres,function(g){return '<b>'+h(g.genre)+'</b><div class="w">Начать: '+h(g.start)+'</div><div class="w">Приём: '+h(g.trick)+'</div><div class="w">Закончить: '+h(g.finish)+'</div>'}));
 [['arsenal','Ограниченный арсенал'],['one_for_all','Один за всех'],['no_prep','С места в карьер']].forEach(function(k,i){
  if(c[k[0]])o+=det('c'+(4+i),'Усложнение: '+k[1],itemsHtml(c[k[0]],h))});
 if(b.infokiller)o+=det('ik','Инфокиллер: 10 приёмов',itemsHtml(b.infokiller,function(x){return '<b>'+h(x.trick)+'</b><div class="ex">«'+h(x.example)+'»</div><div class="w">'+h(x.answer)+'</div>'}));
 app.innerHTML=o;
}

/* ---------- жребий + таймер ---------- */
var MODES={
 speech:{n:'Речь 1+2',ph:[['Подготовка',60],['Речь',120]]},
 question:{n:'Вопрос',ph:[['Задай вопрос',15],['Ответ',60]]},
 opp:{n:'Оппонирование',ph:[['Дискуссия',180]]},
 info:{n:'Инфокиллер',ph:[['Позиция 1',180],['Позиция 2',180]]}
};
var COMPS=['С места в карьер','Чужая тема','Один за всех','Фразеологический коктейль','Ограниченный арсенал','Дебаты в образе'];
var mode='speech',useComp=false;
function viewDraw(){
 app.innerHTML='<button class="back" data-go="#/okr">← К темам</button><div class="modes" id="modes"></div>'+
  '<div class="pool" id="pool">'+poolHtml()+'</div><label class="chk"><input type="checkbox" id="comp"'+(useComp?' checked':'')+'> Усложнение</label>'+
  '<button class="btn" style="width:100%;font-size:1.2rem;padding:18px" data-act="draw">🎲 Бросить жребий</button><div id="drawbox"></div>'+
  '<div id="timerbox"></div>';
 $('comp').addEventListener('change',function(){useComp=this.checked});
 drawModes();timerUI();
 if(DR&&DR.topic.stage==='reg'&&!REG)DR=null;
 if(DR)drawBox();
}
function drawModes(){
 $('modes').innerHTML=Object.keys(MODES).map(function(k){return '<button class="'+(mode===k?'on':'')+'" data-act="mode" data-v="'+k+'">'+MODES[k].n+'</button>'}).join('');
}
function setMode(m){mode=m;stopTimer();drawModes();timerUI()}
function compInfo(c){
 var b=B().complications||{},o='';
 if(c.name==='Чужая тема'){
  o='Встрой слова: <b>'+c.words.map(h).join(' · ')+'</b>';
  c.words.forEach(function(w){var f=(b.foreign||[]).filter(function(x){return x.word===w})[0];if(f)o+='<div class="ex">'+h(w)+': '+h(f.bridges[0])+'</div>'});
 }else if(c.name==='Фразеологический коктейль'){
  o='Используй: <b>'+c.idioms.map(function(i){return h(i.phrase)}).join(' · ')+'</b>';
  c.idioms.forEach(function(i){o+='<div class="ex">'+h(i.phrase)+': '+h(i.where)+'</div>'});
 }else if(c.name==='Ограниченный арсенал'){
  o='Только: <b>'+h(c.arsenal)+'</b>';
 }else if(c.name==='Дебаты в образе'){
  o='Докажи позицию так, как если бы это было: <b>'+h(c.genre.genre||c.genre)+'</b>';
  if(c.genre.start)o+='<div class="ex">Начать: '+h(c.genre.start)+'</div><div class="ex">Приём: '+h(c.genre.trick)+'</div><div class="ex">Закончить: '+h(c.genre.finish)+'</div>';
 }else if(c.name==='Один за всех'){
  o='Говорит один заранее выбранный. Остальные молчат.';
  (b.one_for_all||[]).forEach(function(x){o+='<div class="ex">• '+h(x)+'</div>'});
 }else{
  o='Без подготовки: речь сразу, таймер 2:00. Тема и позиция открываются по «Старт».';
  (b.no_prep||[]).forEach(function(x){o+='<div class="ex">• '+h(x)+'</div>'});
 }
 return o;
}
function doDraw(){
 var t=rnd(vis()),c=null;
 if($('comp')&&$('comp').checked){
  var n=rnd(COMPS),b=B().complications||{};c={name:n};
  if(n==='Чужая тема')c.words=pick(['Космос','Промышленность','Киноиндустрия','Искусственный интеллект','Садоводство','Музыка','Путешествие','Спорт','Природа'],3);
  if(n==='Фразеологический коктейль')c.idioms=pick(b.idioms||[{phrase:'водить за нос',where:'удар по логике соперника'},{phrase:'бить баклуши',where:'критика бездействия'},{phrase:'и на старуху бывает проруха',where:'довод про ошибки'}],3);
  if(n==='Ограниченный арсенал')c.arsenal=rnd(['а) статистические данные','б) личный опыт','в) цитаты и мнения авторитетных лиц']);
  if(n==='Дебаты в образе')c.genre=rnd(b.genres||['Медийное лицо','Сцена из пьесы','Народная сказка','Рекламный ролик','Стендап','Исторический персонаж'].map(function(g){return {genre:g}}));
 }
 DR={topic:t,side:rnd(['za','protiv']),comp:c,hidden:!!(c&&c.name==='С места в карьер')};
 stopTimer();
 if(DR.hidden)mode='speech';
 drawModes();drawBox();timerUI();
}
function drawBox(){
 var t=DR.topic,o;
 if(DR.hidden){
  o='<div class="draw"><div class="big">🎲 Тема и позиция скрыты до старта</div><div style="margin-top:8px">'+compInfo(DR.comp)+'</div></div>';
 }else{
  o='<div class="draw"><div class="partner">'+(t.stage==='okr'?'Окружная':'Региональная')+' · тема '+t.num+'</div><div class="big">'+h(t.title)+'</div>'+
   '<div class="side">'+(DR.side==='za'?'ЗА':'ПРОТИВ')+'</div>'+(DR.comp?'<div class="note"><b>Усложнение: '+h(DR.comp.name)+'</b><div style="margin-top:6px">'+compInfo(DR.comp)+'</div></div>':'')+'</div>'+
   '<button class="btn alt" style="width:100%" data-act="reveal">Показать разбор</button><div id="drawcard"></div>';
 }
 $('drawbox').innerHTML=o;
}
function phases(){return (DR&&DR.comp&&DR.comp.name==='С места в карьер'&&mode==='speech')?[MODES.speech.ph[1]]:MODES[mode].ph}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function timerUI(){
 var tb=$('timerbox');if(!tb)return;
 var p=phases();
 tb.innerHTML='<div class="phase" id="phname">'+h(p[0][0])+'</div><div class="clock" id="clock">'+fmt(p[0][1])+'</div>'+
  '<div class="row"><button class="btn" data-act="start" id="bstart">▶ Старт</button><button class="btn alt" data-act="pause">❚❚</button><button class="btn alt" data-act="reset">↺</button></div>';
 T={i:0,left:p[0][1],run:false,end:0,iv:null};
}
function paint(){
 var p=phases(),c=$('clock');if(!c||!T)return;
 $('phname').textContent=T.done?'Время!':p[T.i][0];
 c.textContent=fmt(T.left);
 c.className='clock'+(T.done?' end':(T.left<=10&&T.run?' warn':''));
}
var ac=null;
function beep(n){
 try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  for(var i=0;i<n;i++){var o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.value=.4;
   var s=ac.currentTime+i*.35;o.start(s);o.stop(s+.25)}}catch(e){}
 try{navigator.vibrate&&navigator.vibrate(n>1?[300,150,300,150,500]:[400])}catch(e){}
}
function startTimer(){
 if(!T)return;
 if(DR&&DR.hidden){DR.hidden=false;drawBox()}
 if(T.run||T.done)return;
 T.run=true;T.end=Date.now()+T.left*1000;
 try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume()}catch(e){}
 try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(function(){})}catch(e){}
 T.iv=setInterval(tick,200);paint();
}
function tick(){
 T.left=(T.end-Date.now())/1000;
 if(T.left<=0){
  var p=phases();
  if(T.i<p.length-1){T.i++;T.left=p[T.i][1];T.end=Date.now()+T.left*1000;beep(1)}
  else{T.left=0;T.done=true;T.run=false;clearInterval(T.iv);beep(3)}
 }
 paint();
}
function pauseTimer(){if(!T||!T.run)return;T.run=false;clearInterval(T.iv);T.left=(T.end-Date.now())/1000;paint()}
function stopTimer(){if(T&&T.iv)clearInterval(T.iv);T=null}
function resetTimer(){stopTimer();timerUI()}

/* ---------- старт ---------- */
regUI();
load().then(route).catch(function(){
 app.innerHTML='<div class="empty">Не удалось загрузить данные.<br>Откройте сайт по ссылке (GitHub Pages) или используйте файл offline.html</div>';
});
})();
</script>
