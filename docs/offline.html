{"core":"Что отдать первым: воду и свет людям или площадку серверам.","za":{"criterion":"Судим по приоритету: сначала вода и свет людям, потом серверам.","theses":[{"tezis":"Сервер можно перевезти. Реку и подстанцию — нельзя.","pochemu":"Серверу нужен канал связи, поэтому его выгодно ставить, где ресурсов избыток.","primer":"Мурманская область энергоизбыточна: Кольская АЭС и ГЭС дают больше, чем нужно региону."},{"tezis":"Ограничить круглосуточную нагрузку по региону уже умеют, и это работает.","pochemu":"Регулятор вправе ограничить нагрузку там, где энергосистема не вытягивает.","primer":"Майнинг запрещён до 2031: в Дагестане и на юге Иркутской области — круглый год."},{"tezis":"Вода и электричество для ЦОД — одна труба.","pochemu":"Даже «сухой» ЦОД пьёт воду через электростанцию, которая его питает.","primer":"МЭА: около 2/3 воды для ЦОД уходит на топливо и выработку электричества (2023)."}],"killer":"Сервер можно перевезти. Подстанцию и реку — нет.","image":"Два крана на одной трубе: человек и серверная стойка.","attacks":["Тариф и точечные нормы не строят подстанцию; они и есть наша позиция.","Тема про регион, а не страну: нагрузка уйдёт в регионы с избытком — это мы.","ИБП держит минуты, а клиентам ЦОД обещает непрерывную работу. Кто проверит отключение в жару?"],"ask":["Кому отключите свет первым в жару: больнице или серверу?","Какую выгоду жителю дефицитного региона даёт ЦОД, кроме нагрузки на сеть?"],"expect":[{"q":"Ограничение отпугнёт инвесторов и затормозит цифровизацию.","a":"Инвестору нужна гарантия мощности. Север и Северо-Запад её дают; в дефиците честный отказ лучше срыва."},{"q":"Кто решает, что такое дефицит?","a":"Прозрачные критерии: баланс мощности энергосистемы и водный баланс региона. Публичная карта, а не усмотрение чиновника."},{"q":"ЦОД платит налоги и подключение. Регион обеднеет без него?","a":"Налоги не греют, если вечером нет света. Бизнес на облаке не привязан к месту, а нагрузку на сеть получает регион."}],"infokiller":[{"q":"Современные ЦОД почти не потребляют воду.","a":"Напрямую — меньше. Но МЭА: около 2/3 воды для ЦОД уходит на выработку их электричества."},{"q":"В пик ЦОД переключится на дизель-генераторы.","a":"Тогда это условие в договоре с проверкой оператором сети. Нет условия — нет проекта. Дизель воду не лечит."},{"q":"Банкам и госсервисам нужен сервер рядом, а Мурманск далеко.","a":"Задержка важна малой части нагрузки: ей — небольшой узел рядом, тяжёлым вычислениям — регион с избытком."}]},"protiv":{"criterion":"Судим по условиям: ЦОД допустим, если сам платит за сеть и отключается в пик.","theses":[{"tezis":"Новая нагрузка оплачивает присоединение; запрет не построит подстанцию.","pochemu":"Дефицит лечат сетью и генерацией; запрет лишает регион платящего заказчика.","primer":"Заявитель в России платит за технологическое присоединение новой нагрузки к сети."},{"tezis":"ЦОД может отключаться в пик на резервной генерации.","pochemu":"У ЦОД есть ИБП и дизель-генераторы; нагрузка гибче, чем у завода.","primer":"Потребителям платят за снижение в пик, в том числе на резервной генерации (отбор Системного оператора)."},{"tezis":"Условия лучше запрета: проект с генерацией и сухим охлаждением проходит.","pochemu":"Плохие проекты отсеиваются расчётом нагрузки, а не общим запретом на регион.","primer":"Подключение к сетям в России требует заявки и расчёта мощности."}],"killer":"Дефицит лечат сетью и условиями, а не запретом на адрес.","image":"Не запирать ворота, а поставить шлагбаум с проверкой документов.","attacks":["Юг Иркутской области с ГЭС теперь под запретом майнинга: баланс меняется, нужна проверка проекта.","Водный кодекс уже ставит людей первыми, прочим — при достатке воды: это проверка проекта, не запрет.","Запрет майнинга не про ЦОД: майнинг услуг людям не даёт, ЦОД даёт."],"ask":["Какой проект ЦОД вы запретите и по какому расчёту нагрузки?","Если запретить регион, кто построит там подстанцию и сеть?"],"expect":[{"q":"Дефицит воды и тока реален. Почему ЦОД получает приоритет?","a":"Приоритета нет: люди и больницы первыми. ЦОД ограничивают расчётом нагрузки и условиями подключения, а не запретом по адресу."},{"q":"Даже «сухой» ЦОД пьёт воду через электростанцию. Дефицит остаётся?","a":"Значит, условие подключения — источник энергии и технология охлаждения. Это расчёт по проекту, а не запрет региона."},{"q":"Рабочих мест мало, ресурсы забирает. Где выгода региону?","a":"Мест мало, согласны. Налог на имущество с недвижимости идёт региону, а подключение оплачивает заявитель."}],"infokiller":[{"q":"Эксперт: в зимний пик сеть на пределе. Куда ЦОД?","a":"Нагрузку разводят: отключаемый режим, повышенный тариф в пик, резервная генерация. Это условие в договоре, а не запрет."},{"q":"Вы за технологии любой ценой, даже ценой воды?","a":"Нет. Цена ресурса вписана в тариф и условия охлаждения. Мы против запрета по региону, не против контроля."},{"q":"Цифровая экономика растёт. Любой регион обязан её кормить?","a":"Не любой. Размещать надо, где избыток энергии и холод, но решает расчёт по проекту, а не автоматический запрет."}]},"arsenal":{"stats":[{"fact":"Майнинг запрещён до 15 марта 2031 года в 13 регионах, включая Дагестан; на юге Иркутской области — круглый год с апреля 2025, в части Бурятии и Забайкалья — с 1 апреля 2026.","source":"Постановления Правительства РФ № 1869 (2024) и от 18.03.2026; РБК (вторичный источник)","year":2026,"url":"https://www.rbc.ru/crypto/news/69ccc6789a794776325c8be2","verified":true},{"fact":"МЭА: потребление электроэнергии дата-центрами вырастет с 415 ТВт·ч в 2024 году до около 945 ТВт·ч к 2030 году.","source":"IEA, Energy and AI","year":2025,"url":"https://iea.blob.core.windows.net/assets/de9dea13-b07d-42c5-a398-d1b3ae17d866/EnergyandAI.pdf","verified":true}],"quote":{"text":"приоритет использования водных объектов для целей питьевого и хозяйственно-бытового водоснабжения перед иными целями их использования. Предоставление их в пользование для иных целей допускается только при наличии достаточных водных ресурсов","author":"Водный кодекс РФ, ст. 3, п. 5","verified":true,"url":"https://www.consultant.ru/document/cons_doc_LAW_60683/4bc72521e78ee932bab61d4cecf2d816a6398900/"},"life":"Вспомни жару или отключение света в своём городе или у родных: что остановилось первым."},"traps":[{"problem":"Соперник: майнинг и ЦОД — не одно и то же.","exit":"Согласись. Майнинг — только прецедент ограничения по месту; основа довода — круглосуточная нагрузка."},{"problem":"Обвинение: «вы против прогресса и цифровизации».","exit":"Мы за ЦОД, но там, где подтверждён резерв мощности и воды."},{"problem":"Просят данные по конкретному ЦОД, которых у нас нет.","exit":"Говорим про механизм и баланс ресурсов региона, не про отдельные объекты. Цифр не называем."}],"verdict":{"winner":"za","why":"За побеждает: условия соперника по сути признают выбор региона по ресурсам. Против силён техникой (отключение в пик, сухое охлаждение), но обещания нечем проверить."}},"okr-13":{"core":"Лучший возраст для первого ребёнка: граница риска или готовность человека?","za":{"criterion":"Судите по измеримому риску для матери и ребёнка, а не по бюджету семьи.","theses":[{"tezis":"Риск растёт не плавно, а ускоряется после 35","pochemu":"Синдром Дауна, примерно: 1 к 1250 в 25, 1 к 100 в 40.","primer":"Россия: скрининг первого триместра считает риск с учётом возраста матери."},{"tezis":"Заморозка и ЭКО работают у молодых, поздно — слабо","pochemu":"Яйцеклетки советуют замораживать до 35: успех заморозки решает возраст.","primer":"ЭКО по ОМС с 2013 лечит бесплодие, но возраст яйцеклетки не меняет."},{"tezis":"ЭКО не отменяет возраст: шансы своими клетками после 40 падают втрое","pochemu":"До 35 — 31% родов на перенос эмбриона, после 40 своими клетками — 10%.","primer":"Британский регулятор HFEA, данные за 2018: возраст — главный фактор успеха ЭКО."}],"killer":"Кошелёк с годами растёт, а запас яйцеклеток убывает.","image":"Посадка растения: почву подготовить можно, а сезон не передвинешь.","attacks":["Скрининг снимает тревогу, но не риск: в 40 он вчетверо выше, чем в 35.","Средний возраст 26 — статистика выбора, а не доказательство оптимума.","Время и поддержка копятся с годами, возраст яйцеклетки — нет."],"ask":["Вы признали риск после 35. Почему не назвать верхнюю границу оптимума?","Готовность пришла в 40. Она вернёт шансы ЭКО, которые были до 35?"],"expect":[{"q":"Порог 35 выбран произвольно. Зачем делать из него границу?","a":"Граница условна, риск нет: 1 к 400 в 35, 1 к 100 в 40. Скрининг находит проблему, но возраст яйцеклетки не меняет."},{"q":"Здоровье в 20 не заменит ребёнку жильё. Что скажете 20-летней без опоры?","a":"Рожать в 20 не обязана. Окно с малым риском примерно 20–34: планировать, копить, родить до 35, не откладывать бессрочно."},{"q":"Готовность — здоровье, поддержка, время, жильё. Чем это не критерий?","a":"Это критерий условий, а условия растут с годами. Риск с годами растёт. Оптимум задаёт ограничение, а не то, что можно добрать."}],"infokiller":[{"q":"Ранние роды тоже бьют по учёбе и карьере. Это не риск?","a":"Бьют, но поправимо: академ, заочное, возврат на работу. Возраст яйцеклетки назад не отмотать."},{"q":"Подростковая беременность — медицинский риск. Значит, решает биология?","a":"Да, биология отсекает и слишком раннее, и позднее. Оптимум в середине окна: примерно 20–34, до отметки 35."},{"q":"Вы призываете женщин рожать в 20 вместо карьеры?","a":"Нет, решение за человеком. Но биология задаёт верхнюю границу, её не сдвинуть; готовность решает лишь, как успеть до неё."}]},"protiv":{"criterion":"Судим по ребёнку: у кого он получит заботу, безопасность и опору.","theses":[{"tezis":"Биология даёт широкое окно, внутри него решает готовность","pochemu":"Риск выше до 20 и после 35; между ними окно лет в пятнадцать.","primer":"Минтруд, 2025: средний возраст матери при первом ребёнке около 26 лет."},{"tezis":"Родительская ответственность — время, здоровье и поддержка, не только деньги","pochemu":"Богатая пара без времени и бедная пара с поддержкой: готовность — набор условий.","primer":"Ст. 63 СК: родители отвечают за здоровье, развитие и воспитание детей."},{"tezis":"Порог 35 условен: его выбрали как точку, где риск амниоцентеза равен риску аномалии","pochemu":"Скрининг первого триместра во многом снял тревогу о беременности после 35.","primer":"Медшкола Университета Алабамы (GLOWM, 2009): порог 35 выбран «довольно произвольно»."}],"killer":"Тело готово в 20. Ребёнку нужны ещё забота, опора и время.","image":"Водительские права: мотор заводит любой, а по трассе едет только готовый.","attacks":["Одна хромосомная аномалия и давние оценки: это не весь риск беременности.","Заморозка даёт выбор тем, кто не готов сейчас: это довод про готовность.","ЭКО после 40 — крайний случай, а спор про оптимум внутри окна."],"ask":["Рожать в 20 не обязана, сказали вы. Значит, решает человек, а не биология?","Окно 20–34 вы признали. Что внутри него решает, если не готовность?"],"expect":[{"q":"Яйцеклетки стареют, это факт. Вы игнорируете биологию?","a":"Нет. Риск выше до 20 и после 35, между ними долгое окно. Внутри него решают здоровье, поддержка и условия."},{"q":"Готовность неизмерима, возраст измерим. Чем вы меряете?","a":"Здоровье, жильё, доход или помощь семьи, партнёр, время на ребёнка. По каждому пункту можно проверить, а по настроению нельзя."},{"q":"Деньги и опыт добираются после рождения, годы нет. Что ответите?","a":"Часть условий не добирается: время на ребёнка, здоровье, поддержка рядом. Опора нужна с первых лет, а не потом."}],"infokiller":[{"q":"Риск осложнений после 35 вырастает? Какие цифры?","a":"Риск выше, признаю: в 40 синдром Дауна около 1 к 100, то есть 99 из 100 без него. Окно 20–35 широкое, решают условия."},{"q":"Подростковая беременность — признанный риск. Решает биология?","a":"Признаю: до 20 риск выше, и это тоже неготовность. Но между 20 и 35 спор решает не биология, а условия ребёнка."},{"q":"Демография требует рожать раньше. Откладывать не эгоистично?","a":"Спор об оптимуме для ребёнка. Средний возраст первого ребёнка в России около 26, это не откладывание до 40."}]},"arsenal":{"stats":[{"fact":"Синдром Дауна: около 1 к 1250 в 25 лет, 1 к 400 в 35, 1 к 100 в 40","source":"University of Alabama School of Medicine (GLOWM); округлённые оценки, у источников различаются","year":2009,"url":"https://glowm.com/resources/glowm_www4/presentations/MEP-Pub7946-The%20Fundamentals%20of%20Preconception%20Care-CC%20BY%20SA/Premodule%20File/age.htm","verified":true},{"fact":"Средний возраст матери при рождении первого ребёнка в России около 26 лет","source":"Минтруд РФ (первый замминистра О. Баталина), март 2025, по ТАСС (вторичный источник)","year":2025,"url":"https://expert.ru/news/v-mintrude-nazvali-sredniy-vozrast-zhenshchin-pri-rozhdenii-pervogo-rebenka","verified":true}],"quote":{"text":"Родители несут ответственность за воспитание и развитие своих детей.","author":"Семейный кодекс РФ, ст. 63, п. 1","verified":true,"url":"https://rulaws.ru/amp/Semeynyy-kodeks/Razdel-IV/Glava-12/Statya-63/"},"life":"Вспомни, в каком возрасте родители родили тебя и какая поддержка у них тогда была. Только реальное."},"traps":[{"problem":"Соперник: вы заставляете женщин рожать в 20.","exit":"Оптимум не обязанность: окно меньшего риска примерно 20–34, решение за человеком, государство помогает."},{"problem":"Требуют назвать, как измерить готовность.","exit":"Назвать: здоровье, жильё, доход или помощь семьи, партнёр, время. Не сводить к деньгам."},{"problem":"Цифры оспорят: «это один показатель, один синдром».","exit":"Признать: показатель один из многих; риск осложнений с возрастом тоже растёт. Не выдумывать новых цифр."}],"verdict":{"winner":"protiv","why":"Обе стороны сошлись: биология задаёт границы, примерно 20–35. Внутри окна ЗА сам оставил решение человеку, а ПРОТИВ расшифровал готовность. ЗА сильнее по цифрам риска."}},"okr-14":{"core":"Кто платит за ошибку, совершённую под давлением мошенников: банк или клиент?","za":{"criterion":"Судите по тому, кто дешевле всего предотвращает кражу: банк, а не клиент.","theses":[{"tezis":"Закон сам называет согласие под обманом недобровольным.","pochemu":"Человек уверен, что спасает деньги; его решением управляет мошенник.","primer":"Ч. 3.1 ст. 8 161-ФЗ: согласие «под влиянием обмана» — перевод без добровольного согласия."},{"tezis":"Банк видит схему, клиент видит один звонок.","pochemu":"У банка потоки переводов, аномалии, база ЦБ; у человека две минуты паники.","primer":"С 2024 банки сверяют получателя с базой ЦБ и при совпадении держат перевод два дня."},{"tezis":"Платит тот, кто дешевле предотвращает: ответственность заставляет банк вкладываться в защиту.","pochemu":"Задержка и проверка получателя дёшевы для банка; учить миллионы клиентов каждой схеме нельзя.","primer":"Британия ввела возмещение в 2024: потери упали примерно на 21%, бдительность клиентов не снизилась."}],"killer":"Ошибка человека не отменяет страховочный трос системы.","image":"Альпинист сорвался по своей ошибке, но страховочный трос обязана держать система.","attacks":["Предупреждение — шаблонная строка; в сценариях мошенников есть готовые ответы на сомнения жертвы.","Закон 2026 — минимум; шаблонное предупреждение не значит «банк всё выполнил».","Блокировки по 115-ФЗ — про отмывание денег, не про возврат жертвам; аналогия не работает."],"ask":["Если банк может приостановить перевод, почему вся ответственность за пропуск на клиенте?","Кто защитит пенсионера, которого полтора часа вёл профессиональный мошенник по «безопасному счёту»?"],"expect":[{"q":"Человек сам нажал кнопку. Где его ответственность?","a":"Не снимаем: умысел и грубая небрежность на нём. Но обман ломает осознанность, и весь ущерб на него перекладывать нельзя."},{"q":"Кто заплатит? Услуги банков подорожают для всех.","a":"Убытки от мошенничества — операционный риск банка. Дешевле вложиться в защиту и разделить потери, чем бросать пострадавших."},{"q":"Клиент и мошенник могут сговориться: банк будет платить за обман.","a":"Жертву от соучастника отличают признаки: новый получатель, цепочка переводов, срочность. Банк уже ловит дропперов по получателю, не по подтверждению."}],"infokiller":[{"q":"Банк не знает, что клиента обманули по телефону.","a":"Не всегда, но видит аномалии: новый получатель, крупная сумма, срочность, совпадение с базой ЦБ. На этом строится антифрод."},{"q":"Закон 2026: банк всё выполнил, клиент перевёл сам — денег нет. Вы против закона?","a":"Закон — минимум, мы спорим о норме. Шаблонная строка — не «всё выполнил». Британия возмещает и подтверждённые переводы."},{"q":"Банк не страховая. За что ему платить за чужие решения?","a":"Безопасность перевода — часть сервиса, как замок у банковской ячейки. Отвечает тот, кто её обеспечивает."}]},"protiv":{"criterion":"Справедливо отвечает тот, кто контролирует решение: банк за систему, клиент за выбор после предупреждения.","theses":[{"tezis":"Предупреждён и подтвердил повторно — это уже решение клиента.","pochemu":"Конкретное предупреждение даёт паузу и выбор; нажатие после него — решение, не рефлекс.","primer":"Закон 2024: перевод получателю из базы ЦБ ждёт два дня; подтвердил снова — банк исполняет."},{"tezis":"Государство уже выбрало модель: банк платит за свои нарушения, не за выбор клиента.","pochemu":"Банк выполнил все обязательные меры, клиент перевёл сам — компенсации нет.","primer":"Закон 210-ФЗ (2026): с марта 2027 банк платит, если нарушил обязательные меры."},{"tezis":"Банк, отвечающий за всё, начнёт решать за клиента, куда тратить деньги.","pochemu":"Чем дороже ошибка банка, тем чаще он блокирует и отказывает честным клиентам.","primer":"Блокировки счетов по 115-ФЗ: банки перестраховываются, честные клиенты доказывают добросовестность."}],"killer":"Нажал сам после предупреждения — решил сам. Банк не опекун.","image":"Банк — красный свет: предупредил, дальше решает водитель.","attacks":["Закон признаёт обман, но не обязывает банк платить, если тот всё выполнил.","Если получатель есть в базе ЦБ, банк уже отвечает по закону 2024; спор о другом.","Британия возмещает с потолком и исключением для грубой небрежности: «банк платит всегда» нигде нет."],"ask":["Если клиент сам перевёл деньги по своей воле, чьё это решение?","Как банку отличить обманутого клиента от участника схемы?"],"expect":[{"q":"Подтвердил сам, но воля под обманом не добровольна?","a":"Закон признаёт обман, но после паузы и конкретного предупреждения повторное подтверждение — уже выбор клиента."},{"q":"Небрежность остаётся на клиенте, значит возмещение не расслабит?","a":"Кто решит, что небрежность грубая? В Британии это и игнорирование предупреждения банка. Нужен ясный критерий: конкретное предупреждение."},{"q":"Банк тормозит переводы, значит отвечает за пропуск?","a":"Согласны: если получатель есть в базе ЦБ, банк уже возвращает деньги. Спор о переводе после предупреждения и повторного подтверждения."}],"infokiller":[{"q":"Пенсионера довели психологическим давлением. Вы его бросаете?","a":"Нет. Воля уязвима, поэтому нужны пауза и конкретное предупреждение, а не отмена воли. За нарушение обязательных мер платит банк."},{"q":"Банки собирают огромные комиссии. Разве не из них покрывать потери?","a":"Комиссия — плата за сервис, не за чужие решения. Покрытие любых потерь — скрытый налог на аккуратных клиентов."},{"q":"Где граница: банк платит ничего или всё?","a":"Граница — контроль. Банк платит, если нарушил обязательные меры или взломан; клиент — если после конкретного предупреждения подтвердил сам."}]},"arsenal":{"stats":[{"fact":"С 7 октября 2024 банки Великобритании возмещают жертвам мошенничества по Faster Payments до £85 000; грубая небрежность клиента исключает выплату.","source":"Payment Systems Regulator, PS24/7 и PS23/4","year":2024,"url":"https://www.psr.org.uk/publications/policy-statements/ps247-faster-payments-app-scams-reimbursement-requirement-confirming-the-maximum-level-of-reimbursement/","verified":true},{"fact":"Закон № 210-ФЗ от 26.06.2026 («Антифрод 2.0»): банк или оператор связи возмещает ущерб, если не выполнил обязательные меры; основные нормы — с 01.03.2027.","source":"Федеральный закон № 210-ФЗ от 26.06.2026, ст. 7 (ч. 3.13-1 – 3.13-7 ст. 8 161-ФЗ) и ст. 11, ГАРАНТ","year":2026,"url":"https://www.garant.ru/products/ipo/prime/doc/414344315/","verified":true}],"quote":{"text":"У кого выгода, у того и риск (cuius est commodum, eius est periculum).","author":"Римское право, юридическая максима","verified":true,"url":"https://www.rechteasy.at/wiki/cuius-est-commodum-eius-est-periculum/"},"life":"Вспомните тревожное сообщение «от банка»: сколько было времени на решение. Не выдумывайте историю."},"traps":[{"problem":"«Против» звучит как «сам виноват», «за» — как «банк платит всегда».","exit":"Против: начать с сочувствия, виноват преступник. За: оговорить умысел и грубую небрежность на клиенте."},{"problem":"Спор уходит в статистику потерь; российской оценки эффекта возмещения нет.","exit":"Вернуть к механизму: кто контролирует канал, кто дешевле предотвращает. Из цифр — британская оценка 2026."},{"problem":"Соперник сыплет деталями законов 2024, 2026 и британских правил.","exit":"Не спорить о деталях; держать принцип: ответственность по контролю, умысел и грубая небрежность на клиенте."}],"verdict":{"winner":"za","why":"За сильнее механизмом «дешевле предотвратить» и британским итогом: потери упали на 21%. Против опирается на закон 2026, но шаблонное предупреждение обходится, а закон — минимум, не потолок."}},"okr-15":{"core":"Защита ребёнка от давления против доступной помощи знакомого учителя.","za":{"criterion":"Судим по защите ребёнка: кто ставит оценку, не продаёт урок.","theses":[{"tezis":"Конфликт работает в обе стороны: платному ученику невольно завышают оценку, это нечестно к классу.","pochemu":"Даже честный учитель пристрастен к ученику, который ему платит.","primer":"Ст. 48 ч. 2 закона об образовании прямо называет этот риск: конфликт интересов."},{"tezis":"Ребёнок не может отказать: отказ грозит четвертной оценкой.","pochemu":"Зависимость от оценивающего делает «добровольность» формальностью; возникает давление.","primer":"Давление идёт через четверти, годовые и аттестат, где нет шифра ЕГЭ."},{"tezis":"Помощь не исчезнет: запрет касается только своих учеников.","pochemu":"Остаются чужие репетиторы, онлайн и бесплатные ресурсы школы.","primer":"Российская электронная школа бесплатно даёт уроки с 1 по 11 класс."}],"killer":"Нельзя ставить оценку ученику, которому продал урок.","image":"Судья продаёт билеты на матч: свисток звучит уже иначе.","attacks":["Четвертные и годовые ставит один учитель; комиссии есть только на экзаменах.","Один учитель предмета в селе — зона максимальной зависимости ребёнка, а не помощи.","Знание ребёнка — довод за бесплатную консультацию, а не за платный урок."],"ask":["Как ученик откажется от допов учителя, не рискуя четвертной оценкой?","Как класс проверит, что платному ученику не завышают оценку?"],"expect":[{"q":"В селе другого специалиста нет. Где ребёнок найдёт помощь?","a":"Онлайн-репетиторы, бесплатная РЭШ и консультации в школе. Запрет касается своих учеников, а не любых занятий."},{"q":"ЕГЭ проверяют чужие по шифру. Какое давление?","a":"ЕГЭ — только в конце 11 класса. Давление идёт через четверти, годовые, аттестат и 5–10 классы, где шифра нет."},{"q":"Учитель перегружен; индивидуальный разбор — отдельный труд.","a":"Отдельный труд оплачивает школа или бюджет: консультации, группы. Платит родитель из кармана тому, кто ставит оценку."}],"infokiller":[{"q":"Чужой репетитор не знает ребёнка. Разве это не потеря?","a":"Диагностика занимает час, цена конфликта интересов — годы зависимости. Чужой не рискует оценкой ребёнка."},{"q":"Запрет нарушает свободу труда.","a":"Узкая граница: нельзя учить платно тех, кого сам оцениваешь. Чужих учеников вести можно."},{"q":"Закон уже запрещает при конфликте интересов. Зачем запрещать всем?","a":"Сейчас конфликт доказывают жалобой зависимого ребёнка. Общий запрет снимает с него это бремя: достаточно факта платных занятий."}]},"protiv":{"criterion":"Судим по интересу ребёнка: что даст ему помощь и защитит от давления.","theses":[{"tezis":"Давление лечат отделением оценки, а не запретом помощи.","pochemu":"Давление теряет смысл, когда итоговую оценку нельзя поставить одному человеку.","primer":"ОГЭ и ЕГЭ проверяют чужие комиссии; в школе есть комиссия по урегулированию споров (ст. 45)."},{"tezis":"Свой учитель знает пробелы ребёнка и свои требования: помощь быстрее и дешевле.","pochemu":"Чужому репетитору сначала нужно время, чтобы найти пробелы и понять требования.","primer":"Учитель весь год видел контрольные ребёнка; чужой начинает с диагностики."},{"tezis":"В малом городе другого специалиста по предмету может не быть.","pochemu":"Один учитель предмета на школу: запрет оставляет ребёнка без помощи.","primer":"«Земский учитель» в 2026 году: свыше 1,2 тыс. вакансий в сёлах и малых городах."}],"killer":"Запрет не убирает репетиторство. Он убирает контроль и учителя.","image":"Запрет — закрыть единственный мост в село из-за одной аварии.","attacks":["«Завышают оценку» — примера нет; закон уже запрещает конфликт, значит дело в исполнении.","Если ребёнок не может отказать, он не пожалуется: ваш запрет тогда не работает.","Чужой репетитор платный и есть не везде; РЭШ не разберёт ошибки конкретного ребёнка."],"ask":["Что поймает учителя, занижающего оценки, кроме запрета на репетиторство?","Запретили; в селе один учитель предмета. Кто поможет ребёнку?"],"expect":[{"q":"Учитель занижает оценки ради клиентов. Как защитите детей без запрета?","a":"Комиссия по урегулированию споров, жалоба директору, дисциплинарное взыскание (ст. 45 закона об образовании). Наказываем давление, а не помощь."},{"q":"Родитель боится отказать учителю: давление реально.","a":"Защитный канал есть: родитель жалуется директору или в комиссию, учителю грозит взыскание. Давление наказываем, добровольную помощь не трогаем."},{"q":"Неравенство: у кого деньги, тот получает лучшего учителя.","a":"Платят и чужому репетитору. Свой учитель работает быстрее, а бесплатные консультации в школе можно требовать."}],"infokiller":[{"q":"Эксперт: педагогическая этика требует отделить урок от бизнеса.","a":"Этика требует прозрачности: договор, чек, отдельное время. Запрет грубый, граница «конфликт интересов» уже есть в законе."},{"q":"Эксперт: репетиторство — канал неформальных платежей.","a":"Платежи прячутся при запрете. Договор и чек делают их видимыми; проблема в отсутствии правил."},{"q":"Учитель обязан давать качество на уроке. Зачем ему репетиторство?","a":"Обязан, и это проверяют. Но урок на класс не заменяет разбор одного ребёнка; это отдельная услуга."}]},"arsenal":{"stats":[{"fact":"Закон «Об образовании в РФ» (ст. 48, ч. 2): педагог не вправе оказывать платные услуги ученикам своей организации, если это ведёт к конфликту интересов.","source":"ФЗ № 273-ФЗ «Об образовании в Российской Федерации», ст. 48 ч. 2","year":2012,"url":"https://rulaws.ru/laws/Federalnyy-zakon-ot-29.12.2012-N-273-FZ/Statya-48/","verified":true},{"fact":"Российская электронная школа даёт бесплатные интерактивные уроки по школьной программе с 1 по 11 класс.","source":"Российская электронная школа (вторичный источник: сайт школы на Госвебе)","year":2025,"url":"https://school18.gosuslugi.ru/roditelyam-i-uchenikam/uslugi-i-servisy/rossiyskaya-elektronnaya-shkola/","verified":true}],"quote":{"text":"Никто не должен быть судьёй в собственном деле.","author":"принцип римского права (nemo iudex in causa sua)","verified":true,"url":"https://www.thelatinlibrary.com/justinian/codex3.shtml"},"life":"Вспомни, как в твоей школе относились к «допам» учителя: давили ли и что было с теми, кто не ходил."},"traps":[{"problem":"Соперник: «хороший учитель не воспользуется положением».","exit":"Правило пишется на случай худших; судья тоже честный, но билеты не продаёт."},{"problem":"Спор уходит в низкие зарплаты учителей.","exit":"Вопрос про источник оценки, а не доход; зарплаты решаются отдельно."},{"problem":"Аргумент «запрет лишит детей помощи».","exit":"Помощь не запрещена: нельзя только тому, кто ставит оценку этому ребёнку."}],"verdict":{"winner":"za","why":"За побеждает: спор про источник оценки, а защита соперника требует жалобы от зависимого ребёнка. Против сильнее в сельском случае; онлайн и РЭШ закрывают его лишь частично."}},"okr-16":{"core":"Ирония в кризис: способ понять происходящее или способ не говорить всерьёз?","za":{"criterion":"Судим по функции: ирония называет проблему вслух или подменяет разговор о ней?","theses":[{"tezis":"Чтобы пошутить о беде, нужно увидеть разрыв «как должно» и «как есть»","pochemu":"Шутка — оценка в сжатом виде: вывод уже внутри. Не поняв кризис, не пошутишь.","primer":"Бергсон, «Смех»: комическое обращается «к чистому разуму»."},{"tezis":"Юмор относят к зрелым защитам: он позволяет чувствовать и думать одновременно","pochemu":"На высшем уровне защит беду видят без искажений; отрицание — гораздо ниже.","primer":"Grant Study, 30 лет наблюдения: Вайлант отнёс юмор к зрелым защитам."},{"tezis":"Общая ирония превращает одиночек в сообщество с общей оценкой события","pochemu":"Понял шутку — разделяешь опыт. Узнавание ломает изоляцию и запускает разговор.","primer":"Пандемия 2020: мемы про самоизоляцию и удалёнку сделали общий опыт видимым."}],"killer":"Шутку о кризисе не придумать, не поняв кризис.","image":"Перила на лестнице: идти по ступеням всё равно тебе, но не падаешь.","attacks":["Клапан — гипотеза. Юрчак пишет о том, как система рухнула, а не устояла.","Баумгартнер и Моррис: у зрителей сатиры выросла уверенность, что понимают политику.","Двусмысленность заставляет слушателя самому решать, что сказано. Это и есть осмысление."],"ask":["Что вы называете осмыслением, если не умение назвать беду и оценить её?","Какое исследование связывает иронию с отказом от действий? Назовите."],"expect":[{"q":"Смех снимает напряжение, из которого мог вырасти разговор. Разве не клапан?","a":"Паника — не разговор: со страха не думают. Шутка снижает накал, и дальше можно обсуждать. Что будет после, решает человек, не смех."},{"q":"После мема нет вывода. Это реакция, а не осмысление?","a":"Вывод внутри шутки: анекдот про дефицит говорит «система не работает». Действие — следующий шаг, а шутка ему не мешает."},{"q":"Если всё в шутку, искренний тон выглядит наивным. «Не душни»?","a":"Это вина реакции, а не иронии. Шутка назвала проблему, серьёзный вопрос после неё всё равно возможен. Задайте его прямо."}],"infokiller":[{"q":"Бергсон: смеху нужна «анестезия сердца». Это не бегство от боли?","a":"Бергсон дальше: комическое обращается к чистому разуму. Сердце выключают, чтобы включить ум; без отстранения остаются паника и пафос."},{"q":"Юрчак: стёб позднего СССР — жизнь внутри системы, без перемен. Что скажете?","a":"Книга Юрчака называется «Это было навсегда, пока не кончилось»: она о крахе системы. Стёб её не спас."},{"q":"Есть исследования, что юмор помогает именно осмыслению, не только смягчению?","a":"DMRS 2021: юмор — высший уровень защит, без искажений реальности. Вена 2017: чёрный юмор требует когнитивной обработки. Прямых данных про действия нет."}]},"protiv":{"criterion":"Судим по выводу: после иронии люди знают, что делать, или лишь «смешно»?","theses":[{"tezis":"Ирония работает клапаном: шутить безопасно, требовать трудно, пар уходит","pochemu":"Смех разряжает злость, из которой мог вырасти вопрос или действие.","primer":"Юрчак: позднесоветский стёб — часть жизни внутри системы, не борьба с ней."},{"tezis":"Привычная сатира даёт цинизм: смешно, но менять ничего не будем","pochemu":"Шутка называет, что плохо, но не называет, кто виноват и что делать.","primer":"Баумгартнер и Моррис, 2006: после сатирических новостей вырастало недоверие к выборам и СМИ."},{"tezis":"Ирония позволяет не занимать позицию: не поймёшь, всерьёз или в шутку","pochemu":"Нет позиции — нет и спора: возразить не на что, разговор не начинается.","primer":"Юрчак и Бойер 2010: в стёбе не понять, поддержка это или насмешка."}],"killer":"Назвать беду шуткой не значит понять её и что-то сделать.","image":"Обезболивающее без диагноза: боль утихла, причину никто не искал.","attacks":["Бергсон же: ради смеха выключают сердце. Ум без сочувствия — наблюдатель, не участник.","Юмор — защита: помогает выдержать, но не решает задачу. Выдержать не значит понять.","Мемы 2020 показали общий опыт, но не причины. «Мне тоже» — не вывод."],"ask":["Что должно прозвучать после шутки, чтобы вы признали её осмыслением, а не разрядкой?","Какой вывод вы назовёте из мема про самоизоляцию? Что он предлагает?"],"expect":[{"q":"Эзопов язык: где нельзя прямо, шутка единственный способ. Это не осмысление?","a":"Эзопов язык признаёт: прямого разговора нет. Шутка его заменяет, а не начинает: сказать не значит вывести и решить."},{"q":"Врачи и спасатели шутят и продолжают работать. Где тут уход?","a":"Шутка помогает выдержать смену, а осмысление — отдельная работа: разбор случаев, протокол. Одно другое не заменяет."},{"q":"Мемы про самоизоляцию сделали общий опыт видимым. Это не разговор?","a":"Видимым, да. Но вывод и действие из мема не следуют: узнавание без вывода остаётся настроением."}],"infokiller":[{"q":"При Сталине за анекдоты судили: смысл поняли точно. Разве это не осмысление?","a":"Власть поняла смысл и преследовала. Но понять шутку не значит занять позицию: стёб, по Юрчаку, неоднозначен."},{"q":"Юмор считают зрелой защитой психики. Разве защита плоха?","a":"Лучше отрицания, согласен. Но защита не решает задачу. Баумгартнер и Моррис: после сатиры росло недоверие к выборам и СМИ, а «я понимаю» — ещё не понимание."},{"q":"Горькая шутка в кризис нормальна. Вы хотите запретить смеяться?","a":"Нет, смейтесь. Спор о финале: после шутки звучит «и что дальше?» или все расходятся."}]},"arsenal":{"stats":[{"fact":"Юмор — защита высшего, 7-го уровня из 7: стресс воспринимается без искажений; отрицание — на 3-м уровне","source":"M. Di Giuseppe, J.C. Perry, «The Hierarchy of Defense Mechanisms» (шкала DMRS-Q), Frontiers in Psychology","year":2021,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC8555762/","verified":true},{"fact":"После сатирических новостей участники эксперимента сильнее не доверяли выборам и СМИ","source":"Baumgartner, Morris, «The Daily Show Effect», American Politics Research","year":2006,"url":"https://doi.org/10.1177/1532673X05280074","verified":true}],"quote":{"text":"Комическое требует чего-то вроде мгновенной анестезии сердца.","author":"Анри Бергсон, «Смех»","verified":true,"url":"https://www.gutenberg.org/files/4352/4352-h/4352-h.htm"},"life":"Вспомни реальную шутку в классе, чате или семье в трудный момент: после неё стало легче говорить или разговор прекратился?"},"traps":[{"problem":"Соперник приведёт шутку над жертвами трагедии: «это ирония?»","exit":"Развести: защищаем иронию изнутри, как выбор пострадавших, а не насмешку со стороны."},{"problem":"Вопрос про цифры: «сколько людей после шутки что-то сделало?»","exit":"Честно: прямых цифр нет. Опереться на Вайланта и механизм дистанции; не обещать, что шутка решает кризис."},{"problem":"Соперник скажет: «назвал и закрыл тему, шутка вместо разговора».","exit":"Закрывает не шутка, а реакция «не душни». Критерий: после шутки звучит прямой вопрос."}],"verdict":{"winner":"za","why":"ЗА сильнее: шутка требует понять разрыв, а прямых данных об «уходе» у ПРОТИВ нет. Клапан и цинизм остались гипотезами с оговорками; Вайлант, шкала DMRS и Бергсон дают механизм."}},"okr-17":{"core":"Спор о том, чем дешевле и честнее отбирать людей: бумагой или проверкой умения.","za":{"criterion":"Фильтр должен проверять умение работать; диплом — одно из доказательств, не пропуск.","theses":[{"tezis":"Обязательность превращает диплом в автоотказ: резюме без него не читают.","pochemu":"Фильтр по образованию отсекает кандидата до живого человека, ещё до оценки умений.","primer":"В поиске резюме на hh.ru есть фильтр по уровню образования."},{"tezis":"Диплом — слабый сигнал: он говорит о вузе, а не об умении.","pochemu":"Сигнал ценен, если отличает сильных от слабых; вузы выдают один диплом при разной подготовке.","primer":"IBM: раньше диплом требовали в 95% вакансий, к 2021 году — меньше половины."},{"tezis":"Даже где закон требует диплом, умение доказывает стаж, а не профиль.","pochemu":"Диплом — сигнал «где-то учился»; что человек умеет, показывает опыт работы.","primer":"Главбуху ПАО подходит любое высшее: без профильного — стаж 5 лет из 7 (402-ФЗ)."}],"killer":"Работодателю нужен водитель, а не паспорт.","image":"Диплом — паспорт вместо водительских прав: говорит, кто ты, но не умеешь ли ехать.","attacks":["Врачи, педагоги — допуск по закону, вне спора; Пленум разрешает требовать диплом, не обязывает.","«Заменят знакомствами» — без примера; прозрачный тест честнее неформального отбора по бумаге.","Реестр подтверждает выдачу, а не умение; части настоящих дипломов там нет."],"ask":["Что именно диплом предсказывает лучше, чем тестовое задание?","Скольких талантливых людей вы готовы отсечь ради удобства фильтра?"],"expect":[{"q":"Проверка навыка у ста кандидатов дороже диплома?","a":"Воронка: сначала опыт и портфолио, тест только финалистам. Диплом проверки не отменяет, он лишь добавляет шаг."},{"q":"Тестовое и портфолио нейросеть напишет. Диплом хотя бы проверяет вуз.","a":"Финалистов проверяют вживую: задача при интервьюере. Диплом тоже покупают и подделывают; проверять приходится всё равно."},{"q":"Гейтс и Цукерберг — ошибка выжившего?","a":"Согласны: единичные истории ничего не доказывают. Доказывает механизм: фильтр режет умелых по бумаге, а массовый отбор без диплома работает."}],"infokiller":[{"q":"Эксперт: работодатели сами ставят диплом — зачем вмешиваться?","a":"Часть снимает только на бумаге: автофильтр и привычка остаются. Меняем умолчание в вакансиях, не запрещаем; профессии с допуском по закону не трогаем."},{"q":"Эксперт: тестовые дорогие, диплом — бесплатный фильтр?","a":"Бесплатный для работодателя, дорогой для кандидата и экономики. Короткий тест финалистам дешевле неверного найма."},{"q":"Эксперт: вузы разве не учат думать?","a":"Учат, и это ценность вуза. Но думать доказывает работа; вуз остаётся выбором, а не пропуском."}]},"protiv":{"criterion":"Судим по цене ошибки: чем выше цена, тем строже нужен порог входа.","theses":[{"tezis":"Закон считает образование деловым качеством: отказ без нужного образования законен.","pochemu":"Пленум ВС: уровень образования — деловое качество; отказ по деловым качествам обоснован.","primer":"ТК ст. 70: выпускнику аккредитованной программы, впервые нанятому по специальности в течение года, — без испытания."},{"tezis":"На потоке откликов диплом — самый дешёвый общий фильтр.","pochemu":"Проверка в реестре — минуты; проверка навыка у каждого — часы рекрутера.","primer":"ФРДО проверяет выдачу диплома онлайн; запрос в вуз — только если записи нет."},{"tezis":"Тестовое нейросеть уже пишет; диплом проверяет третья сторона.","pochemu":"Выполненное задание не доказывает, кто его делал; реестр показывает выдачу диплома.","primer":"Январь 2023, британская фирма Schwa: рекрутеры пропустили тестовое ChatGPT на собеседование."}],"killer":"Уберёте диплом — фильтр останется, только им станут знакомства.","image":"Диплом — домофон: уберёшь, и пускать начнут по знакомству.","attacks":["Тестовое — бесплатный труд кандидата и часы проверяющего; на потоке откликов не масштабируется.","Если при дефиците компании сами снимают требование, закон «должен» не нужен.","Автоотказ — законный выбор работодателя (Пленум ВС № 2, п. 10); никто не обязывает."],"ask":["Как за минуту проверить навык у ста кандидатов без дипломного порога?","Где граница между «диплом нужен» и «не нужен»: врач, бухгалтер, инженер?"],"expect":[{"q":"Диплом гарантирует базу только на день выпуска. Разве нет?","a":"Диплом снижает риск, а не гарантирует навык; тест проверяет поверх него, а не вместо. Фильтры складываются."},{"q":"Диплом — барьер для бедных и самоучек.","a":"Диплом — планка с публичными правилами и госпроверкой. Тестовое у каждого работодателя своё и без правил."},{"q":"Фильтр остаётся: тестовое и испытательный срок. Чем плохо?","a":"Испытательный срок по ТК — до трёх месяцев: месяцы работы и зарплаты уже потрачены. Дешевле отсеять на входе."}],"infokiller":[{"q":"Эксперт: великие специалисты бывали без диплома. Что с ними?","a":"Где закон не требует образования, их и так берут. Исключения не отменяют правило там, где ошибка опасна."},{"q":"Эксперт: ИТ нанимает без дипломов и растёт. Чем объясните?","a":"В ИТ ошибку часто ловят тесты и ревью; ошибку врача или инженера — поздно. Порог зависит от цены ошибки."},{"q":"Эксперт: диплом через пять лет устареет. Зачем он?","a":"Он подтверждает базу и умение учиться, новое наращивается сверху. Без базы переучиваться не на чем."}]},"arsenal":{"stats":[{"fact":"Трудовой кодекс ограничивает испытательный срок тремя месяцами для большинства работников.","source":"ТК РФ, ст. 70","year":2001,"url":"https://legalacts.ru/kodeks/TK-RF/chast-iii/razdel-iii/glava-11/statja-70/","verified":true},{"fact":"ФИС ФРДО позволяет онлайн проверить наличие сведений о выданном дипломе (Правила — ПП РФ № 825).","source":"Рособрнадзор, ФИС ФРДО","year":2021,"url":"https://obrnadzor.gov.ru/gosudarstvennye-uslugi-i-funkczii/7701537808-gosfunction/formirovanie-i-vedenie-federalnogo-reestra-svedenij-o-dokumentah-ob-obrazovanii-i-ili-o-kvalifikaczii-dokumentah-ob-obuchenii/","verified":true}],"quote":{"text":"Запрещается необоснованный отказ в заключении трудового договора.","author":"ТК РФ, ст. 64, ч. 1","verified":true,"url":"https://legalacts.ru/kodeks/TK-RF/chast-iii/razdel-iii/glava-11/statja-64/"},"life":"Вспомни знакомого: сильного специалиста без профильного диплома или слабого с дипломом. Без имён, без выдумок."},"traps":[{"problem":"Вас обвинят в нападении на высшее образование.","exit":"Вуз остаётся выбором и сигналом; уходит только монополия бумаги как автоотказа."},{"problem":"«А врачи и пилоты?» — самый сильный контрудар.","exit":"За: врач и педагог — допуск по закону, вне спора. Против: где граница — врач, бухгалтер, инженер? «Обязательный» — требование вакансии."},{"problem":"Просят доказать, что что-то работает лучше диплома.","exit":"Цифр не называть; логика: цена проверки на потоке и риск подделки у обоих фильтров."}],"verdict":{"winner":"protiv","why":"Против сильнее: диплом — дешёвый фильтр с проверкой в реестре, а отказ по образованию суд признаёт обоснованным. За держится на автоотказе и IBM, но тесты дороже и подделываются."}},"okr-18":{"core":"Кто решает, где ИИ допустим в учёбе: вуз заранее или студент?","za":{"criterion":"Судите по тому, что подтверждает вуз: оценку и диплом.","theses":[{"tezis":"Диплом — подпись вуза перед работодателем, а не личное дело.","pochemu":"Если работу написал ИИ, вуз подтверждает навык, которого нет; честные теряют в цене.","primer":"РГГУ, 2023: студент публично заявил, что защитил диплом, написанный с ChatGPT; вуз не отозвал диплом."},{"tezis":"Перечень делает нарушение определимым: без нормы вуз не оспорит оценку.","pochemu":"Защита ловит непонимание, перечень задаёт границу; студент заранее знает, что можно.","primer":"ВШЭ: запрет ИИ пишут в программе курса; нарушил — преподаватель вправе ставить «0»."},{"tezis":"Перечень бережёт навык, без которого ИИ не проверить.","pochemu":"Проверить ответ ИИ может лишь тот, кто умеет сделать сам.","primer":"MIT, препринт 2025, 54 чел.: писавшие с нейросетью с трудом цитировали свои эссе."}],"killer":"Калькулятор запрещают ровно там, где проверяют счёт.","image":"Марафон: на трассе можно пить воду, но не ехать на самокате.","attacks":["Раскрытие без границы навык не защищает: где проверяют умение, одного указания мало.","Попадается не слабая модель, а непонимание: защита проверяет знание, а не тариф.","В той же ВШЭ преподаватель вправе запретить ИИ и ставить «0»: граница — за вузом."],"ask":["Как работодателю отличить диплом студента от диплома нейросети без правил вуза?","Чем честный студент защищён от того, кто сдал текст ИИ?"],"expect":[{"q":"Как докажете, что работа сделана ИИ?","a":"Правило не про ловлю, а про формат: устная защита, письменная работа в аудитории, черновики. Доказательство — владение материалом."},{"q":"Запрет старомоден: в профессии ИИ используют везде.","a":"Перечень узкий: только там, где проверяется собственный навык. Остальное разрешено с указанием, а ИИ учат там, где он цель."},{"q":"Вуз не должен контролировать личную жизнь студента.","a":"Он контролирует не личную жизнь, а то, что подписывает: оценку и диплом. Дома пользуйтесь чем хотите, пока не сдаёте это на зачёт."}],"infokiller":[{"q":"Детекторы ИИ дают ложные срабатывания. Невиновных накажут.","a":"Согласны: детектор не доказательство. Поэтому проверка через вопросы по работе и историю черновика, а не вердикт программы."},{"q":"Защита и так всё проверит. Зачем перечень?","a":"Защита ловит непонимание, перечень делает нарушение определимым. В ВШЭ при явном запрете преподаватель вправе поставить «0»; без нормы — произвол."},{"q":"Через пять лет перечень устареет.","a":"Перечень пересматривается каждый семестр, как программа курса. Отсутствие правил устаревает быстрее: выбор превращается в принуждение."}]},"protiv":{"criterion":"Вуз проверяет понимание студента; запрет без доказательства — фикция.","theses":[{"tezis":"Раскрытие использования ИИ честнее перечня запретов.","pochemu":"Студент пишет, как применил ИИ; решение остаётся за ним, оценка — за преподавателем.","primer":"Студент пишет: «ИИ составил план, правил язык» — остальное преподаватель оценивает как его."},{"tezis":"Ведущие вузы выбирают раскрытие, а не общий запрет.","pochemu":"Раскрытие работает для любой работы; список устаревает и не различает, что делал ИИ.","primer":"ВШЭ: нет общеуниверситетского запрета на ИИ; студент указывает характер и объём работы ИИ."},{"tezis":"Запрет без доказательства карает слабых, а не хитрых.","pochemu":"Детектор даёт вероятность, не факт; сильная модель пишет неотличимо, попадается слабая.","primer":"OpenAI в 2023 закрыла свой детектор ИИ-текста из-за низкой точности."}],"killer":"Проверяйте понимание вслух, а не запрещайте инструмент на бумаге.","image":"Охранник у главной двери, пока окна открыты настежь.","attacks":["Защиту провёл сам вуз и диплом не отозвал; провал контроля не лечится списком.","Перечень без доказательства — обвинение «на глазок», которого вы боитесь; предсказуемость даёт формат.","В том же препринте: сначала сам, потом ИИ — помнили лучше. Нужен порядок, не запрет."],"ask":["Как вуз докажет, что текст написал ИИ, а не студент?","Кто отвечает, когда детектор ошибся и честного студента наказали?"],"expect":[{"q":"Студент напишет диплом через ИИ и ничего не поймёт?","a":"Он провалит защиту: вопросы комиссии вскрывают непонимание. Вузу нужны устные формы оценки, а не список запрещённых работ."},{"q":"ИИ как калькулятор: его запрещают там, где проверяется счёт.","a":"Калькулятор запрещают на очном экзамене: это форма контроля, согласны. Спор про перечень домашних работ, где запрет не проверить."},{"q":"Значит, на экзамене ИИ можно?","a":"Очный экзамен — форма контроля, её задаёт вуз. Домашние работы: выбор и ответственность за результат на студенте."}],"infokiller":[{"q":"Вузы выдают государственные дипломы. Разве не обязаны гарантировать компетенции?","a":"Гарантия — в оценивании: защита, устный экзамен, практика. Перечень запретов не гарантирует компетенции, а создаёт видимость контроля."},{"q":"Диплом, написанный нейросетью, — разве не довод за запрет?","a":"Это довод усилить защиту: слаба защита, а не отсутствие перечня. Тот же состав комиссии со списком ничего бы не поймал."},{"q":"Оценить ответ ИИ может лишь тот, кто умеет сам.","a":"Согласны, поэтому учиться надо на практике с ИИ под контролем преподавателя. Запрет откладывает навык проверки, а не создаёт его."}]},"arsenal":{"stats":[{"fact":"OpenAI с 20 июля 2023 отключила детектор ИИ-текста из-за низкой точности: он узнавал лишь 26% ИИ-текстов.","source":"OpenAI, AI Text Classifier (пометка об отключении)","year":2023,"url":"https://openai.com/index/new-ai-classifier-for-indicating-ai-written-text/","verified":true},{"fact":"Sciences Po в январе 2023 запретил ChatGPT в работах без прозрачной ссылки; исключение — учебные цели под контролем преподавателя.","source":"Sciences Po, письмо студентам (Reuters; вторичный источник)","year":2023,"url":"https://whbl.com/2023/01/27/top-french-university-bans-use-of-chatgpt-to-prevent-plagiarism/","verified":true}],"quote":{"text":"Образовательная организация несёт ответственность … за реализацию не в полном объёме образовательных программ в соответствии с учебным планом, качество образования своих выпускников.","author":"ФЗ «Об образовании в РФ», ст. 28 ч. 7","verified":true,"url":"https://rulaws.ru/laws/Federalnyy-zakon-ot-29.12.2012-N-273-FZ/Statya-28/"},"life":"Вспомните работу, где оценка не отражала ваше понимание, и работу, где пришлось разбираться самому. Не выдумывайте историю."},"traps":[{"problem":"Нас представят крайностью: тотальный запрет ИИ или защита списывания.","exit":"За: перечень узкий, остальное с указанием. Против: честность важна, её обеспечивают формат оценки и раскрытие."},{"problem":"Давят ложными срабатываниями детекторов.","exit":"Не опираться на детекторы: устная защита, черновики, формат работы. Детектор — не доказательство."},{"problem":"Приводят студентов с ОВЗ и иностранцев, которым ИИ помогает.","exit":"Адаптации и исключения прописывает вуз; перечень гибче личного усмотрения каждого, а раскрытие снимает подозрения."}],"verdict":{"winner":"za","why":"За удержало связку «защита ловит непонимание, перечень задаёт границу». Против сильнее по детекторам и раскрытию, но признал запрет на экзамене, и граница сдвинулась к «за»."}},"okr-19":{"core":"Короткий горизонт молодых: расчёт под риск или навык, который утрачивается?","za":{"criterion":"Судим по результату: что рационально, когда правила меняются быстрее, чем длится план?","theses":[{"tezis":"Долгий жёсткий план в нестабильной среде — ставка, что ничего не изменится","pochemu":"Чем выше неопределённость, тем дороже ошибка прогноза; разумный человек планирует короче и пересматривает.","primer":"Россия 2022: ключевую ставку подняли с 9,5% до 20% за один день."},{"tezis":"Молодые планируют чаще старших: способность на месте, меняется длина этапа","pochemu":"Горизонт задают условия, а не характер: цели есть, меняется длина этапа.","primer":"ВЦИОМ, 2024: среди 18–35 планы строят 85%, среди старших — 66%."},{"tezis":"Когда шок прошёл, горизонт вернулся — значит, это адаптация","pochemu":"Утраченный навык сам не возвращается; горизонт вернулся — значит, его сжимала среда.","primer":"ВЦИОМ, ноябрь 2024: на годы вперёд планируют 29%, в 2020–2023 — 20–25%."}],"killer":"Горизонт сократила среда, а не слабость молодых.","image":"Штурман в тумане: идёт короткими отрезками по эхолоту, а не по карте на год.","attacks":["«Привычка переживает причину»: Малмендир и Нагел — про акции в США, не про планы россиян.","«Без плана цели реже»: это корреляция, не причина. И долгих планов стало больше.","«Упущенные годы»: на пять лет молодые планируют чаще старших — 16% против 10%."],"ask":["Малмендир — про акции в США. Где российские данные о закреплении привычки?","Условия смягчились — когда? Назовите дату, после которой горизонт обязан вернуться."],"expect":[{"q":"Ставка вернулась к 9,5% уже в июне 2022. Где нестабильность?","a":"Скачок за день и возврат за месяцы — и есть нестабильность: план под такую ставку ломался дважды."},{"q":"Адаптация закрепляется в привычку. Молодые разучатся планировать надолго.","a":"Данные против: молодые планируют чаще старших. Привычка закрепляется без практики, а у молодых она есть: учёба, переобучение, подушка."},{"q":"Гибкость стоит на долгой базе: навыки, образование, сбережения. Молодые её строят?","a":"Да: учёба, переобучение и подушка — вложения на годы. Это долгая стратегия под риск, а не жизнь одним днём."}],"infokiller":[{"q":"Есть данные, что молодёжь стала хуже планировать?","a":"Наоборот: ВЦИОМ, июнь 2024: планы строят 85% людей 18–35 лет и 66% старше. Данных об утрате навыка нет."},{"q":"Если молодые планируют дальше старших, вы спорите с темой?","a":"Нет. Снижение — относительно прошлого, общий фон после 2022. Мы объясняем его причину: среда, а не слабость молодых."},{"q":"Короткий горизонт — выбор, а не навязанный. Значит, виноваты сами молодые?","a":"Горизонт навязан условиями: ставка до 20% за день в 2022. Выбор есть в способе: короткие этапы вместо жёсткого плана."}]},"protiv":{"criterion":"Судим по обратимости: вернётся ли долгий план, когда условия смягчатся?","theses":[{"tezis":"Привычка переживает причину: опыт нестабильности меняет решения надолго","pochemu":"Решения формирует пережитый опыт, а не текущие условия.","primer":"Малмендир, Нагел 2011 (США): опыт слабого рынка надолго снижал готовность к риску."},{"tezis":"Без долгого плана цели достигаются реже","pochemu":"Долгая цель задаёт шаги; без неё усилия рассыпаются на случайные задачи.","primer":"ВЦИОМ, ноябрь 2024: цели достигают 84% планирующих на годы и 48% живущих днём."},{"tezis":"Время — главный ресурс: упущенные годы долгого проекта не вернуть","pochemu":"Навык и накопления дают отдачу только за годы; задержка отнимает конец траектории.","primer":"Начавший копить в 22 и в 32 года приходит к 40 с разной суммой."}],"killer":"Адаптация, которая не заканчивается, перестаёт быть адаптацией.","image":"Нога в гипсе: спасает при травме, но без снятия гипса мышца слабеет.","attacks":["«Ставка 2022 — шок»: 20% держалась недели, к 14 июня вернулась к 9,5%.","ВЦИОМ — самооценка: утрату навыка и возврат к долгому плану он не измеряет.","«Горизонт вернулся»: 29% — все россияне, не молодёжь; и это самооценка."],"ask":["Условия смягчились, а горизонт короткий: по каким признакам вы назовёте это адаптацией?","Назовите долгий актив, который строится этапами по три месяца."],"expect":[{"q":"Родители пережили 90-е, а навыки теперь стареют быстрее. Чем сегодня хуже?","a":"Быстрее стареют навыки, значит переучиваться надо на годы вперёд. Это долгий план, а не режим от зарплаты до зарплаты."},{"q":"ВЦИОМ 2024: планы строят 85% молодых, больше, чем старших. Где утрата?","a":"Это самооценка. Опрос не показывает, вернётся ли долгий горизонт, когда условия смягчатся, и не объясняет причину."},{"q":"Молодые переучиваются и копят подушку. Разве это не планирование?","a":"Если это цель на годы — да. Подушка «на всякий случай» — реакция на шок; план — цель на пять лет и шаги."}],"infokiller":[{"q":"Есть данные, что молодёжь стала хуже планировать?","a":"Прямых данных об утрате нет. Но ВЦИОМ, 2024: цели достигают 84% планирующих на годы и лишь 48% живущих днём."},{"q":"Вы предлагаете десятилетние планы в кризис. Это разумно?","a":"Нет, не жёсткие планы. Нужны направление, короткие шаги и запасные ходы. Это стратегия, а не расписание."},{"q":"Адаптация и утрата навыка не исключают друг друга?","a":"Различает обратимость. Рост долгих планов в 2024 — средний по стране; молодым он возврат не гарантирует."}]},"arsenal":{"stats":[{"fact":"В июне 2024 планы на жизнь, по собственным оценкам, строили 85% россиян 18–35 лет и 66% остальных (36+); на год вперёд планируют 31% против 24%, на пять лет — 16% против 10%","source":"ВЦИОМ, «Квартира, автомобиль и бизнес», 26.06.2024","year":2024,"url":"https://wciom.ru/analytical-reviews/analiticheskii-obzor/kvartira-avtomobil-i-biznes","verified":true},{"fact":"Ключевая ставка Банка России: с 28.02.2022 — 20% (было 9,5%); с 11.04.2022 — 17%; далее 14% и 11%; с 14.06.2022 — 9,5%","source":"Банк России, база данных «Ключевая ставка»","year":2022,"url":"https://www.cbr.ru/hd_base/KeyRate/?UniDbQuery.Posted=True&UniDbQuery.From=01.02.2022&UniDbQuery.To=30.06.2022","verified":true}],"quote":{"text":"Планы бесполезны, но планирование — это всё.","author":"Дуайт Эйзенхауэр, речь 14.11.1957, со ссылкой на армейскую поговорку («Plans are worthless, but planning is everything»)","verified":true,"url":"https://www.presidency.ucsb.edu/documents/remarks-the-national-defense-executive-reserve-conference"},"life":"Вспомни, как планы друзей или твои поменялись из-за курса, ставок или правил, и что сохранилось. Только реальное."},"traps":[{"problem":"Соперник: «вы оправдываете безответственность и инфантилизм».","exit":"Развести: безответственность — трата без расчёта; адаптация — расчёт под риск. Привести подушку и переобучение."},{"problem":"ВЦИОМ вспомнят неточно или скажут: планы строят, но короткие.","exit":"Называть 85% и 66% (июнь 2024) как самооценку. Горизонты: на год 31% против 24%, на пять лет 16% против 10%."},{"problem":"Соперник: «адаптация и утрата не противоречат друг другу».","exit":"Согласиться и развести по обратимости: данных, что горизонт не вернётся, нет."}],"verdict":{"winner":"za","why":"ЗА показал данные ВЦИОМ: молодые планируют чаще старших, а после шока 2022 долгие планы вернулись. ПРОТИВ доказал пользу долгого плана, но не утрату навыка у молодых."}},"okr-20":{"core":"Кто платит за поиск и можно ли продавать первую строку выдачи.","za":{"criterion":"Судим по честности: первую строку занимает релевантность или рекламодатель.","theses":[{"tezis":"Платный топ закрыт для тех, у кого нет рекламного бюджета.","pochemu":"Верхние места продаются на аукционе: без ставки туда не попасть.","primer":"В Директе место объявления решают ставка, качество и прогноз кликов."},{"tezis":"Первая строка забирает львиную долю кликов; продавать её — продавать доверие.","pochemu":"Люди привыкли верить верху выдачи; метка не меняет, куда они жмут.","primer":"Backlinko, 4 млн выдач Google: первая органическая строка — 27,6% кликов, вдесятеро больше десятой."},{"tezis":"Закон возлагает раскрытие на рекламодателя, а не на читателя.","pochemu":"Информированная сторона отвечает за раскрытие; пользователь в спешке не эксперт.","primer":"Закон о маркировке (347-ФЗ, с 1 сентября 2022) обязал рекламодателя и распространителя, не читателя."}],"killer":"Топ выдачи — справочная, а не витрина. Справочную не продают.","image":"Табличка «Информация» в аэропорту, а за стойкой продавец туров.","attacks":["Ложная дилемма: убираем платные места в топе, реклама остаётся блоком рядом.","Сравнивать можно и в органике; платёж ставит ссылку первой, а не лучшей.","Новичку нужен бюджет на ставку — значит, верх снова у того, кто платит."],"ask":["Если реклама легко отличима, зачем закон обязал её маркировать?","Пенсионер кликнул рекламу вместо ответа. Это его вина или выдачи?"],"expect":[{"q":"Поиск бесплатный. На что он будет жить?","a":"Реклама остаётся блоком рядом и ниже, плюс подписки и другие сервисы. Ограничиваем место, а не доходы."},{"q":"Рекламодатель часто и есть лучший ответ.","a":"Если лучший, выйдет в органику сам. Платёж не должен быть пропуском в первую строку."},{"q":"Как отделить рекламу от органики технически?","a":"Отдельный блок и явная метка. Закон о маркировке уже требует отметку; мы убираем платные места из топа."}],"infokiller":[{"q":"Пометка «Реклама» и erid уже отличают рекламу.","a":"Метку видно, но первая строка всё равно забирает клики. Пометка не меняет порядок строк."},{"q":"Запрет ударит по малому бизнесу.","a":"Блок рядом остаётся доступным: малый бизнес рекламируется, просто не в первой строке."},{"q":"SEO искажает не меньше, и его не маркируют.","a":"SEO не гарантирует позицию, платное место гарантирует. Убрать гарантированный платный топ — шаг вперёд, не решение всего."}]},"protiv":{"criterion":"Судим по результату для пользователя: бесплатный поиск и честная маркировка.","theses":[{"tezis":"Реклама оплачивает бесплатный поиск; без неё платит пользователь.","pochemu":"Слот ценен заметностью; блок ниже собирает меньше, замена — подписка или данные.","primer":"Реклама Яндекса почти вся в сегменте «Поиск и портал»: 439 млрд руб. за 2024."},{"tezis":"Платная ссылка не лучший магазин, а возможность сравнить предложения.","pochemu":"Пользователь листает и сравнивает; пометка говорит, кто заплатил.","primer":"Рекламные блоки в выдаче Яндекса помечены отдельной меткой."},{"tezis":"Платный слот — вход для новичка: без истории в органику не пробиться.","pochemu":"Органику зарабатывают годами; новому магазину реклама даёт показ сразу.","primer":"У Яндекса 382 тыс. рекламодателей из МСБ — 55% рекламной выручки (2024)."}],"killer":"Бесплатный поиск не бывает без спонсора. Выбор: реклама или счёт.","image":"Реклама — вывеска на фонаре: платит за свет и видна как вывеска.","attacks":["«Без бюджета не попасть» — а в органику новичок без истории попадёт?","27,6% — органика Google; о рекламных местах Яндекса цифра ничего не говорит.","Закон возложил раскрытие на рекламодателя — значит проблему решают маркировкой, не запретом."],"ask":["Кто оплатит содержание поиска, если платные места в топе уберут?","Чем запрет лучше маркировки, которая уже работает?"],"expect":[{"q":"Люди не читают пометку «Реклама». Разве это не обман?","a":"Значит, усиливаем маркировку: цвет, подпись, отдельный блок. Запрет не учит отличать, он прячет проблему."},{"q":"Реклама в топе вытесняет честные ответы.","a":"Вредит, если скрыта. Видимая реклама — выбор пользователя: можно листать мимо. Скрытая накрутка вредит сильнее."},{"q":"Брин и Пейдж в 1998 писали: рекламный поиск смещён к рекламодателю.","a":"Потом Google сам перешёл на рекламу и стал крупнейшим поиском. От смещения защищают метка и отдельная органика."}],"infokiller":[{"q":"Эксперт: дизайн маскирует рекламу под ответ. Пользователь бессилен.","a":"Тогда требуем честный дизайн: чёткая метка, отдельный блок. Нарушителей штрафуют. Это точная мера, а не запрет."},{"q":"Эксперт: без рекламы поиск станет лучше, есть платные поисковики.","a":"Платные есть, но для узкой аудитории. Массовый поиск доступен всем, потому что оплачен рекламой."},{"q":"Вы перекладываете ответственность на школьника.","a":"Ответственность делится: платформа маркирует, рекламодатель отвечает, пользователь учится. Нужна медиаграмотность, не запрет рекламы."}]},"arsenal":{"stats":[{"fact":"Интернет-реклама в России маркируется токеном: обязанность по 347-ФЗ — с 1 сентября 2022, штрафы — с 1 сентября 2023.","source":"ФЗ от 02.07.2021 № 347-ФЗ; штрафы — ФЗ от 24.06.2023 № 274-ФЗ; БУХ.1С (вторичный источник)","year":2023,"url":"https://buh.ru/articles/shtrafy-za-narushenie-pravil-rasprostraneniya-internet-reklamy-s-1-sentyabrya-2023-goda.html","verified":true},{"fact":"Выручка Яндекса в 2024 году — 1 095 млрд руб.; сегмент «Поиск и портал», где почти вся реклама, — 439 млрд руб., около трети (33%).","source":"Презентация Яндекса для инвесторов за 4 кв. и 2024 год","year":2024,"url":"https://yastatic.net/s3/ir-docs/docs/2024/q4/cbf2d1c3ff32ff65da6l438h44902945/IR_4Q2024_RUS.pdf","verified":true}],"quote":{"text":"Мы ожидаем, что поисковые системы, финансируемые рекламой, будут по природе смещены в сторону рекламодателей и от нужд потребителей.","author":"Сергей Брин и Лоуренс Пейдж, 1998, статья об архитектуре Google (перевод)","verified":true,"url":"https://test-innovation-regulation.telecom-paris.fr/wp-content/uploads/2017/11/1a-Burguet-Caminal-ELLMAN.pdf"},"life":"Вспомни, как кликнул по первой ссылке в поиске, а потом понял, что это была реклама."},"traps":[{"problem":"Спор уходит в Яндекс против Google и политику.","exit":"Вопрос о принципе: порядок строк выдачи, а не конкретная компания."},{"problem":"«Маркировка уже есть», и даты закона путаются.","exit":"Говори: закон действует с 1 сентября 2022, штрафы с 1 сентября 2023. Маркировка признаёт проблему, но порядок строк сильнее метки."},{"problem":"Просят экономику: сколько стоит поиск и кто за него платит.","exit":"Цифра есть: «Поиск и портал» Яндекса — 439 млрд руб. за 2024, треть выручки. Дальше спорь о механизме."}],"verdict":{"winner":"protiv","why":"Против побеждает узко: маркировка уже есть, а за не показал, чем заменить самый дорогой слот. За сильнее в логике «платёж вместо релевантности»."}},"okr-21":{"core":"Спор о том, ограничивает ли одежду реальный вред или привычка и вкус.","za":{"criterion":"Дресс-код оправдан, только если защищает работу или клиента; вкус коллег — не основание.","theses":[{"tezis":"Ограничение одежды требует доказанного вреда; от худи в офисе вред не показан.","pochemu":"Дресс-код ограничивает свободу; ограничение оправдано, только если есть конкретный ущерб работе.","primer":"Закон костюма не требует: дресс-код вводит работодатель правилами внутреннего трудового распорядка."},{"tezis":"Уважение измеряется поведением: вовремя, по делу, без хамства — не пиджаком.","pochemu":"Хамить можно в костюме, блестяще работать — в худи; одежда уважения не гарантирует.","primer":"Весной 2020 года заметная часть россиян ушла на удалёнку — работа шла без пиджаков."},{"tezis":"Даже консервативные компании сами отказываются от строгого дресс-кода.","pochemu":"Банк дорожит репутацией; раз он ослабил дресс-код, вреда от свободы не видит.","primer":"Goldman Sachs в 2019 году ввёл гибкий дресс-код: одеваться по ожиданиям клиента."}],"killer":"Уважение — в поступках, а не в пуговицах.","image":"Обёртка не делает конфету вкуснее: костюм — упаковка, не результат.","attacks":["Гость в звонке? Пиджак на спинке стула или выключенная камера решают за минуту.","Риск новичка лечится ясной нормой «опрятно», а не обязательным костюмом.","Опыт про абстрактное мышление, не про уважение к коллегам и не про худи."],"ask":["Какое именно рабочее решение стало хуже из-за худи?","Кто вправе назвать мой стиль неуважением — коллектив или чей-то вкус?"],"expect":[{"q":"Оверсайз — это же неряшливость, разве нет?","a":"Худи и оверсайз — не небрежность. Чистая вещь свободного кроя опрятна; грязь и дыры мы не защищаем."},{"q":"Кто решает границу, если нормы нет совсем?","a":"Границу задают заранее, по задаче: опрятность, безопасность, клиент. Это минимальная норма, а не вкус начальника."},{"q":"Клиент судит по виду. Видеозвонок — тоже встреча?","a":"Согласны: на встречу и звонок с клиентом формат выбирают под клиента. Спор об обычном рабочем дне, не о переговорах."}],"infokiller":[{"q":"Эксперт: формальная одежда повышает серьёзность восприятия — игнорируете?","a":"Восприятие существует, но результат работы важнее. Серьёзность создаёт качество работы, а не привычный дресс-код."},{"q":"Эксперт: молодёжь копирует блогеров — это индивидуальность или стадность?","a":"Любая мода отчасти стадная, костюм тоже. Важна свобода выбора в разумных границах, а не источник вкуса."},{"q":"Эксперт: где граница — шорты, пижама?","a":"Граница — опрятность, безопасность, ситуация. Чисто, без вызова, с клиентом по формату. Детали решает команда, а не личная неприязнь."}]},"protiv":{"criterion":"Одежда — первое слово встречи; судим по сигналу уважения людям и ситуации.","theses":[{"tezis":"Граница «встреча или нет» размыта: гость заходит в видеозвонок без предупреждения.","pochemu":"Переодеться за минуту нельзя; планка должна работать по умолчанию.","primer":"Zoom и Teams с 2020 года стали массовым способом видеозвонков."},{"tezis":"Без нормы стиль становится статусом: худи — привилегия руководителя, риск — новичка.","pochemu":"Правило молчит, значит угадываешь; ошибается тот, у кого меньше власти.","primer":"Худи дорогих брендов, например Balenciaga, стоят больше тысячи долларов: комфорт как знак достатка."},{"tezis":"Одежда меняет не только взгляд других, но и собственный настрой на работу.","pochemu":"Формальная одежда создаёт психологическую дистанцию — легче видеть задачу целиком.","primer":"Slepian и коллеги, 2015, пять экспериментов: формальная одежда усиливает абстрактное мышление."}],"killer":"Комфорт — твой. Уважение — чужое. Одежда сообщает второе.","image":"Одежда — первое слово, сказанное до того, как ты открыл рот.","attacks":["«Вред не доказан» — не довод: клиент уходит молча, убыток в отчёт не попадает.","Удалёнка — не офис: коллег рядом нет, пример про совместную работу не работает.","Goldman не отменил норму: «одевайся по клиенту» — это и есть наша планка."],"ask":["Вы пошли бы на суд или экзамен в худи и спортивных штанах?","Кто решает, где граница уместного, если нормы нет совсем?"],"expect":[{"q":"Кто решает, что неуважение? Это вкус.","a":"Решают задача и аудитория: клиент, суд, видеозвонок. Для остального норма гибкая; мы про опрятность и уместность."},{"q":"Продуктивность не зависит от одежды. Где доказательство вреда?","a":"Офиса без гостей почти нет: видеозвонок, кандидат, проверяющий. Границу не угадать, нужна общая планка «опрятно и уместно»."},{"q":"Дресс-код бьёт по тем, у кого нет денег на костюм.","a":"Планка простая: чистая опрятная одежда, не дорогие костюмы. Мы против небрежности, а не против бедности."}],"infokiller":[{"q":"Эксперт: худи Balenciaga дороже вашего костюма. Это деградация?","a":"Цена не равна небрежности. Критерий — уместность и опрятность перед людьми, с которыми вы работаете."},{"q":"Эксперт: студенты в худи делают сильные проекты. Что не нравится?","a":"Учёба и офис с гостями — разные ситуации. Мы говорим о второй, где одежда — часть сервиса."},{"q":"Эксперт: вы против индивидуальности человека?","a":"Нет: стиль, цвет, детали — пожалуйста. Против права на небрежность там, где за ней стоят коллеги и клиенты."}]},"arsenal":{"stats":[{"fact":"Работодатель обязан ознакомить работника с правилами внутреннего трудового распорядка под подпись до подписания трудового договора.","source":"ТК РФ, ст. 68, ч. 3","year":2001,"url":"https://legalacts.ru/kodeks/TK-RF/chast-iii/razdel-iii/glava-11/statja-68/","verified":true},{"fact":"Правила внутреннего трудового распорядка утверждает работодатель с учётом мнения представительного органа работников; это локальный акт, где решаются и «иные вопросы» трудовых отношений.","source":"ТК РФ, ст. 190 ч. 1; ст. 189 ч. 4","year":2001,"url":"https://www.zakonrf.info/tk/190/","verified":true}],"quote":{"text":"Достоинство личности охраняется государством. Ничто не может быть основанием для его умаления.","author":"Конституция РФ, ст. 21, ч. 1","url":"https://www.consultant.ru/document/cons_doc_LAW_28399/e7fbd40d5c89c3066eab2473bcaac30880b58eb3/","verified":true},"life":"Вспомни, когда в удобной одежде делал лучше, чем в парадной, или наоборот. Не выдумывай."},"traps":[{"problem":"Спор уйдёт во вкус: «это некрасиво».","exit":"Вернуть к критерию: влияние на работу, клиента и безопасность, а не на чей-то вкус."},{"problem":"Приведут профессии: банк, суд, приём клиентов.","exit":"Согласиться: формат по ситуации; спор о повседневном офисе без гостей."},{"problem":"Попросят доказать рост продуктивности цифрой.","exit":"Честно: цифр нет; бремя доказательства вреда лежит на том, кто ограничивает."}],"verdict":{"winner":"za","why":"За держит критерий «ограничение требует вреда», против вред не показал. Видеозвонок решает пиджак на стуле; опыт с одеждой — про мышление, а не уважение; даже Goldman Sachs отказался от строгого кода."}},"okr-22":{"core":"Общий счёт и прозрачность или раздельные деньги: кто держит власть над деньгами в паре?","za":{"criterion":"Судим по кризису: что выдержит болезнь, декрет, потерю работы и долги?","theses":[{"tezis":"Общий котёл считает невидимый вклад: быт и дети — тоже работа","pochemu":"При раздельных вклад идёт по зарплате: в декрете доход падает до 40%.","primer":"СК РФ, ст. 34, п. 3: кто вёл хозяйство и растил детей — тоже совладелец."},{"tezis":"Общий счёт даёт равный доступ: власть не у того, кто зарабатывает больше","pochemu":"У обоих карты и видимый остаток. Контроль — это закрытый доступ к деньгам.","primer":"СК РФ, ст. 31: вопросы жизни семьи супруги решают совместно, на равных."},{"tezis":"Общий счёт не только у счастливых пар — он сам держит отношения","pochemu":"Пары назначали на общий счёт случайно: за 2 года обычного спада у них не было.","primer":"Olson и др., Journal of Consumer Research, 2023: эксперимент с помолвленными и молодожёнами."}],"killer":"Раздельные деньги в кризис превращаются в раздельные проблемы.","image":"Один бортовой журнал на двоих: оба видят курс и топливо.","attacks":["Счёт одного с допкартой — не общий счёт, а власть владельца.","«Взносы по доле дохода»: значит, доходы видны обоим. Это ваша прозрачность.","«Без брака опасно»: опасно оформление на одного, а не общий бюджет."],"ask":["Кто платит ипотеку и ребёнка, если один потерял доход? ый начала ферма, а не пользователь."],"expect":[{"q":"Лента показывает по удержанию. Разве спрос — не продукт ленты?","a":"Удержание — не заказ. Заказ — промпт, репост, свои версии. Ферма копирует взлетевшее, а не создаёт его; платит ей площадка."},{"q":"Мемы были одноразовыми и раньше, но ИИ даёт масштаб. Разве не опасно?","a":"Масштаб предложения — не вред. Без репостов поток — шум в пустом зале. Вред ищите в жертве, а не в числе роликов."},{"q":"Ролики с Кингом тоже были мемами. Разве конвейер можно разделить?","a":"Разделяет жертва. Нет реального человека — нет потерпевшего. Есть — ст. 152.1 ГК и опт-аут площадки. Это правило, а не клеймо жанру."}],"infokiller":[{"q":"Есть данные о вреде именно абсурдных ИИ-мемов?","a":"Исследований не назову. ЗА показало подделки людей и оскорбительные тексты — их держат правила площадок и закон. В самом абсурде опасности нет."},{"q":"Мем-фермы зарабатывают на внимании детей. Это тоже спрос?","a":"Деньги платит площадка за просмотры, рычаг у неё: условия выплат, метки ИИ, возрастные фильтры. Жанр тут ни при чём."},{"q":"Обычному человеку без известности что делать с дипфейком?","a":"Ст. 152.1 ГК: по общему правилу изображение гражданина — только с согласия; плюс жалоба площадке. Дипфейк — не мем, у него есть потерпевший."}]},"arsenal":{"stats":[{"fact":"В первых 500 Shorts нового аккаунта 21% классифицировано как ИИ-слоп, 33% как брейнрот (тест одного аккаунта; доли пересекаются)","source":"Kapwing, AI Slop Report","year":2025,"url":"https://www.kapwing.com/blog/ai-slop-report-the-global-rise-of-low-quality-ai-videos/","verified":true},{"fact":"OpenAI приостановила генерации с образом Мартина Лютера Кинга по просьбе King, Inc.; обещан опт-аут для наследников","source":"Tom's Guide; eWeek (совместное заявление OpenAI и King, Inc.)","year":2025,"url":"https://www.tomsguide.com/ai/openai-pulls-mlk-out-of-sora-after-backlash-heres-what-this-means-for-ai-and-identity","verified":true}],"quote":{"text":"Я согласна насчёт моего отца.
