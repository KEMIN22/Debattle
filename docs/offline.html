<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>Твой Ход × Дебаттл — тренажёр</title>

<style>
:root{--o:#FF4F12;--bk:#0b0b0b;--pn:#1a1a1a;--pn2:#262626;--w:#fff;--gr:#8d8d8d;--ok:#3ddc84;
--f:"Montserrat","Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px}
body{margin:0;background:var(--bk);color:var(--w);font-family:var(--f);font-weight:600;line-height:1.35;padding-bottom:60px}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:10;background:var(--bk);border-bottom:3px solid var(--o);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{flex:1;min-width:0;font-weight:900;font-size:1rem;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;line-height:1.1}
.logo b{color:var(--o)}
.regsw{background:var(--pn2);color:#fff;border:2px solid var(--pn2);border-radius:10px;padding:5px 8px;font-weight:800;font-size:.68rem;line-height:1.15;cursor:pointer;min-height:44px;text-align:center;white-space:nowrap}
.regsw b{display:block;font-size:.8rem;font-weight:900;color:var(--gr)}
.regsw.on{border-color:var(--o)}.regsw.on b{color:var(--o)}
.pool{text-align:center;color:var(--gr);font-size:.85rem;margin:6px 0 10px}.pool b{color:#fff}
.btn{background:var(--o);color:#fff;border:0;border-radius:14px;padding:14px 18px;font-weight:900;font-size:1rem;cursor:pointer;min-height:52px}
.btn.alt{background:var(--pn2)}
.btn.ghost{background:transparent;border:2px solid var(--o);color:var(--o)}
.btn.sm{padding:8px 12px;min-height:40px;font-size:.85rem;border-radius:10px}
.btn:active{transform:scale(.97)}
.wrap{padding:12px 14px;max-width:760px;margin:0 auto}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;background:var(--pn);border:0;border-radius:12px;padding:13px 4px;font-weight:900;font-size:.82rem;cursor:pointer;text-transform:uppercase}
.tab.on{background:var(--o)}
.search{width:100%;background:var(--pn);border:2px solid var(--pn2);border-radius:12px;padding:13px 14px;font-size:1rem;margin-bottom:6px;outline:0}
.search:focus{border-color:var(--o)}
h2.cl{font-size:.8rem;color:var(--o);text-transform:uppercase;letter-spacing:.04em;margin:22px 0 8px;font-weight:900}
.topic{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--pn);border:0;border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.topic .n{font-weight:900;font-size:2.1rem;color:var(--o);min-width:2.3ch;text-align:center;line-height:1}
.topic .t{flex:1;font-size:.95rem}
.topic .t small{display:block;color:var(--gr);font-weight:600;font-size:.7rem;margin-top:2px}
.badge{font-size:.62rem;font-weight:900;padding:3px 7px;border-radius:8px;background:var(--pn2);color:var(--gr);white-space:nowrap}
.badge.ok{background:var(--ok);color:#000}
.back{background:none;border:0;color:var(--o);font-weight:900;font-size:1rem;padding:6px 0 10px;cursor:pointer}
.ttl{font-size:1.15rem;font-weight:800;margin:0 0 6px}
.ttl .n{color:var(--o);font-weight:900}
.partner{font-size:.72rem;color:var(--gr)}
.core{background:var(--pn);border-left:5px solid var(--o);border-radius:10px;padding:10px 12px;margin:10px 0}
.sw{display:flex;gap:8px;margin:12px 0}
.sw button{flex:1;border:0;border-radius:16px;padding:18px 6px;font-weight:900;font-size:1.3rem;background:var(--pn2);color:var(--gr);cursor:pointer;text-transform:uppercase}
.sw button.on{background:var(--o);color:#fff}
.sw.pole button{font-size:.8rem;padding:12px 8px;text-transform:none}
.crit{font-size:1.05rem;font-weight:800;padding:12px;border-radius:12px;background:#fff;color:#000;margin:8px 0}
.crit small{display:block;color:var(--o);font-size:.68rem;text-transform:uppercase;font-weight:900}
.kill{font-size:1.1rem;font-weight:900;color:var(--o);padding:8px 0}
.img{font-style:italic;color:#ddd;padding:2px 0 8px}
details{background:var(--pn);border-radius:14px;margin:8px 0;overflow:hidden}
summary{font-weight:900;font-size:1rem;padding:15px 14px;cursor:pointer;list-style:none;text-transform:uppercase;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--o)}
details[open] summary::after{content:"－"}
.in{padding:0 14px 14px}
.it{padding:10px 0;border-top:1px solid var(--pn2)}
.it:first-child{border-top:0}
.it b{font-weight:900}
.it .w{color:#cfcfcf;font-size:.9rem;margin-top:3px}
.it .ex{color:var(--gr);font-size:.85rem;margin-top:3px}
.lb{font-size:.68rem;color:var(--o);text-transform:uppercase;font-weight:900;margin:12px 0 2px}
.unv{color:var(--gr)}
.tag{font-size:.6rem;background:var(--pn2);color:var(--gr);padding:2px 6px;border-radius:6px;margin-left:6px;text-transform:uppercase;font-weight:900}
a{color:var(--o)}
.note{background:var(--pn2);border-radius:10px;padding:10px 12px;font-size:.85rem;color:#ddd;margin:8px 0}
.verdict{background:var(--o);color:#fff;border-radius:14px;padding:12px;margin:12px 0;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.row .btn{flex:1}
/* жребий и таймер */
.draw{background:var(--pn);border-radius:18px;padding:14px;margin:10px 0}
.draw .big{font-size:1.25rem;font-weight:900}
.side{display:inline-block;font-size:1.8rem;font-weight:900;background:var(--o);padding:6px 18px;border-radius:12px;margin:8px 0}
.chk{display:flex;align-items:center;gap:10px;font-weight:800;margin:10px 0;cursor:pointer}
.chk input{width:26px;height:26px;accent-color:var(--o)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.modes button{background:var(--pn2);border:0;border-radius:12px;padding:12px 4px;font-weight:900;cursor:pointer;font-size:.85rem}
.modes button.on{background:var(--o)}
.clock{font-size:5.4rem;font-weight:900;text-align:center;line-height:1;margin:14px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock.warn{color:var(--o)}
.clock.end{color:#fff;background:var(--o);border-radius:16px;padding:8px 0}
.phase{text-align:center;text-transform:uppercase;font-size:.95rem;color:var(--gr);font-weight:900}
.empty{color:var(--gr);padding:30px 0;text-align:center}
#print-root{display:none}
@media print{
 @page{size:A4;margin:8mm}
 body>*:not(#print-root){display:none!important}
 body{background:#fff;color:#000;padding:0}
 #print-root{display:block;font-family:Arial,sans-serif}
 .pc{height:136mm;border:1.5px solid #000;padding:4mm;margin-bottom:5mm;page-break-inside:avoid;overflow:hidden;font-size:8.6pt;line-height:1.25}
 .pc:nth-child(2n){page-break-after:always;margin-bottom:0}
 .pc h3{margin:0 0 2mm;font-size:11pt}
 .pc h3 span{background:#000;color:#fff;padding:0 3mm;margin-right:2mm}
 .pc .cols{display:flex;gap:4mm}
 .pc .col{flex:1;border-top:2px solid #000;padding-top:1mm}
 .pc .col h4{margin:0 0 1mm;font-size:10pt}
 .pc ul{margin:0 0 1mm;padding-left:4mm}
 .pc .k{font-weight:bold}
}
</style>
</head>

</header>

.3: продажа билета на мероприятие организации исполнительских искусств или музея дороже номинала — штраф гражданину от 1,5 до 2 цен билета; исключение — разовая продажа личного билета не дороже номинала","source":"КоАП РФ, ст. 14.4.3 (введена ФЗ от 27.12.2019 № 493-ФЗ; ред. от 04.08.2026)","year":2026,"url":"https://www.consultant.ru/document/cons_doc_LAW_34661/1c8e7943d9564838919f0437a6fd46520a4b0aa9/","verified":true}],"quote":{"text":"Нет решений, есть только компромиссы.","author":"Томас Соуэлл","verified":true,"url":"https://www.aei.org/carpe-diem/video-thomas-sowells-most-profound-economic-insight-and-his-three-questions-for-the-left/"},"life":"Вспомни, как ты или друзья покупали билет с рук или в чате: как проверяли подлинность, сколько переплатили?"},"traps":[{"problem":"Тезис «запрет рождает чёрный рынок» опровергается: фейки есть и сейчас.","exit":"Не настаивать. Сказать: фейки там, где нет проверяемой биржи; нужна проверка, а не запрет."},{"problem":"Слово «жёстко»: сажать студента за один билет?","exit":"Жёстко — для ботов, массовых перекупщиков и подделок; разовая перепродажа по номиналу законна."},{"problem":"Просят российскую статистику мошенничества, цифр у нас нет.","exit":"Цифр не называть. Опереться на механизм: QR не проверить, деньги вперёд, возврата нет."}],"verdict":{"winner":"za","why":"Наценка запрещена законом 2019 года, а перепродажа в 2023 выросла на 7–60% по оценкам рынка — жёсткость не сработала. Обман и так карается ст. 159. Против выиграет, если докажет, что проверка на входе исполнима."}},"okr-02":{"core":"Спор о том, за что отвечает родитель: за поступок ребёнка или за свою реакцию.","za":{"criterion":"Отвечает не за поступок ребёнка, а за проигнорированный сигнал и своё бездействие.","theses":[{"tezis":"Поступок ребёнка — повод проверить, что родитель делал после сигнала.","pochemu":"Справедливо винить за знание или проигнорированный сигнал, а не за сам поступок.","primer":"120-ФЗ: школа и КДН работают с семьёй. Игнор сигнала — довод по ст. 5.35 КоАП."},{"tezis":"Закон уже так работает: суд проверяет воспитание и надзор, а не родство.","pochemu":"Верховный суд: родитель отвечает при безответственном воспитании и отсутствии должного надзора.","primer":"Пленум ВС № 1 от 26.01.2010, п. 16: вина — попустительство и отсутствие надзора."},{"tezis":"Потерпевшему нужен тот, кто реально возместит вред.","pochemu":"У подростка нет дохода; без родителя вред остаётся невозмещённым. Вина — отдельный вопрос.","primer":"Ст. 1074 ГК: при нехватке средств подростка 14–18 родители доплачивают, если не докажут невиновность."}],"killer":"Поступок ребёнка — повод спросить: что родитель делал?","image":"Автошкола: ученик за рулём, но педаль тормоза — у инструктора.","attacks":["Возмещение по ГК — компенсация потерпевшему, не наказание. Невиновность доказать можно.","Статья 150 УК наказывает вербовщика, но вред потерпевшему он не возместит.","Вербовщик — вина вербовщика. Родитель должен отвечать лишь за игнор полученного сигнала."],"ask":["Кто возместит вред потерпевшему, если у подростка нет ни работы, ни имущества?","Чем обязанность воспитывать отличается от пожелания, если за неё не отвечать?"],"expect":[{"q":"Родитель сделал всё возможное, подросток обманул. Тоже виноват?","a":"Нет. Наказывать надо за проигнорированный сигнал, не за результат. Разумные меры родитель вправе доказать."},{"q":"Подростку 17, он почти взрослый. Почему платит мама?","a":"С 14 лет отвечает сам подросток. Родитель доплачивает при нехватке средств: это возмещение, не наказание, невиновность доказать можно."},{"q":"Родитель на двух работах и не читает переписку. Тоже виноват?","a":"Переписку читать не нужно. Хватает ответить на сигнал школы или КДН. Помощь занятым семьям — отдельная задача государства."}],"infokiller":[{"q":"Подростков вербуют профессионалы. Родитель с ними тягаться не может, разве нет?","a":"Победа над вербовщиком не нужна. Нужна реакция на сигнал школы или КДН: игнор — вина, ошибка — нет."},{"q":"Есть данные, что наказ т на эмоциях.","exit":"ЗА: верни рамку — наказывать надо за игнор сигнала, не за поступок. ПРОТИВ: вину должно доказывать государство."},{"problem":"Путают штраф, возмещение вреда и уголовное дело.","exit":"Назови два вида: штраф по КоАП и возмещение по ГК. Уголовная ответственность — у самого подростка."},{"problem":"Спор уходит в слежку за перепиской: «читать или не читать».","exit":"Закон переписку читать не требует. Спор о реакции на сигнал и о бремени доказывания."}],"verdict":{"winner":"za","why":"Стороны сошлись: за халатность наказывать можно, за автоматическую вину нельзя. У «За» остались закон, возмещение вреда и реакция на сигнал; «Против» остался спор о бремени доказывания."}},"okr-03":{"core":"Что первично: здоровье миллионов или вершина, на которую смотрят все.","za":{"criterion":"Судим по главному: сколько россиян получает пользу от бюджетного рубля.","theses":[{"tezis":"Массовый спорт — профилактика: заниматься заранее дешевле, чем лечиться потом.","pochemu":"Недостаток движения — один из ведущих факторов риска хронических болезней, говорит ВОЗ.","primer":"Рекомендации ВОЗ для взрослых: регулярная активность как профилактика хронических болезней."},{"tezis":"Указ № 309 связал спорт со здоровьем: цель — меньше больничных.","pochemu":"Задачу меряют здоровьем работающих, значит деньги должны идти к массовым занятиям.","primer":"Указ № 309 (2024): снизить нетрудоспособность к 2030 через систематические занятия спортом."},{"tezis":"Кумира смотрят по телевизору, а в секцию ходят рядом.","pochemu":"Ребёнка удерживают тренер, друзья и близкая цена, а не чужая медаль.","primer":"Лондон-2012 обещал наследие; комитет лордов (2013): мало свидетельств роста занятий спортом."}],"killer":"Кумира смотрят дома, а в секцию ходят рядом.","image":"Пирамида: чемпион — вершина, но без широкого основания она рассыпается.","attacks":["«Чемпионы создают спрос» — один анекдот без источника; ребёнка в секцию ведёт тренер.","Тренер сборной работает с единицами; детскому тренеру нужна ставка, а не чужая медаль.","Две цели госпрограммы не равны: 70% занимающихся — это миллионы, медали — единицы."],"ask":["Назовите показатель, по которому вершина окупила себя для здоровья нации.","Кто приведёт ребёнка в секцию, если рядом нет тренера и зала?"],"expect":[{"q":"Без героя и тренера двор пустой. Кто вдохновит детей?","a":"Двор оживляет тренер, а не кумир. Тренерские ставки и секции — статья массового бюджета, её ставим первой."},{"q":"Приоритет значит, сборные останутся без денег?","a":"Нет. Сборные получают деньги, но не в ущерб площадкам. Приоритет — это очередь финансирования, а не отмена."},{"q":"Массовый спорт уже финансируется. Где результат?","a":"Результат там, где построили площадку. Узкое место — малые города и сёла, туда и направляем деньги."}],"infokiller":[{"q":"Как измерить окупаемость массового спорта?","a":"Больничные — цель Указа № 309, долю занимающихся считает госпрограмма. ВОЗ: бездействие обойдётся миру около $300 млрд за 2020–2030."},{"q":"Национальные амбиции — часть суверенитета. Вы от них отказываетесь?","a":"Нет. Сильнейшая амбиция — здоровая нация. Из широкой базы вырастут и чемпионы, и тренеры."},{"q":"Лидеры по медалям вкладываются в элиту. Почему нам нельзя?","a":"Мы элиту не отменяем, а ставим базу первой в очереди. Критерий — польза на рубль."}]},"protiv":{"criterion":"Судим по результату: что втягивает людей в спорт — пример или субсидия.","theses":[{"tezis":"Ребёнка в секции держат цель и путь к сборной.","pochemu":"Без вершины нет цели: ребёнок идёт по разрядам к мастеру спорта.","primer":"Разрядная лестница: от юношеского разряда до мастера спорта России."},{"tezis":"Элитное финансирование кормит тренеров, которые ведут и детей.","pochemu":"Тренер сборной и тренер спортшколы — одна система кадров и методик.","primer":"Спортшколы (СШ, СШОР) готовят спортивный резерв для сборных России."},{"tezis":"Государство само держит обе цели: массовость и медали.","pochemu":"Приоритет одной цели ломает госпрограмму, где целей две.","primer":"Госпрограмма спорта: 70% занимающихся и тройка лидеров Олимпиады к 2030 году."}],"killer":"Без вершины у ребёнка нет цели, у тренера нет школы.","image":"Снежная вершина тает и поит реку, на которой живёт долина.","attacks":["Указ № 309 говорит про больничные, но медали не запрещает: госпрограмма держит обе цели.","Талант находят в отборе и спортшколе, не в отремонтированном сельском зале.","Рекомендации ВОЗ выполнимы без бюджета: бег и зарядка бесплатны, нужен пример."],"ask":["Назовите массовую программу, поднявшую занятия без цели и примера.","Двор построили, тренера нет: кто учит детей и откуда тренеры?"],"expect":[{"q":"Чемпионы — единицы, здоровье нужно всем. Зачем тратить на единицы?","a":"Единицы дают цель и кадры для всех. Вершина не отменяет двор, она обучает основание."},{"q":"Деньги на элиту уходят в медали, а детям негде заниматься.","a":"Площадки в основном строят регионы и муниципалитеты, федеральный бюджет софинансирует. Деньги на элиту двор не обнуляют."},{"q":"Допинг, скандалы, отстранения: разве элита не вредит имиджу?","a":"Скандал — довод за контроль, не за отказ. Распустить систему из-за паузы — потерять поколение."}],"infokiller":[{"q":"Здоровье нации — это дворы и зарядка, а не олимпийцы.","a":"Двор нужен, спорим о приоритете. Олимпийцы дают цель и тренеров, без которых двор пустеет."},{"q":"Не лучше ли вложить в поликлиники, а не в арены?","a":"Поликлиника лечит последствия. Цель и путь по разрядам удерживают детей в секции заранее."},{"q":"Страны с медалями и ожирением. Значит, медали не лечат?","a":"Медали не лечат, лечит доступная секция с тренером. Тренеров растит система, которую питает вершина."}]},"arsenal":{"stats":[{"fact":"ВОЗ рекомендует взрослым 150 минут умеренной активности в неделю, чтобы снизить риск неинфекционных болезней.","source":"ВОЗ, Physical activity fact sheet","year":2024,"url":"https://www.who.int/news-room/fact-sheets/detail/physical-activity","verified":true},{"fact":"Госпрограмма «Развитие физической культуры и спорта»: 70% граждан систематически занимаются спортом и олимпийская сборная в тройке лидеров к 2030 году.","source":"Паспорт госпрограммы РФ «Развитие физической культуры и спорта», утв. решением Правительства РФ от 23.12.2021 № ММ-44-19192","year":2021,"url":"https://legalacts.ru/doc/pasport-gosudarstvennoi-programmy-kompleksnoi-programmy-rossiiskoi-federatsii-razvitie-fizicheskoi/","verified":true}],"quote":{"text":"…поощряется деятельность, способствующая укреплению здоровья человека, развитию физической культуры и спорта…","author":"Конституция РФ, ст. 41, ч. 2","verified":true,"url":"https://www.consultant.ru/document/cons_doc_LAW_28399/8c815f376c72a61b3df7905bb5aae9f144d2cb0d/"},"life":"Вспомни свою школьную секцию: кто ходил, кто бросил из-за цены или расстояния, и кто тебя привёл."},"traps":[{"problem":"Соперник: «вы против Олимпиады и сборных».","exit":"Не отменяем, а ставим очередь: сначала база, сборные не в ущерб ей."},{"problem":"Спор уходит в санкции и отстранение сборных.","exit":"Одна фраза как риск вложений, затем назад к критерию: польза на рубль."},{"problem":"Соперник просит цифры по окупаемости массового спорта.","exit":"Назови показатели: доля занимающихся, больничные. Признай, что ГТО — инструмент, результат ещё измеряют."}],"verdict":{"winner":"za","why":"За: польза на рубль, здоровье — цель Указа № 309. Что кумиры приводят детей, не доказано. Против силён кадрами и двойной целью госпрограммы, но окупаемость вершины не доказал."}},"okr-04":{"core":"Кто лучше решает, что стоит денег: зал или профессиональное сообщество.","za":{"criterion":"Культура существует для зрителя: судим по тому, кто приходит и возвращается.","theses":[{"tezis":"Деньги идут тому, кто собирает зал, а не тому, кого отобрали.","pochemu":"Спрос открыт: билеты, возвраты и повторные визиты проверит любой журналист.","primer":"Фонд кино часть денег даёт возвратно, и спрос возвращает долг."},{"tezis":"Даже эксперты Фонда кино оценивают зрительский потенциал проекта.","pochemu":"Спрос и так стоит в критериях, значит, его честнее мерить напрямую.","primer":"Порядок Фонда кино: экспертный совет смотрит качество и зрительский потенциал."},{"tezis":"Классику создавали на читательские деньги, а не на экспертные гранты.","pochemu":"Читатель принимает смелое, если оно доступно; спрос платит и за новое.","primer":"Достоевский писал «Преступление и наказание» для «Русского вестника» (1866) на авансы и гонорары Каткова."}],"killer":"Культура без зрителя — это склад, а не культура.","image":"Касса как урна для голосования: проголосовал билетом — деньги пошли за тобой.","attacks":["Эксперты Фонда кино оценивают заявку по вчерашним образцам; Достоевского читатель принял сам.","Право на доступ — про бесплатные библиотеки, а не про то, кто выбирает проекты.","Реставрация и архивы идут по госзаданию; тема про финансирование проектов, а не наследия."],"ask":["Назовите проект, который спасли эксперты и который потом оказался нужен зрителю.","Кто проверяет экспертов, если грант выдан, а зал пустой?"],"expect":[{"q":"Спрос — это попса и сериалы. Новое без аудитории погибнет?","a":"Новое показывают на малых сценах и фестивалях, зритель отвечает билетом. Спрос проверяет новизну дешёвым пилотом."},{"q":"Кассу можно накрутить. Как измерять честно?","a":"Продажи, возвраты и повторные визиты. Сборы публикуются, а протокол эксперта не доказывает, что он угадал зал."},{"q":"Кто защитит молодых авторов, у которых нет аудитории?","a":"Дешёвые пилоты и малые сцены. Эксперт проверяет смету и исполнение, а не художественную ценность."}],"infokiller":[{"q":"Музеи никогда не окупаются. Закрываем?","a":"Нет. Хранение наследия — госзадание, не конкурс. Спор о проектах: их деньги идут за зрителем."},{"q":"Рубль голосует за рекламу, а не за качество.","a":"Реклама приводит один раз. Повторные визиты и возвраты билетов отделяют раскрученное от любимого."},{"q":"Кто решает, чей пилот попадёт на фестиваль?","a":"Куратор даёт сцену на вечер, а не бюджет на годы. Дальше деньги идут за билетами."}]},"protiv":{"criterion":"Судим по тому, что останется через двадцать лет, а не по сегодняшней кассе.","theses":[{"tezis":"Спрос измеряет вчерашний вкус: у нового зрителя ещё нет.","pochemu":"Аудитория появляется после произведения, а деньги нужны до него.","primer":"Экспертный совет Фонда кино оценивает заявки до съёмок, ещё без сборов."},{"tezis":"Зал выбирает из того, что кто-то вчера отобрал и сохранил.","pochemu":"Репертуар и коллекции — итог профессионального отбора; без хранителей выбирать нечего.","primer":"Мариинка и Большой: репертуар формирует руководство театров, зал выбирает из него."},{"tezis":"Доступ к культуре — право каждого, а не покупательная способность.","pochemu":"При оплате по спросу малые города и бедные голосуют меньшим рублём.","primer":"Конституция РФ, ст. 44 ч. 2: каждый имеет право на доступ к культурным ценностям."}],"killer":"Спрос выбирает из меню. Меню должен кто-то составить.","image":"Спрос — зеркало: показывает нас сегодняшних. Эксперт — окно в завтра.","attacks":["Вы сами признали: зрительский потенциал оценивают эксперты. Значит, спрос без них не прочитать.","Достоевскому аванс дал редактор Катков до читателя: первым выбрал профессионал.","Пушкинская карта работает по списку экспертного совета: это отбор, а не рынок."],"ask":["Кто платит за реставрацию и архивы, если оценка — только билеты?","Если хит окупается сам, зачем ему бюджетные деньги?"],"expect":[{"q":"Эксперты ошибались и отвергали новаторов. Почему им доверять деньги?","a":"Ошибаются все; состав меняют, критерии публичны. Спрос ошибается молча: непроданное исчезает навсегда."},{"q":"Эксперты сами оценивают зрительский потенциал. Зачем посредник между залом и деньгами?","a":"Потенциал — лишь один критерий. Эксперт ещё оценивает качество и новизну, которых касса пока не видит."},{"q":"Налогоплательщик платит, а ему не нравится. Почему не слушаете?","a":"Слушаем: зритель выбирает из отобранного и голосует билетом. Первичный отбор делают профессионалы, как в науке и медицине."}],"infokiller":[{"q":"Рынку доверяют всё остальное. Почему культуре нельзя?","a":"Бизнес продаёт понятное. Культура создаёт то, чего ещё нет, поэтому критерий — качество и долгий срок."},{"q":"Как вы узнаете сегодня, что эксперт угадал?","a":"Нужны открытые протоколы и отчёт по итогам: кто часто промахивается, выходит из совета. Плюс зрительский второй этап."},{"q":"Вы ставите свой вкус выше вкуса народа?","a":"Нет, мы ставим выше срок. Народ оценит завтра то, что эксперт отметил сегодня."}]},"arsenal":{"stats":[{"fact":"Проекты в Фонде кино проходят экспертный совет, оценивающий качество и зрительский потенциал; часть средств даётся на возвратной основе.","source":"Фонд кино, порядок отбора проектов","year":2025,"url":"https://fond-kino.ru/documents/download/2510/","verified":true},{"fact":"В 2025 г. на федпроект «Семейные ценности и инфраструктура культуры» нацпроекта «Семья» выделено 26,8 млрд руб.; переоснащены 272 библиотеки.","source":"Объясняем.рф (Т. Голикова, итоговая коллегия Минкультуры)","year":2025,"url":"https://xn--90aivcdt6dxbc.xn--p1ai/articles/news/bolee-270-bibliotek-i-pochti-140-muzeev-modernizirovali-v-2025-godu-po-natsproektu-semya/","verified":true}],"quote":{"text":"Каждый имеет право на участие в культурной жизни и пользование учреждениями культуры, на доступ к культурным ценностям.","author":"Конституция РФ, ст. 44, ч. 2","verified":true,"url":"https://ru.wikisource.org/wiki/Конституция_Российской_Федерации"},"life":"Вспомни книгу или фильм, который сначала не зашёл, а потом стал любимым, и последний, на который пошёл сам."},"traps":[{"problem":"Соперник называет экспертов кликой, раздающей гранты своим.","exit":"Признай риск и назови защиту: открытые критерии, ротация, конфликт интересов, зрительский второй этап."},{"problem":"Нас назовут элитаристами, оторванными от народа.","exit":"Народ — получатель и голосует билетом; первичный отбор новизны делают профессионалы, как в науке."},{"problem":"Просят российский пример, где эксперты угадали, а зал нет.","exit":"Говори про механизм: хит окупается сам, архивы и риск рынок не оплатит. Цифр не называй."}],"verdict":{"winner":"protiv","why":"Против побеждает узко: без отбора зрителю не из чего выбирать, а рынок не оплатит архивы и риск. За сильнее в прозрачности, но сам оставил экспертам пул для редкого."}},"okr-05":{"core":"Спор о приоритете: библиотека остаётся хранителем фонда или становится центром досуга.","za":{"criterion":"Миссия — доступ людей к знанию; судим по тому, дошёл ли человек до книги.","theses":[{"tezis":"Востребованность — условие, при котором миссия вообще выполняется.","pochemu":"Учреждение без посетителей первым попадает под оптимизацию; без читателей миссия не исполняется.","primer":"Библионочь-2026: лекции и экскурсии в 18 тыс. учреждений культуры собрали 1,5 млн человек."},{"tezis":"Мировой опыт: центр и библиотека в одном здании уже работают.","pochemu":"Книги остаются ядром, сервисы приводят людей; нужны отдельные фонд и штат.","primer":"Dokk1 в Орхусе: библиотека, сервисы для горожан и события в одном здании."},{"tezis":"Модельные библиотеки нацпроекта «Культура»: новое пространство и свежий фонд привели людей.","pochemu":"Это российский районный опыт, а не датский флагман; фонд растёт вместе с посещениями.","primer":"Фонды модельных библиотек пополнены почти на 3 млн документов; посещения +28% за 2022 год."}],"killer":"Библиотека без читателей — склад, а не хранитель знаний.","image":"Библиотека — общая гостиная города: книги на полках, двери открыты.","attacks":["Ст. 13 говорит о хозяйственной деятельности, а не о лекциях; просвещение — сама миссия.","Президентская библиотека называет себя многофункциональным центром — и остаётся национальной библиотекой.","Ст. 13 прямо даёт библиотекам право на культурную, просветительскую и образовательную деятельность."],"ask":["Назовите библиотеку, которая сохранила миссию, потеряв всех читателей.","Если фонд цел и выдачи растут, в чём именно утрачена миссия?"],"expect":[{"q":"Розетка и Wi-Fi: книга остаётся на полке?","a":"Розетка приводит к порогу; миссию закрепляем метрикой выдач и читательских билетов. Чиним отчётность, идею не отменяем."},{"q":"Проще открыть кафе: гостей больше, миссии нет?","a":"Кафе не хранит фонд и не даёт бесплатный доступ к знанию. Центр при библиотеке сохраняет оба."},{"q":"Dokk1 держится на бюджете и штате. У нас так будет?","a":"Верно: бюджет, штат и фонд — условия, мы их требуем. Без них это ремонт, а не реформа."}],"infokiller":[{"q":"Эксперт: чтение падает, а вы тратите силы на кружки?","a":"Модельные библиотеки обновили фонд, и в 2022 году посещения выросли на 28%. Кружок ведёт к книге, а не вместо неё."},{"q":"Эксперт: центры заменят книги экранами?","a":"Нет. Электронный доступ, например НЭБ, дополняет бумагу и открывает редкие издания даже в маленьком городе."},{"q":"Эксперт: где грань, после которой это уже не библиотека?","a":"Грань — фонд и библиотекарь в центре. Пока услуги ведут к книге и знанию, миссия жива."}]},"protiv":{"criterion":"Тема говорит «основная» миссия: судим по приоритету — фонд и чтение первыми.","theses":[{"tezis":"Закон ставит основную деятельность выше побочной: приоритет за фондом.","pochemu":"Дополнительное разрешено, только если не вредит основному; это и есть иерархия.","primer":"Ст. 13 ФЗ-78: хоздеятельность — «при условии, что это не наносит ущерба их основной деятельности»."},{"tezis":"Закон допускает лекции, но ядро — организованный фонд и доступ к нему.","pochemu":"Без фонда остаётся лекторий: такой есть и в ДК, и в школе.","primer":"ФЗ №78: библиотека определена через организованный фонд документов, а не через лекции."},{"tezis":"Работа библиотекаря с фондом — профессия, которую аниматор не заменит.","pochemu":"Подбор, каталогизация, оцифровка требуют времени; ставка не резиновая.","primer":"НЭБ по закону (ст. 18.1) — госсистема оцифрованных фондов, а не площадка кружков."}],"killer":"Центров много, библиотека одна. Зачем делать из неё очередной центр?","image":"Читальный зал отдали коворкингу: полка осталась, как декорация.","attacks":["Цепочка «лекция, полки, книга» без данных: где рост выдач, а не визитов?","Модельный стандарт — интернет и обновлённый фонд: посещения выросли за счёт ядра библиотеки.","Dokk1 — флагман крупного города; районная библиотека такого бюджета и штата не получит."],"ask":["Что получит читатель, если читальный зал отдан под коворкинг?","Кто сохранит краеведческий фонд, если библиотека станет центром встреч?"],"expect":[{"q":"Молодёжь не читает. Что, закрывать?","a":"Клубы чтения и лекции — хорошо, если фонд и тихий зал закреплены приоритетом. Спор о приоритете, не о запрете."},{"q":"В селе библиотека — единственный общий центр. Ей отказаться?","a":"Там совмещение вынужденное, фонд и библиотекарь сохраняются; ещё выручают библиобусы. Исключение не делаем правилом для всех."},{"q":"Шум убьёт чтение? Зонирование же решает.","a":"Зонирование — это метры и ремонт; в тесной районной библиотеке тихий зал уступает первым. Тихая зона должна быть обязательной."}],"infokiller":[{"q":"Эксперт: миссия — выдумка консерваторов?","a":"Миссия записана в законе: информационная, культурная, просветительская организация с организованным фондом. Это рамка, не вкус."},{"q":"Эксперт: в Орхусе Dokk1 — и центр, и библиотека. Почему там можно?","a":"Dokk1 — флагман с особым бюджетом. Наши модельные библиотеки выросли на свежем фонде и интернете — на ядре библиотеки."},{"q":"Эксперт: книги умирают. Зачем защищать бумагу?","a":"Защищаем не бумагу, а чтение, память и доступ к знанию; фонд может быть цифровым."}]},"arsenal":{"stats":[{"fact":"Закон о библиотечном деле определяет библиотеку как информационную, культурную, просветительскую организацию с организованным фондом документов.","source":"ФЗ №78-ФЗ «О библиотечном деле», ст. 1 (действующая редакция)","year":1994,"url":"https://base.garant.ru/103585/1cafb24d049dcd1e7707a22d98e9858f/","verified":true},{"fact":"Президентская библиотека открыта 27 мая  сон, стресс, питание не измерить без слежки и произвола."},{"q":"Запрет разорит рынок добровольного страхования?","a":"Нет, страховщики конкурируют сервисом, клиникой и скоростью выплат. Убирается только цена по анкете, а не сам рынок."}]},"protiv":{"criterion":"Справедлив тариф, где платят за выбранный и проверяемый риск: курение.","theses":[{"tezis":"Единая цена запускает спираль: осторожные уходят, цена растёт для всех.","pochemu":"Здоровые видят переплату и отказываются от полиса; в пуле остаются больные.","primer":"Эксперт РА: личный ДМС часто берут, чтобы «отбить» полис; цена растёт для всех."},{"tezis":"Курение — управляемый риск, а не неизменный признак: закон их уже разделяет.","pochemu":"Дискриминация — различие по неизменному: пол, возраст, происхождение. Привычку можно изменить.","primer":"Закон 2013 года запретил курить в общественных местах: курящих и некурящих закон различает."},{"tezis":"Запрет отнимает у здоровых скидку и стимул беречь себя.","pochemu":"Единая цена не видит усилий: бегаешь или куришь — платишь одинаково.","primer":"John Hancock (страхование жизни): скидка до 15% за нормы по трекеру; полис и без трекера."}],"killer":"Платить за чужие сигареты — не солидарность, а принуждение.","image":"Счёт в кафе поровну: кто пил воду, оплачивает чужое вино.","attacks":["Курение не диктует график курьера, а диспансеризация бесплатна: навязанность не про табак.","Ваш пример ACA сам сохранил надбавку курящим: закон различает выбранное и невыбранное.","Полис John Hancock выдают без трекера: добровольность реальна, скидка — бонус."],"ask":["Почему управляемый риск должен стоить столько же, сколько неуправляемый?","Почему здоровый клиент должен доплачивать за чужие сигареты?"],"expect":[{"q":"А если человек болен без своей вины: генетика, вредная работа?","a":"Генетику и болезни не учитываем. Учитываем только факт курения по анализу, а не диагноз. Остальное остаётся в общем пуле."},{"q":"Кто проверит образ жизни? Это слежка за людьми.","a":"Один анализ на никотин при оформлении, как медосмотр. Анкет, трекеров и слежки нет; футбол, смены и сон не трогаем."},{"q":"Страховщик станет отказывать неудобным клиентам. Что тогда?","a":"Базовую помощь бесплатно гарантирует ОМС по всей России. Правила учёта рисков контролирует регулятор, Банк России."}],"infokiller":[{"q":"Ожирение и стресс связаны с бедностью. Вы наказываете бедных?","a":"Мы их не учитываем: только курение по анализу. Диспансеризация бесплатна, бросить курить дешевле, чем болеть."},{"q":"Назовите страну, где такая модель работает без роста неравенства.","a":"США: ACA запретил цену по диагнозу, оставил надбавку курящим. Минус есть: курящие реже страхуются, поэтому надбавку держим умеренной."},{"q":"Больным курильщикам полис станет недоступен. Вас это устраивает?","a":"Лечение им даёт ОМС. Частный полис дороже, но не закрыт, и цену снижает отказ от курения."}]},"arsenal":{"stats":[{"fact":"Закон США 2010 года (в силе с 2014) запретил отказ из-за прежних болезней; надбавка курящим на рынке ACA — до 50%.","source":"Affordable Care Act; healthcare.gov, KFF","year":2010,"url":"https://www.healthcare.gov/coverage/pre-existing-conditions/","verified":true},{"fact":"По закону об ОМС застрахованные вправе на бесплатную помощь по базовой программе; она едина для всей России.","source":"ФЗ № 326-ФЗ «Об обязательном медицинском страховании в РФ», ст. 16","year":2010,"url":"https://base.garant.ru/12180688/7a58987b486424ad79b62aa427dab1df/","verified":true}],"quote":{"text":"Каждый имеет право на охрану здоровья и медицинскую помощь.","author":"Конституция РФ, ст. 41, ч. 1","verified":true,"url":"https://www.consultant.ru/document/cons_doc_LAW_28399/8c815f376c72a61b3df7905bb5aae9f144d2cb0d/"},"life":"Вспомните, как расписание, подработка и деньги влияли на ваш сон, еду и нагрузку. Не выдумывайте историю."},"traps":[{"problem":"Спор сводят к курильщикам: «платить за чужие привычки несправедливо».","exit":"Не защищаем привычку, защищаем функцию страховки; табак бьём акцизом, а не отказом в защите."},{"problem":"Размыта граница «образ жизни» и «состояние здоровья».","exit":"Определить сразу: образ жизни равно анкеты, трекеры, привычки; диагноз и возраст отдельно."},{"problem":"Узкий критерий «только курение» звучит разумно (для «за» опасно).","exit":"Показать расползание: тест на табак сегодня, вес и сон завтра; запрет работает как предохранитель."}],"verdict":{"winner":"protiv","why":"Против сузил спор до курения по анализу: выбрано, измеримо, без слежки. За привёл данные Yale, но не доказал, что граница расползётся дальше табака."}},"okr-07":{"core":"Читать переписку подростка при угрозе: защита жизни или нарушение границ без проверяющего?","za":{"criterion":"Судите по цене ошибки: лишний раз прочитать или опоздать с защитой?","theses":[{"tezis":"Признаки видны снаружи, а куратора и задание показывает только чат","pochemu":"Деньги от незнакомых — повод. Полиции нужны факты: кто куратор, что поручено — они в чате.","primer":"Белгород, 2025: подростки за деньги подожгли релейный шкаф по заданию из мессенджера."},{"tezis":"Конвенция сама допускает вмешательство, если оно не произвольное","pochemu":"Ст. 16 запрещает произвольное или незаконное; чтение при угрозе жизни по правилам — не произвол.","primer":"Ст. 3 п. 2: защита ребёнка «принимая во внимание права и обязанности его родителей»."},{"tezis":"«Независимо от обстоятельств» ставит приватность выше жизни","pochemu":"Абсолют не отличает ссору с другом от вербовки. Исключение с условиями честнее.","primer":"Лестница: разговор, чтение вместе, тайное чтение лишь при угрозе жизни; злоупотребление оспаривает опека."}],"killer":"Приватность важна, но мёртвому подростку она не нужна.","image":"Страховочный трос альпиниста: пока не сорвался, не мешает; при срыве спасает.","attacks":["Вы сами берёте телефон при угрозе суицида: «независимо от обстоятельств» рухнуло.","Доверие не спасает: под куратором подросток молчит именно с родителем.","Следствие читает после беды. Как узнать об угрозе до неё?"],"ask":["Как увидеть вербовку до беды, если переписку не читать?","Кто, кроме родителя, увидит угрозу в личке вашего подростка?"],"expect":[{"q":"Кто определяет «подозрение»? Любой родитель придумает повод для слежки.","a":"Признаки внешние: деньги от незнакомых, самоповреждение, слова о суициде, резкая смена круга. Злоупотребление оспаривают: опека, суд, лишение прав."},{"q":"Конституция защищает тайну переписки. Почему родителю можно?","a":"Ст. 23 о родителях молчит. СК поручает защиту ребёнка родителю (ст. 64), а при прямой угрозе жизни действует ст. 39 УК."},{"q":"Конвенция запрещает произвольное вмешательство. Разве это не оно?","a":"Конвенция запрещает лишь произвольное или незаконное вмешательство. Ст. 39 УК: при прямой угрозе жизни, если иначе не спасти, это не преступление."}],"infokiller":[{"q":"Есть данные, что чтение переписки предотвращает трагедии?","a":"Цифр не называю. Механизм прямой: вербовка и склонение идут в личке, а полиции нужны факты оттуда."},{"q":"Часть родителей — тираны. Вы даёте им легальный инструмент?","a":"Даём условия: угроза жизни, последний шаг, отчёт после. Злоупотребление — опека, суд, лишение прав по ст. 69 СК."},{"q":"Нужны 112, врач, разговор. Зачем читать?","a":"Нужны. Но полиции нужны факты: кто пишет, что поручено. Их даёт переписка, и она запускает остальные шаги."}]},"protiv":{"criterion":"Судим по контролю: у права читать есть проверяющий или оно по настроению родителя?","theses":[{"tezis":"Исключение «при подозрении» работает как право читать всегда","pochemu":"Подозрение определяет сам родитель, проверяющего нет; тревожится любой родитель.","primer":"Подозрение без мерила: новый друг или пароль на телефоне сойдут за повод."},{"tezis":"Даже государству для ограничения тайны переписки нужен суд","pochemu":"Право «каждого» в ст. 23 без исключения для родителей; тревога — не решение суда.","primer":"Ст. 23 Конституции: ограничение тайны переписки — только на основании судебного решения."},{"tezis":"Тайное чтение разрушает единственный источник сигналов — доверие","pochemu":"Найдя следы чтения, подросток прячется: родитель теряет и канал, и контакт.","primer":"Второй аккаунт и исчезающие сообщения в Telegram: подросток скрывается, найдя следы."}],"killer":"Право читать «при подозрении» — это право читать всегда.","image":"Замок на дневнике: взломаешь раз — ребёнок заведёт новый, куда не доберёшься.","attacks":["Ст. 63–64 СК: право защищать, не читать тайно; ст. 65 — не против интересов ребёнка.","Вербовка начинается с платы, а деньги и переводы видны без чата.","Не произвольное — значит по правилам и с проверкой. У родителя их нет."],"ask":["Кто решает, что подозрение достаточное, — сам родитель, без проверки?","Ограничить тайну переписки можно только по суду; родителю — по своей тревоге?"],"expect":[{"q":"Подросток пишет о суициде. Тоже не читать?","a":"Действовать: поговорить, 112, врач, открыто взять телефон. Прочитал — отвечай, зачем; право без отчёта и есть слежка."},{"q":"Родитель отвечает за ребёнка. Разве у ребёнка есть тайны от него?","a":"Есть: ст. 16 Конвенции запрещает произвольное или незаконное вмешательство. Ответственность даёт право защищать, не вскрывать личное без проверки."},{"q":"Ребёнку 12, а не 17. Тоже тайна переписки?","a":"Границы растут с возрастом: у 12-летнего больше открытого контроля — правила, настройки, договорённости. Тайное чтение всё равно нет."}],"infokiller":[{"q":"Подростков вербуют через мессенджеры. Родитель должен ждать?","a":"Нет: разговор, открытые правила, жалоба в мессенджер и полицию. Признаки видны раньше, чем тайное чтение найдёт вербовку."},{"q":"Есть данные, что слежка вредит? Назовите цифры.","a":"Сводной российской статистики не назову. Опираюсь на механизм: раскрытая слежка уводит в закрытые аккаунты."},{"q":"Закон прямо разрешает родителям читать переписку?","a":"Прямой нормы не знаю. Есть обязанность воспитывать (ст. 63 СК) и защита от произвольного вмешательства (ст. 16 Конвенции)."}]},"arsenal":{"stats":[{"fact":"Конвенция ООН запрещает произвольное или незаконное вмешательство в тайну корреспонденции ребёнка","source":"Конвенция ООН о правах ребёнка, ст. 16","year":1989,"url":"https://www.un.org/ru/documents/decl_conv/conventions/childcon.shtml","verified":true},{"fact":"Вред при крайней необходимости не преступление, если опасность нельзя устранить иначе","source":"Уголовный кодекс РФ, ст. 39","year":2026,"url":"https://www.consultant.ru/document/cons_doc_LAW_10699/68eac2d2c39341d4a45238bffce4ea253949a106/","verified":true}],"quote":{"text":"Во всех действиях в отношении детей … первоочередное внимание уделяется наилучшему обеспечению интересов ребенка.","author":"Конвенция ООН о правах ребёнка, ст. 3, п. 1","verified":true,"url":"https://www.un.org/ru/documents/decl_conv/conventions/childcon.shtml"},"life":"Вспомни, как сам скрывал проблему в чате от родителей и что помогло, если помогло. Только реальное."},"traps":[{"problem":"Соперник скажет: вы легализуете слежку за каждым подростком.","exit":"Назвать условия: угроза жизни, последний шаг после разговора, отчёт и проверка опекой."},{"problem":"Суицидальный кейс: «вы за то, чтобы ребёнок погиб?»","exit":"Развести: действовать не значит читать тайно. 112, врач, открытое изъятие телефона."},{"problem":"Соперник: КС разрешил смотреть изъятый телефон без суда (№ 189-О, 2018).","exit":"Это следствие по уголовному делу и законное изъятие. Родителя «по тревоге» закон так не уполномочивает."}],"verdict":{"winner":"za","why":"Ошибка несимметрична: Против сам допускает открыто взять телефон при угрозе суицида — «независимо от обстоятельств» не держится. Конвенция запрещает лишь произвольное или незаконное вмешательство, а «чтение вместе» не работает, когда подросток под куратором молчит."}},"okr-08":{"core":"Льгота за штамп в паспорте: опора семье или налог на выбор?","za":{"criterion":"Судите по общему бюджету: налог должен видеть семью, а не двух одиночек.","theses":[{"tezis":"Закон уже считает супругов одним хозяйством","pochemu":"Доходы и имущество общие (ст. 34 СК), по общим долгам отвечает общее имущество.","primer":"Единое пособие и семейная выплата 2026 считают доход семьи, не одного человека."},{"tezis":"Разный режим — разный налог: это не дискриминация","pochemu":"Равенство — одинаково к одинаковым; сожители имущество и долги автоматически не делят.","primer":"Ст. 220 НК: супруги сами распределяют между собой расходы на общее жильё."},{"tezis":"Брак — публичные обязательства, которые остаются и после развода","pochemu":"Государство видит обязательства, а не чувства; льгота — их цена.","primer":"Алименты бывшему супругу — по суду (ст. 90 СК); супруг наследует первым (ст. 1142 ГК)."}],"killer":"Налог считает человека, а живёт семья с одним кошельком.","image":"Семейный тариф: двое делят счёт и риски, поэтому платят иначе, чем одиночки.","attacks":["Бездетная пара тоже несёт обязательства; одиноким родителям — детские меры, одно другому не мешает.","Фиктивные разводы — обман ради пособия по бедности; лечится контролем, а не отказом от принципа.","Критика сплиттинга — довод настроить его: потолок, бонус за детей, учёт занятости."],"ask":["Пособия считают доход семьи. Почему налог должен считать каждого отдельно?","Чем налогово семья с общим бюджетом отличается от соседей по квартире?"],"expect":[{"q":"Какую льготу за брак вы защищаете? В России её нет.","a":"Верно, совместного налога нет. Защищаю принцип: налог учитывает обязательства пары. Форма — настройка, хоть вычет на супруга-иждивенца."},{"q":"Льгота уйдёт бездетной паре, а одинокая мать её не получит. Где справедливость?","a":"Брак — обязательства: поддержка друг друга (ст. 89), алименты после развода (ст. 90), общее имущество (ст. 34). Одиноким родителям — детские меры."},{"q":"Единое пособие 2023: фиктивные разводы. Штамп ломает поведение?","a":"Это пособие по бедности: обман лечит проверка доходов. Налоговый учёт семьи про общий бюджет, а не про выплату."}],"infokiller":[{"q":"Данные: льготы для браков увеличивают число браков или детей?","a":"Цифр не назову и эффекта не обещаю. Цель — налог видит общий бюджет семьи. Детские меры остаются отдельно."},{"q":"ОЭСР зовёт реформировать сплиттинг, МВФ — снизить налог второму работнику. Что ответите?","a":"Критика реальна. Отсюда настройка: потолок, бонус за детей, отдельный учёт второго дохода. Ст. 6 Основного закона защищает брак отдельно."},{"q":"Ст. 38 защищает мать с ребёнком. Одинаковый доход, разный налог: дискриминация?","a":"Не из-за статуса, а из-за режима: у пары общее имущество и взаимные обязательства. Мать с ребёнком защищена детскими вычетами."}]},"protiv":{"criterion":"Судим по нагрузке: одинаковые расходы на детей и уход — одинаковый налог, с печатью или без.","theses":[{"tezis":"Льгота за штамп уходит и бездетным парам, мимо одиноких родителей","pochemu":"Помогать надо там, где расходы, а брак — ещё не дети.","primer":"Даже семейная налоговая выплата 2026 привязана к детям и доходу, не к браку."},{"tezis":"Привязка выплат к штампу ломает поведение: люди меняют статус, а не жизнь","pochemu":"Где статус даёт деньги, его подгоняют на бумаге.","primer":"Единое пособие 2023: сообщали о фиктивных разводах; Минтруд предлагал менять учёт доходов."},{"tezis":"Сплиттинг бьёт по второму работнику и нужен лишь верхним доходам","pochemu":"Доход второго супруга облагается по ставке первого; работать невыгодно, чаще женщинам.","primer":"ОЭСР советует Германии реформировать совместный налог пар, МВФ — снизить налог второму работнику."}],"killer":"Штамп — не нагрузка: налог должен считать детей и уход.","image":"Билет по штампу: платит меньше тот, у кого печать, а не расходы.","attacks":["Общее жильё сожители оформляют в долевую собственность; общий бюджет есть и без штампа.","Сожители тоже покупают жильё и берут ипотеку вместе: режим разный, нагрузка та же.","Алименты бывшему супругу — только по суду и узкому кругу, а льгота — каждой паре каждый год."],"ask":["Совместного налога супругов в России нет. Какую льготу вы защищаете?","Вдова с детьми: чем её нагрузка меньше, чем у пары со штампом?"],"expect":[{"q":"Супруги обязаны поддерживать друг друга и после развода (ст. 89, 90 СК). Сожители нет.","a":"Да, но алименты через суд — узкий круг: нетрудоспособный нуждающийся, беременность, уход за ребёнком до трёх лет или ребёнком-инвалидом. Льгота же уйдёт всем парам."},{"q":"Общий бюджет супругов меняет способность платить. Разве нет?","a":"Меняет, но общий бюджет есть и у вдовы с детьми, и у пары без штампа. Критерий — иждивенцы и уход, не регистрация."},{"q":"Сожители могут расписаться и получить льготу. В чём дискриминация?","a":"Брак не у всех есть: вдова, одинокая мать, опекун. А нагрузка у них есть."}],"infokiller":[{"q":"Ст. 38 Конституции защищает семью. Льгота этим оправдана?","a":"Ст. 38 защищает семью, а не штамп: мать с ребёнком тоже семья. Разный налог нужно обосновать нагрузкой, не статусом."},{"q":"Германия и Франция так делают. Почему вы умнее?","a":"ОЭСР советует Германии реформировать совместный налог пар, МВФ — снизить налог второму работнику. Это цена налога за штамп."},{"q":"Что вы предлагаете вместо льготы за брак?","a":"Поддержку по нагрузке: вычеты на детей и семейная налоговая выплата с 2026 для семей с двумя и более детьми. Не против семьи, а за точность."}]},"arsenal":{"stats":[{"fact":"Доходы и имущество, нажитые в браке, — общая совместная собственность супругов","source":"Семейный кодекс РФ, ст. 34","year":1995,"url":"https://www.consultant.ru/document/cons_doc_LAW_8982/","verified":true},{"fact":"С 2025 НДФЛ: 13% до 2,4 млн в год, 15% до 5 млн, 18% до 20 млн, 20% до 50 млн, 22% выше","source":"НК РФ, ст. 224; ФЗ от 12.07.2024 № 176-ФЗ","year":2025,"url":"https://www.nalog.gov.ru/rn27/news/tax_doc_news/15693056/","verified":true}],"quote":{"text":"Материнство и детство, семья находятся под защитой государства.","author":"Конституция РФ, ст. 38, ч. 1","verified":true},"life":"Вспомни реальную семью, где один зарабатывает, другой растит детей, и как они делят бюджет. Только реальное."},"traps":[{"problem":"Спор о том, есть ли в РФ льгота именно за брак.","exit":"Признать: общего налога супругов нет. Спорить о принципе: налог по общему бюджету или по нагрузке. Цифр не выдумывать."},{"problem":"Смешать льготу за брак и льготу за детей.","exit":"Развести: вычеты на детей отдельно; брак даёт общее имущество и взаимные обязательства."},{"problem":"Обвинят: вы против семьи, или: вы за штамп.","exit":"Вернуться к критерию, не к ценностям. Семья шире штампа: вдова, мать с ребёнком, опекун; поддержку считаем по нагрузке."}],"verdict":{"winner":"za","why":"Общее имущество (ст. 34) и обязательства после развода (ст. 90) есть только у супругов; нагрузка этого не объясняет. Слабое место ЗА: в РФ самой льготы за брак нет, он это признал."}},"okr-09":{"core":"Спор о том, может ли государство отбирать у человека допуск к воспитанию до вреда.","za":{"criterion":"Проверяем до вреда и только по документам: приговор и лишение прав.","theses":[{"tezis":"Государство уже решает, кто достоин детей, но слишком поздно.","pochemu":"Лишение прав работает после вреда; проверка заранее его предотвращает.","primer":"Ст. 69 СК: прав лишают, в том числе за жестокое обращение, когда ребёнок уже пострадал."},{"tezis":"Ребёнок у родителя, уже лишённого прав, — зона риска; проверять нужно сразу.","pochemu":"Узко и без «достойности»: опасность уже доказал суд по прошлому ребёнку.","primer":"Мэриленд, закон Birth Match: при рождении у лишённого прав родителя проверяют безопасность."},{"tezis":"Нужен узкий фильтр от тяжёлых случаев, а не оценка «достойных».","pochemu":"Тот же риск — тот же фильтр, но только судимость: доход и здоровье не берём.","primer":"Ст. 127 СК: усыновить нельзя с судимостью за преступления против жизни и здоровья."}],"killer":"Права взрослого кончаются там, где начинается безопасность ребёнка.","image":"Спасательный жилет: его надевают до воды, а не после утопления.","attacks":["Патронаж — помощь семье, а не клеймо. Ребёнок о проверке даже не узнает.","Санкция не принуждение: без допуска ребёнок остаётся в семье с патронажем.","Суд по факту работает после вреда. Цена ошибки — довод за раннюю проверку."],"ask":["Сколько вреда должно случиться, прежде чем государство получит право вмешаться?","Если лишённый прав родитель родит снова, кто защитит нового ребёнка?"],"expect":[{"q":"Бедным и людям с инвалидностью откажут в детях?","a":"Нет: из ст. 127 берём только судимость за насилие и лишение прав. Бедность, здоровье, доход и убеждения не входят."},{"q":"Это же запрет рожать. Как вы его обеспечите?","a":"Рождение не запрещаем. Ребёнок остаётся в семье: патронаж, план помощи, опекун при отказе. Допуск касается воспитания."},{"q":"Лицензия — разрешение до события. Ваш критерий срабатывает после суда.","a":"Критерий срабатывает по документам до вреда: приговор уже есть, а ребёнка ещё нет. Это профилактика, не наказание."}],"infokiller":[{"q":"Это евгеника. Почему ваша лицензия не приведёт к ней?","a":"Евгеника отбирала по происхождению и здоровью. У нас узкий порог по приговору суда, с обжалованием: критерий — вред."},{"q":"Есть страна, где лицензия работает и дети в безопасности?","a":"Полной лицензии нет. Ближайший аналог — Birth Match в Мэриленде: проверка, если родил лишённый прав родитель."},{"q":"Это нарушает ст. 38 Конституции: семья под защитой государства?","a":"Ст. 38 защищает детство и семью. Защита ребёнка от опасного взрослого — тоже защита семьи."}]},"protiv":{"criterion":"Право иметь детей базовое: ограничивать можно по доказанному вреду, не по прогнозу.","theses":[{"tezis":"Лицензия без санкции — декорация, с санкцией — вторжение в тело.","pochemu":"Запрет рожать обеспечивается только принуждением: контрацепция, аборт, изъятие. Всё это недопустимо.","primer":"ФЗ-323, ст. 57: стерилизация — только по заявлению гражданина; исключение — недееспособные, по суду."},{"tezis":"Лицензия бьёт по самому ребёнку: родившийся без допуска сразу под надзором и клеймом.","pochemu":"Интересы ребёнка — главный довод «За», но надзор с рождения вредит именно ребёнку.","primer":"Конституция, ст. 38: забота о детях, их воспитание — равное право и обязанность родителей."},{"tezis":"Точный инструмент уже есть: суд по факту вреда, не анкета.","pochemu":"Суд оценивает реальную семью и доказательства. Лицензия угадывает будущее до рождения.","primer":"Ст. 69–70 и 77 СК: суд лишает прав, при угрозе опека отбирает ребёнка сразу."}],"killer":"Спасать детей можно судом по факту, не анкетой до рождения.","image":"Сито, которое пропускает справки и задерживает любовь.","attacks":["Приговор за насилие над детьми или супругом — уже основание лишить прав: ст. 69 СК.","Лишение прав идёт после рождения. До рождения у вас нет ни механизма, ни санкции.","Защита гипотетического ребёнка ценой реального права реального человека — не защита."],"ask":["Кто составит список «достойных» и кто проверит самих проверяющих?","Женщина забеременела без допуска: что именно с ней и ребёнком произойдёт?"],"expect":[{"q":"Водить без прав нельзя. Почему рожать без проверки можно?","a":"Права дают за навык, риск несут чужие. Родительство — право человека, а не услуга; ограничение — судом после вреда."},{"q":"Дети страдают в плохих семьях. Вы готовы с этим мириться?","a":"Нет. Усиливаем раннее вмешательство: патронаж, помощь семье, быстрый суд при вреде. Это защищает реальных детей."},{"q":"Усыновителей же проверяют. Чем биологические родители лучше?","a":"При усыновлении государство передаёт уже существующего ребёнка. Рождение — личное право человека; переносить проверку нельзя."}],"infokiller":[{"q":"Какой критерий вы допустите? Хоть какой-нибудь?","a":"Суд по доказанному вреду: ст. 69–70 СК уже работают. Новый институт добавляет лишь прогноз и его ошибки."},{"q":"Хотите сказать, любой человек готов к ребёнку?","a":"Нет. Готовность создают курсы, патронаж, помощь семье. Но «не готов» решает сам человек, а не комиссия."},{"q":"Пусть лицензия будет добровольной. Что в этом плохого?","a":"Добровольная — не лицензия. Если без неё нельзя име
